name: GPT disk identity safety gate

on:
  push:
    branches:
      - integration/gpt-fd-pinned-readonly-dev-20261122
      - integration/gpt-snapshot-s01-313-315-dev-20261122
      - dev
  pull_request:
    paths:
      - 'assets/live/libertix_disk_identity_gate.py'
      - 'auto_tests/tests/test_disk_identity_gate.py'
      - 'auto_tests/tests/test_disk_identity_snapshot_semantics.py'
      - '.github/workflows/gpt-identity-gate.yml'

permissions:
  contents: read

jobs:
  gpt-identity-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned pytest and Ruff
        run: python -m pip install 'pytest==9.0.2' 'ruff==0.13.3' 'jsonschema>=4,<5' 'pyyaml>=6,<7'
      - name: Compile, lint and check semantic test formatting
        run: |
          python -m compileall -q assets/live/libertix_disk_identity_gate.py auto_tests/tests/test_disk_identity_gate.py auto_tests/tests/test_disk_identity_snapshot_semantics.py auto_tests/tools/gpt_fd_crosscheck_offline_compat.py
          python -m ruff check --config auto_tests/pyproject.toml assets/live/libertix_disk_identity_gate.py auto_tests/tests/test_disk_identity_snapshot_semantics.py
          python -m ruff format --check --config auto_tests/pyproject.toml auto_tests/tests/test_disk_identity_snapshot_semantics.py
      - name: Verify read-only GPT identity and adversarial cases
        run: python -m pytest -q auto_tests/tests/test_disk_identity_gate.py auto_tests/tests/test_disk_identity_snapshot_semantics.py auto_tests/tests/test_live_storage_preflight.py auto_tests/tests/test_installation_contracts.py
      - name: Validate offline workflow syntax and least privilege
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          path = Path(".github/workflows/gpt-identity-gate.yml")
          raw = path.read_text(encoding="utf-8")
          data = yaml.safe_load(raw)
          assert data["permissions"] == {"contents": "read"}
          assert data["jobs"]["gpt-identity-gate"]["runs-on"] == "ubuntu-latest"
          assert "workflow_dispatch" not in raw
          PY
