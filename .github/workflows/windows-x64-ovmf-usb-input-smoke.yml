name: Windows ISO lab loopback VNC EFI keyboard smoke (synthetic GRUB only)

on:
  push:
    branches:
      - feature/windows-eval-uefi-usb-keyboard-proof
      - fix/windows-ovmf-grub-enter-witness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-uefi-usb-keyboard:
    name: Real QEMU/KVM OVMF consumes exactly one loopback VNC Enter
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Enforce hosted VM boundaries, compile and regression test
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          test "$(uname -m)" = x86_64
          python3 -m py_compile auto_tests/tools/windows_x64_tcg_firstboot.py
          python3 -m unittest discover -s auto_tests -p 'test_windows_x64_kvm_opt_in.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_windows_x64_iso_boot_key.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_windows_x64_clean_poweroff_gate.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_windows_x64_tcg_unattend_contract.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_windows_x64_winre_baseline_contract.py' -v
      - name: Install QEMU/KVM OVMF and signed-distro unrelated synthetic GRUB ISO tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf grub-efi-amd64-bin grub-common xorriso mtools
          test -c /dev/kvm && test ! -L /dev/kvm
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
      - name: Prove guest UEFI keyboard input from private loopback VNC
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          import shutil
          import socket
          import struct
          import subprocess
          import sys
          import tempfile
          import time
          from pathlib import Path

          assert os.environ["RUNNER_TEMP"] == "/home/runner/work/_temp"
          assert os.environ["RUNNER_ENVIRONMENT"] == "github-hosted"
          assert os.environ["GITHUB_REPOSITORY"] == "LMhdez/gaslux"
          def recv_exact(conn, count):
              data = b""
              while len(data) < count:
                  chunk = conn.recv(count - len(data))
                  if not chunk:
                      raise RuntimeError("RFB server disconnected early")
                  data += chunk
              return data

          def send_loopback_vnc_enter():
              # No external GUI, HMP key, physical host input, or guest network.
              # This RFB client only connects to QEMU on localhost port 5979.
              with socket.create_connection(("127.0.0.1", 5979), timeout=5) as conn:
                  conn.settimeout(5)
                  version = recv_exact(conn, 12)
                  if version != b"RFB 003.008\n":
                      raise RuntimeError("unexpected RFB protocol version")
                  conn.sendall(version)
                  count = recv_exact(conn, 1)[0]
                  if count == 0 or count > 8:
                      raise RuntimeError("invalid RFB security choices")
                  types = recv_exact(conn, count)
                  if 1 not in types:
                      raise RuntimeError("unexpected loopback RFB security")
                  conn.sendall(b"\x01")
                  if recv_exact(conn, 4) != b"\x00\x00\x00\x00":
                      raise RuntimeError("RFB security handshake refused")
                  conn.sendall(b"\x01")
                  server_init = recv_exact(conn, 24)
                  desktop_name_len = struct.unpack(">I", server_init[20:24])[0]
                  if not (0 < desktop_name_len <= 1024):
                      raise RuntimeError("invalid RFB server identity")
                  recv_exact(conn, desktop_name_len)
                  # Exactly one X11 Return keysym down/up (0xFF0D).
                  conn.sendall(struct.pack(">BBHI", 4, 1, 0, 0xFF0D))
                  time.sleep(.35)
                  conn.sendall(struct.pack(">BBHI", 4, 0, 0, 0xFF0D))

          with tempfile.TemporaryDirectory(
              prefix="gaslux-win-x64-", dir=os.environ["RUNNER_TEMP"]
          ) as tmp:
              work = Path(tmp)
              root = work / "iso-root"
              (root / "boot" / "grub").mkdir(parents=True)
              (root / "boot" / "grub" / "grub.cfg").write_text(
                  "set timeout=0\n"
                  "serial --unit=0 --speed=115200\n"
                  "terminal_output serial\n"
                  "terminal_input console\n"
                  "echo GASLUX_USB_GUEST_INPUT_READY=1\n"
                  # grub sleep --interruptible ignores Enter (it accepts ESC/F4/Shift).
                  # read is the actual keyboard witness for the HMP Enter key.
                  "read gaslux_guest_enter\n"
                  "echo GASLUX_USB_GUEST_INPUT_ACCEPTED=1\n"
                  "sleep 10\n",
                  encoding="utf-8",
              )
              iso = work / "synthetic-grub-only.iso"
              subprocess.run(
                  ["grub-mkrescue", "--xorriso=xorriso", "-o", str(iso), str(root)],
                  check=True, stdout=subprocess.DEVNULL,
              )
              vars_file = work / "ovmf-vars.fd"
              shutil.copyfile("/usr/share/OVMF/OVMF_VARS_4M.fd", vars_file)
              hmp = work / "initial-installer-hmp.sock"
              serial = work / "serial.log"
              args = [
                  "qemu-system-x86_64", "-machine", "q35,accel=kvm,smm=on",
                  "-global", "driver=cfi.pflash01,property=secure,value=on",
                  "-cpu", "host", "-smp", "2", "-m", "1024",
                  # Loopback-only ephemeral VGA frontend; HMP remains private Unix.
                  # QEMU -display none can leave headless keyboard routing unproven.
                  "-display", "vnc=127.0.0.1:79", "-vga", "std",
                  "-monitor", f"unix:{hmp},server,nowait", "-net", "none",
                  # Use built-in Q35 PS/2 firmware keyboard; USB needs separate proof.
                  "-device", "ich9-ahci,id=lab_sata",
                  "-drive", f"if=none,id=lab_iso,media=cdrom,readonly=on,format=raw,file={iso}",
                  "-device", "ide-cd,drive=lab_iso,bus=lab_sata.1",
                  "-drive", "if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.secboot.fd",
                  "-drive", f"if=pflash,format=raw,file={vars_file}",
                  "-serial", f"file:{serial}", "-boot", "order=d",
              ]
              err = (work / "qemu.err").open("xb")
              p = subprocess.Popen(
                  args, stderr=err, stdout=subprocess.DEVNULL
              )
              try:
                  deadline = time.monotonic() + 45
                  ready = False
                  injected = False
                  accepted = False
                  while time.monotonic() < deadline:
                      if p.poll() is not None:
                          raise RuntimeError(f"QEMU exited before USB witness: {p.returncode}")
                      observed = serial.read_bytes() if serial.is_file() else b""
                      if b"GASLUX_USB_GUEST_INPUT_READY=1" in observed:
                          ready = True
                      if b"GASLUX_USB_GUEST_INPUT_ACCEPTED=1" in observed:
                          if not injected:
                              raise RuntimeError("GRUB did not block for a real key")
                          accepted = True
                          break
                      if ready and not injected:
                          print("GASLUX_SYNTHETIC_OVMF_VNC_KEY_REQUEST=1", flush=True)
                          time.sleep(.6)
                          send_loopback_vnc_enter()
                          print("GASLUX_SYNTHETIC_OVMF_VNC_KEY_SENT=1", flush=True)
                          injected = True
                      time.sleep(.15)
                  if not ready or not injected or not accepted:
                      raise RuntimeError(
                          "USB keyboard input was not independently received by the guest"
                      )
                  print("GASLUX_SYNTHETIC_OVMF_VNC_GUEST_ENTER_RECEIVED=1")
              except Exception:
                  if serial.is_file():
                      print(serial.read_bytes()[-10000:].decode(errors="replace"))
                  raise
              finally:
                  if p.poll() is None:
                      p.kill()
                  p.wait(timeout=20)
                  err.close()
          PY
          {
            echo 'PASS: synthetic GRUB EFI guest consumed a loopback-only VNC Enter.'
            echo 'No Microsoft Windows ISO was used, no Windows Setup or OS boot verified.'
            echo 'No physical disks or host EFI/BCD/WinRE were modified.'
          } >> "$GITHUB_STEP_SUMMARY"
