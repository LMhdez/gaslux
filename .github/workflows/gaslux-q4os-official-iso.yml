name: Q4OS 6.10 official ISO and disposable native GRUB test (lab only)

on:
  push:
    branches:
      - feature/q4os-native-preflight
      - feature/q4os-ovmf-verified-virtio-live
      - feature/q4os-verified-calamares-target-lab
      - feature/q4os-native-grub-reboot-lab
      - feature/q4os-native-hook-source-audit
    paths:
      - '.github/workflows/gaslux-q4os-official-iso.yml'
      - 'auto_tests/tools/gaslux_candidate_live_boot.sh'
      - 'auto_tests/tools/gaslux_q4os_calamares_probe.sh'
      - 'auto_tests/tests/test_q4os_calamares_probe.py'
      - 'assets/live/gaslux_q4os_calamares_policy.py'
      - 'assets/live/gaslux_q4os_hook_policy.py'
      - 'auto_tests/tests/test_q4os_calamares_policy.py'
      - 'auto_tests/tools/gaslux_q4os_installed_root_lab.sh'
      - 'auto_tests/tests/test_q4os_installed_root_lab.py'
      - 'auto_tests/tests/test_q4os_native_grub_guest.py'
      - 'auto_tests/tools/gaslux_q4os_native_grub_guest.sh'
      - 'auto_tests/tests/test_candidate_live_boot_transport.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  q4os-native-installed-grub-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare isolated ISO lab tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends aria2 squashfs-tools xorriso ovmf qemu-system-x86 grub-common grub-efi-amd64-bin mtools dosfstools gdisk
      - name: Download Q4OS 6.10 r2 from project mirror, independently verify public SHA-256
        shell: bash
        env:
          Q4OS_SHA256: 1df141eaa342bbfd0092791a60f1ae9cf5230e8ebb472f87fcb463203e3eb95d
          Q4OS_SOURCE: https://downloads.sourceforge.net/project/q4os/stable/q4os-6.10-x64.r2.iso
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/gaslux-q4os"
          cd "$RUNNER_TEMP/gaslux-q4os"
          aria2c --continue=true --split=4 --max-connection-per-server=4 \
            --max-tries=5 --retry-wait=8 --timeout=60 --connect-timeout=30 \
            --file-allocation=none --check-integrity=true \
            --checksum="sha-256=$Q4OS_SHA256" -o q4os.iso "$Q4OS_SOURCE"
          printf '%s  %s\n' "$Q4OS_SHA256" q4os.iso | sha256sum --check --status
          test "$(stat -c '%s' q4os.iso)" -gt 1500000000
          test "$(stat -c '%s' q4os.iso)" -lt 3000000000
          echo "GASLUX_Q4OS_FILE=$RUNNER_TEMP/gaslux-q4os/q4os.iso" >> "$GITHUB_ENV"
          echo "Independent release SHA-256 matched the official Q4OS source: $Q4OS_SHA256"
      - name: Inspect verified native ISO and live system evidence read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          w="$RUNNER_TEMP/gaslux-q4os"
          mkdir -p "$w/iso-root" "$w/evidence"
          sudo mount -o loop,ro,nosuid,nodev,noexec "$GASLUX_Q4OS_FILE" "$w/iso-root"
          trap 'sudo umount "$w/iso-root" || true' EXIT
          find "$w/iso-root" -maxdepth 4 -type f | sed "s|$w/iso-root/||" | sort > "$w/evidence/iso-files.txt"
          find "$w/iso-root" -maxdepth 4 -type f -name '*.squashfs' > "$w/evidence/squashfs-paths.txt"
          test -s "$w/evidence/squashfs-paths.txt" || {
            echo "::error::Verified Q4OS ISO does not expose a known squashfs live root"
            exit 1
          }
          while IFS= read -r squash; do
            unsquashfs -ll "$squash" > "$w/evidence/rootfs-listing.txt"
            if unsquashfs -cat "$squash" etc/os-release > "$w/evidence/os-release.txt" 2>/dev/null; then
              echo "Extracted Q4OS live os-release from verified mounted ISO"
              break
            fi
          done < "$w/evidence/squashfs-paths.txt"
          test -s "$w/evidence/os-release.txt" || {
            echo "::error::Live os-release was not found in an ISO squashfs"
            exit 1
          }
          cat "$w/evidence/os-release.txt"
          grep -Eq '^ID="?debian"?$' "$w/evidence/os-release.txt" || {
            echo "::error::Q4OS live root did not identify its Debian base"
            exit 1
          }
          grep -Eq '^VERSION_ID="?13"?$' "$w/evidence/os-release.txt" || {
            echo "::error::Q4OS 6.10 live base did not identify Debian 13"
            exit 1
          }
          grep -E 'calamares|q4os_version' "$w/evidence/rootfs-listing.txt" |
            head -100 > "$w/evidence/installer-paths.txt" || true
          test -s "$w/evidence/installer-paths.txt" || {
            echo "::error::Q4OS native Calamares/version marker not discovered"
            exit 1
          }
          (cd "$w/evidence" && sha256sum *.txt > manifest.sha256)
          echo "PASS: verified official Q4OS ISO, real squashfs and live Debian 13 identity."
          echo "NOT TESTED: Q4OS installed root, Windows 10/11 dual boot or recovery."
      - name: Extract effective Q4OS Calamares settings from the same pinned ISO (read-only)
        shell: bash
        env:
          Q4OS_SHA256: 1df141eaa342bbfd0092791a60f1ae9cf5230e8ebb472f87fcb463203e3eb95d
        run: |
          set -Eeuo pipefail
          bash -n auto_tests/tools/gaslux_q4os_calamares_probe.sh
          bash auto_tests/tools/gaslux_q4os_calamares_probe.sh \
            "$GASLUX_Q4OS_FILE" "$Q4OS_SHA256" \
            "$RUNNER_TEMP/gaslux-q4os/evidence"
          echo 'Read-only effective Calamares configurations saved for independent audit.'
      - name: Audit Q4OS native Calamares unpack/GRUB/EFI policy (fail closed)
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get install -y --no-install-recommends python3-yaml
          (cd "$RUNNER_TEMP/gaslux-q4os/evidence" && sha256sum -c calamares-files.sha256)
          PYTHONPATH=assets/live python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from gaslux_q4os_calamares_policy import audit_q4os_calamares

          root = Path(os.environ['RUNNER_TEMP']) / 'gaslux-q4os/evidence'
          result = audit_q4os_calamares(root)
          print(json.dumps(result, sort_keys=True, indent=2))
          (root / 'native-calamares-audit.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          if result['installationAuthorized'] or result['windowsEspFallbackWriteAuthorized']:
              raise SystemExit('Q4OS native Calamares must remain lab-only')
          PY
      - name: Audit exact native Q4OS hooks without executing them
        shell: bash
        run: |
          set -Eeuo pipefail
          w="$RUNNER_TEMP/gaslux-q4os/evidence"
          (cd "$w/native-hooks" && sha256sum -c q4os-hooks-files.sha256)
          PYTHONPATH=assets/live python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from gaslux_q4os_hook_policy import audit_q4os_native_hooks

          evidence = Path(os.environ['RUNNER_TEMP']) / 'gaslux-q4os/evidence'
          result = audit_q4os_native_hooks(evidence)
          print(json.dumps(result, indent=2, sort_keys=True))
          (evidence / 'native-hook-source-audit.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          if result['nativeHookCommandsExecuted'] or result['hookExecutionAuthorized']:
              raise SystemExit('Native Q4OS source inspection must never execute hooks')
          PY
          echo 'Q4OS scripts and module descriptors checked as inert ISO-origin evidence.'
      - name: Fetch native Debian 13 EFI GRUB package through signed APT metadata (lab only)
        shell: bash
        run: |
          set -Eeuo pipefail
          packages="$RUNNER_TEMP/gaslux-q4os/packages"
          mkdir -p "$packages"
          docker run --rm --network bridge \
            --security-opt=no-new-privileges \
            -v "$packages:/out" debian:trixie-slim \
            bash -Eeuo pipefail -c '
              apt-get -qq update
              mkdir -p /tmp/grub-pkg
              cd /tmp/grub-pkg
              apt-get download grub-efi-amd64-bin grub-efi-amd64-unsigned
              packages=(grub-efi-amd64-unsigned_*.deb grub-efi-amd64-bin_*.deb)
              test "${#packages[@]}" -eq 2
              unsigned_version="$(dpkg-deb -f "${packages[0]}" Version)"
              bin_version="$(dpkg-deb -f "${packages[1]}" Version)"
              test "$unsigned_version" = "$bin_version"
              printf "Signed APT GRUB EFI package versions: %s\n" "$bin_version"
              cp -- "${packages[@]}" /out/
              cd /out
              sha256sum grub-efi-amd64-*.deb > grub-efi-amd64-bundle.sha256
            '
          (cd "$packages" && sha256sum -c grub-efi-amd64-bundle.sha256)
          echo 'Debian repository Release metadata was authenticated by container apt.'
          echo 'No guest network or host hardware disk is exposed.'
      - name: Install Q4OS native GRUB inside owned guest and prove two installed disk boots
        shell: bash
        env:
          GASLUX_Q4OS_ALLOW_DISPOSABLE_INSTALL: yes
          GASLUX_Q4OS_NATIVE_GRUB_LAB: yes
          Q4OS_SHA256: 1df141eaa342bbfd0092791a60f1ae9cf5230e8ebb472f87fcb463203e3eb95d
        run: |
          set -Eeuo pipefail
          bash -n auto_tests/tools/gaslux_q4os_installed_root_lab.sh
          bash -n auto_tests/tools/gaslux_q4os_native_grub_guest.sh
          bash auto_tests/tools/gaslux_q4os_installed_root_lab.sh \
            "$GASLUX_Q4OS_FILE" "$Q4OS_SHA256" \
            "$RUNNER_TEMP/gaslux-q4os/evidence"
          echo 'Only disposable guest GPT was formatted; native GRUB installed in guest and second boot verified.'
      - name: Boot actual verified Q4OS live ISO in disposable OVMF/QEMU
        shell: bash
        env:
          Q4OS_SHA256: 1df141eaa342bbfd0092791a60f1ae9cf5230e8ebb472f87fcb463203e3eb95d
          GASLUX_CANDIDATE_BOOT_EVIDENCE_DIR: ${{ runner.temp }}/gaslux-q4os/evidence/guest
        run: |
          set -Eeuo pipefail
          bash -n auto_tests/tools/gaslux_candidate_live_boot.sh
          bash auto_tests/tools/gaslux_candidate_live_boot.sh \
            q4os "$GASLUX_Q4OS_FILE" "$Q4OS_SHA256"
      - name: Retain provenance-linked disposable guest laboratory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q4os-official-610-disposable-lab-evidence
          path: ${{ runner.temp }}/gaslux-q4os/evidence/
          if-no-files-found: warn
          retention-days: 14
