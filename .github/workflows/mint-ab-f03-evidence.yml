name: Mint A/B F-03 required forensic evidence (NO GUESTS)

on:
  push:
    branches:
      - fix/mint-ab-f03-evidence-completeness-20261121
    paths:
      - .github/workflows/mint-ab-f03-evidence.yml
      - auto_tests/tools/windows_mint_ab_forensic.py
      - auto_tests/test_windows_mint_ab_forensic.py
  workflow_dispatch:

concurrency:
  group: mint-ab-f03-no-guests-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forensic-evidence:
    name: F-03 ESP Recovery evidence and F-01 F-02 regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Enforce fixed read-only hosted-runner identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          test "$GITHUB_REF" = refs/heads/fix/mint-ab-f03-evidence-completeness-20261121
          test "$RUNNER_TEMP" = /home/runner/work/_temp
      - name: Compile changed module and regression suite
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q auto_tests/tools/windows_mint_ab_forensic.py auto_tests/test_windows_mint_ab_forensic.py
      - name: F-03, F-01 F-02, Mint/Windows, capacity and synthetic contracts (mock guests ONLY)
        shell: bash
        run: |
          set -Eeuo pipefail
          for suite in \
            test_windows_mint_ab_forensic.py \
            test_windows_mint_ab_checkpoint.py \
            test_windows_mint_ab_capacity.py \
            test_windows_mint_ab_synthetic.py \
            test_windows_mint_ab_infrastructure.py \
            test_windows_mint_overlay_root.py \
            test_windows_x64_two_stage_boot.py; do
            python3 -m unittest discover -s auto_tests -p "$suite" -v
          done
      - name: Ruff lint and format (changed files)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --target "$RUNNER_TEMP/gaslux-ruff-0.15.20" --no-deps "ruff==0.15.20"
          export PYTHONPATH="$RUNNER_TEMP/gaslux-ruff-0.15.20"
          python3 -m ruff check auto_tests/tools/windows_mint_ab_forensic.py auto_tests/test_windows_mint_ab_forensic.py
          python3 -m ruff format --check auto_tests/tools/windows_mint_ab_forensic.py auto_tests/test_windows_mint_ab_forensic.py
      - name: Produce source-only Ruff formatting proposal on check failure
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="$RUNNER_TEMP/gaslux-ruff-0.15.20"
          python3 -m ruff format auto_tests/tools/windows_mint_ab_forensic.py auto_tests/test_windows_mint_ab_forensic.py
          python3 -m ruff check auto_tests/tools/windows_mint_ab_forensic.py auto_tests/test_windows_mint_ab_forensic.py
          python3 -m ruff format --check auto_tests/tools/windows_mint_ab_forensic.py auto_tests/test_windows_mint_ab_forensic.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in (
              Path("auto_tests/tools/windows_mint_ab_forensic.py"),
              Path("auto_tests/test_windows_mint_ab_forensic.py"),
          ):
              print("GASLUX_F03_RUFF_SOURCE=" + json.dumps({
                  "path": str(path),
                  "source": path.read_text(encoding="utf-8"),
              }, ensure_ascii=True))
          PY
