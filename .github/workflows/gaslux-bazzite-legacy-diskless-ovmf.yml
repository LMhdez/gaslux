name: Bazzite legacy ISO diskless OVMF observation (unsigned lab only)

on:
  push:
    branches:
      - feature/bazzite-legacy-iso-scout-20261118
    paths:
      - '.github/workflows/gaslux-bazzite-legacy-diskless-ovmf.yml'
      - 'auto_tests/tests/test_bazzite_legacy_diskless_ovmf_workflow.py'
  pull_request:
    paths:
      - '.github/workflows/gaslux-bazzite-legacy-diskless-ovmf.yml'
      - 'auto_tests/tests/test_bazzite_legacy_diskless_ovmf_workflow.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only VM isolation contracts and lint
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install pytest ruff PyYAML
          python -m pytest -q auto_tests/tests/test_bazzite_legacy_diskless_ovmf_workflow.py
          python -m ruff check --config auto_tests/pyproject.toml \
            auto_tests/tests/test_bazzite_legacy_diskless_ovmf_workflow.py
          python -m ruff format --check --config auto_tests/pyproject.toml \
            auto_tests/tests/test_bazzite_legacy_diskless_ovmf_workflow.py

  legacy-ovmf-diskless:
    needs: contracts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reserve private storage and check fixed laboratory ISO identity
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/bazzite-legacy-diskless"
          mkdir -m 700 "$work"
          mkdir bazzite-legacy-diskless-evidence
          iso_url='https://download.bazzite.gg/bazzite-stable-amd64.iso'
          expected_sha='9c8d06cd8e57f2274678edeb14b4b13a79b8117c70571a65199919a66305b5c7'
          expected_size=7907770368
          curl --fail --show-error --silent --head --location \
            --retry 3 --connect-timeout 20 --max-time 90 \
            --proto '=https' --proto-redir '=https' \
            "$iso_url" -o "$work/iso-head.txt"
          length=$(tr -d '\r' < "$work/iso-head.txt" \
            | awk 'tolower($1)=="content-length:" {n=$2} END {print n}')
          [[ "$length" == "$expected_size" ]] \
            || { echo 'Lab ISO length no longer matches; stopping before VM'; exit 1; }
          free_bytes=$(df -PB1 "$work" | awk 'NR==2 {print $4}')
          (( free_bytes >= expected_size + 2*1024*1024*1024 )) \
            || { echo 'Insufficient isolated runner scratch space'; exit 1; }
          printf '%s %s\n' "$expected_sha" "$expected_size" > "$work/lab-discovery-pin.txt"
          echo 'Unattested upstream ISO: quarantine observation only, NO INSTALL AUTHORITY'
      - name: Install isolated QEMU/KVM/OVMF and bounded screen observation tools
        shell: bash
        timeout-minutes: 18
        run: |
          set -Eeuo pipefail
          sudo env DEBIAN_FRONTEND=noninteractive \
            timeout --signal=TERM --kill-after=30s 300s apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive \
            timeout --signal=TERM --kill-after=30s 900s apt-get install -y -qq \
            qemu-system-x86 ovmf xorriso tesseract-ocr
          python -m pip install --user vncdotool Pillow
      - name: Download and verify exact unsigned legacy ISO lab bytes before boot
        shell: bash
        timeout-minutes: 65
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/bazzite-legacy-diskless"
          iso="$work/bazzite-stable-amd64.iso"
          url='https://download.bazzite.gg/bazzite-stable-amd64.iso'
          curl --fail --show-error --silent --location \
            --retry 7 --retry-all-errors --retry-delay 5 --continue-at - \
            --connect-timeout 30 --max-time 3400 \
            --proto '=https' --proto-redir '=https' "$url" -o "$iso"
          [[ $(stat -c '%s' "$iso") == 7907770368 ]] \
            || { echo 'ISO size mismatch'; exit 1; }
          echo '9c8d06cd8e57f2274678edeb14b4b13a79b8117c70571a65199919a66305b5c7  '"$iso" \
            | sha256sum --check --strict
          xorriso -indev "$iso" -report_el_torito plain \
            > "$work/efi-boot-catalog.txt" 2>&1
          grep -Eiq 'efi|0xef' "$work/efi-boot-catalog.txt" \
            || { echo 'UEFI El Torito not found'; exit 1; }
          printf '%s\n' 'ISO lab bytes verified against discovery pin; not signed or attested' \
            > bazzite-legacy-diskless-evidence/media-gate.txt
      - name: "Quarantined OVMF boot: optical only, no disk, network or installer input"
        shell: bash
        timeout-minutes: 15
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/bazzite-legacy-diskless"
          iso="$work/bazzite-stable-amd64.iso"
          if [[ -f /usr/share/OVMF/OVMF_CODE_4M.fd && -f /usr/share/OVMF/OVMF_VARS_4M.fd ]]; then
            code=/usr/share/OVMF/OVMF_CODE_4M.fd
            vars=/usr/share/OVMF/OVMF_VARS_4M.fd
          elif [[ -f /usr/share/OVMF/OVMF_CODE.fd && -f /usr/share/OVMF/OVMF_VARS.fd ]]; then
            code=/usr/share/OVMF/OVMF_CODE.fd
            vars=/usr/share/OVMF/OVMF_VARS.fd
          else
            echo 'No paired OVMF firmware'; exit 1
          fi
          cp "$vars" "$work/OVMF_VARS.disposable.fd"
          host_kib=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          (( host_kib >= 11*1024*1024 )) \
            || { echo 'Insufficient host RAM for 8 GiB ISO guest'; exit 1; }
          [[ -c /dev/kvm ]] || { echo 'KVM unavailable; do not silently substitute TCG'; exit 1; }
          sudo chmod 0666 /dev/kvm
          [[ -r /dev/kvm && -w /dev/kvm ]] || exit 1
          echo 'Quarantined: 8192 MiB KVM/OVMF, optical readonly, no network/disk' \
            > bazzite-legacy-diskless-evidence/guest-scope.txt
          qemu-system-x86_64 \
            -nodefaults -machine q35,accel=kvm -cpu host -smp 2 -m 8192 \
            -sandbox on,obsolete=deny,elevateprivileges=deny,spawn=deny,resourcecontrol=deny \
            -drive "if=pflash,format=raw,unit=0,readonly=on,file=$code" \
            -drive "if=pflash,format=raw,unit=1,file=$work/OVMF_VARS.disposable.fd" \
            -vga std -device ich9-ahci,id=sata \
            -drive "if=none,id=optical,media=cdrom,format=raw,readonly=on,file=$iso" \
            -device ide-cd,drive=optical,bus=sata.0 \
            -boot order=d -nic none -monitor none \
            -serial "file:bazzite-legacy-diskless-evidence/guest-serial.log" \
            -vnc 127.0.0.1:1 -no-reboot \
            > bazzite-legacy-diskless-evidence/qemu-stdout.txt \
            2> bazzite-legacy-diskless-evidence/qemu-stderr.txt &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || :; wait "$pid" 2>/dev/null || :' EXIT
          for phase in 1 2 3 4; do
            sleep 75
            kill -0 "$pid" 2>/dev/null \
              || { echo "Legacy guest exited before capture $phase"; exit 1; }
            picture="bazzite-legacy-diskless-evidence/screen-$phase.png"
            timeout --signal=TERM --kill-after=5s 40s \
              "$HOME/.local/bin/vncdotool" -s 127.0.0.1::5901 capture "$picture"
            python3 - "$picture" <<'PY'
          from PIL import Image
          import sys
          im = Image.open(sys.argv[1]).convert("RGB")
          assert im.width >= 640 and im.height >= 480, "Unexpected guest screen geometry"
          assert len(im.getcolors(maxcolors=1000000) or []) > 2, "Blank guest screen"
          PY
            tesseract "$picture" stdout 2>/dev/null \
              > "bazzite-legacy-diskless-evidence/ocr-$phase.txt" || :
          done
          python3 - <<'PY' > bazzite-legacy-diskless-evidence/guest-observation.json
          import json
          from pathlib import Path
          root = Path("bazzite-legacy-diskless-evidence")
          texts = [(root / f"ocr-{i}.txt").read_text(errors="replace") for i in range(1, 5)]
          combined = "\n".join(texts).lower()
          result = {
              "distributionId": "bazzite",
              "labOnly": True,
              "noGuestHardDisk": True,
              "noGuestNetwork": True,
              "noInstallerInput": True,
              "fourNonblankGuestScreenshots": True,
              "bazziteTextObserved": "bazzite" in combined,
              "anacondaTextObserved": "anaconda" in combined,
              "blivetTextObserved": "blivet" in combined,
              "installationUiCandidateObserved": "install" in combined,
              "isoCryptographicProvenanceVerified": False,
              "nativeLegacyInstallerVerified": False,
              "manualPartitioningInGuestVerified": False,
              "storageWriteSetVerified": False,
              "windowsEspPreservedInGuest": False,
              "installationAuthorized": False,
              "partitionWriteAuthorized": False,
              "windowsEspWriteAuthorized": False,
              "windowsDualBootVerified": False,
          }
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
          echo 'DISKLESS VM OBSERVATION ONLY — never an installed-system proof'
          cat bazzite-legacy-diskless-evidence/guest-observation.json
      - name: Publish bounded screenshots and OCR without ISO or OVMF VARS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazzite-legacy-diskless-ovmf-readonly-evidence
          path: bazzite-legacy-diskless-evidence/
          if-no-files-found: warn
          retention-days: 7
