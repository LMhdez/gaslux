name: Official CachyOS ISO integrity and Archiso contract (not an installer)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cachyos-archiso-handoff
      - feature/cachyos-e2e-release-gate
      - feature/cachyos-real-iso-contract
    paths:
      - .github/workflows/cachyos-official-iso.yml

permissions:
  contents: read

jobs:
  inspect-official-cachyos:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install ISO verification prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            squashfs-tools grub-common aria2
      - name: Fetch and verify pinned official CachyOS desktop ISO
        shell: bash
        env:
          RELEASE: '260809'
          ISO_SHA256: '959f6577f45e25ee9fd8c220fd221b08e4ea79412c7315c0f922dd6d86d5e33c'
          ISO_URL: 'https://build.cachyos.org/ISO/desktop/260809/cachyos-desktop-linux-260809.iso'
        run: |
          set -Eeuo pipefail
          workspace="$(mktemp -d -t gaslux-real-cachyos-XXXXXX)"
          mkdir -p "$workspace/mounted"
          echo "GASLUX_ISO_WORKSPACE=$workspace" >> "$GITHUB_ENV"
          echo "$ISO_URL" > "$workspace/source-url.txt"
          # The origin truncates multi-gigabyte transfers. Use resumable range
          # requests from independent CachyOS mirrors. Only the pinned
          # maintainer-published hash decides whether any bytes are trusted.
          {
            printf '%s\t%s\n' 'https://mirror.limda.net/cachy/ISO/desktop/260809/cachyos-desktop-linux-260809.iso' 'https://mirror.nju.edu.cn/cachyos/ISO/desktop/260809/cachyos-desktop-linux-260809.iso'
            printf '  dir=%s\n' "$workspace"
            printf '  out=cachyos.iso\n'
          } > "$workspace/iso-mirrors.txt"
          aria2c --input-file="$workspace/iso-mirrors.txt" \
            --split=8 --min-split-size=32M --max-connection-per-server=8 \
            --max-concurrent-downloads=1 --continue=true \
            --file-allocation=none --retry-wait=8 --max-tries=8 \
            --timeout=45 --connect-timeout=25 \
            --check-integrity=true --checksum="sha-256=$ISO_SHA256"
          printf '%s  %s\n' "$ISO_SHA256" "$workspace/cachyos.iso" | sha256sum --check --status
          echo "Verified official CachyOS ISO version $RELEASE SHA-256: $ISO_SHA256"
      - name: Mount verified ISO read-only and inspect live Archiso payload
        shell: bash
        env:
          ISO_SHA256: '959f6577f45e25ee9fd8c220fd221b08e4ea79412c7315c0f922dd6d86d5e33c'
        run: |
          set -Eeuo pipefail
          w="$GASLUX_ISO_WORKSPACE"
          sudo mount -o loop,ro "$w/cachyos.iso" "$w/mounted"
          cleanup() { sudo umount "$w/mounted" || true; }
          trap cleanup EXIT
          # Surface the exact reason when the real signed ISO differs from
          # synthetic preflight fixtures; never treat a failed inspection as success.
          if ! python3 assets/live/libertix-cachyos-preflight.py "$w/mounted" > "$w/preflight.json"; then
            echo "::error::CachyOS Archiso preflight rejected the verified official ISO"
            cat "$w/preflight.json"
            echo "::group::Read-only live identity from verified squashfs"
            unsquashfs -cat "$w/mounted/arch/x86_64/airootfs.sfs" etc/os-release | head -60 || true
            echo "::endgroup::"
            echo "::group::Read-only pacman capabilities in verified squashfs"
            unsquashfs -ll "$w/mounted/arch/x86_64/airootfs.sfs" etc/pacman.conf usr/bin/pacman | tail -35 || true
            echo "::endgroup::"
            echo "::group::Official ISO file layout"
            find "$w/mounted" -maxdepth 4 -type f | sed "s|$w/mounted/||" | head -100 || true
            echo "::endgroup::"
            exit 1
          fi
          python3 - "$w" "$ISO_SHA256" <<'PY'
          import hashlib, importlib.util, json, sys
          from pathlib import Path
          w = Path(sys.argv[1])
          expected = sys.argv[2]
          iso = w / 'cachyos.iso'
          plan = {
              'schemaVersion': 1,
              'firmware': 'uefi',
              'secureBootEnabled': False,
              'runId': 'official-cachyos-260809',
              'isoStorageFilesystem': 'ext4',
              'isoStorageUuid': '01234567-89ab-cdef-0123-456789abcdef',
              'isoRelativePath': '/cachyos.iso',
              'isoSha256': expected,
              'isoSizeBytes': iso.stat().st_size,
          }
          path = Path('assets/live/cachyos-archiso-handoff.py').resolve()
          spec = importlib.util.spec_from_file_location('gaslux_official_handoff', path)
          assert spec and spec.loader
          handoff = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(handoff)
          result = handoff.prepare(plan, storage_root=w, iso_root=w / 'mounted')
          assert result['ok'] and result['isoSha256Verified'] and result['isoLayoutVerified']
          assert result['productionInstallSupported'] is False
          assert result['isoMountedFromVerifiedSource'] is False  # not a dedicated storage volume
          (w / 'grub.cfg').write_text(result['grubEntry'])
          print('Official ISO Archiso identity, kernel/initramfs paths and SHA-256: PASS')
          print('This is inspection only; Windows disk UUID and production boot were NOT verified.')
          PY
          grub-script-check "$w/grub.cfg"
          echo "Generated GRUB loopback entry syntax: PASS"
          printf 'Real CachyOS ISO verification passed\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'This job did not install Linux or touch Windows boot files.\n' >> "$GITHUB_STEP_SUMMARY"
