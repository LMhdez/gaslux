name: Genuine Windows 10/11 two-stage DVD then disk-only installed firstboot (VM only)

on:
  push:
    branches:
      - feature/windows-eval-two-stage-disposable-firstboot
      - fix/windows-two-stage-second-guest-evidence
      - fix/windows-two-stage-swtpm-reconnect
      - fix/windows-two-stage-full-serial-dvd-guard
      - fix/windows-eval-oobe-international-pass
      - test/windows-floppy-proven-setup-firstlogon-fix
      - test/windows10-postboot-gpt-readonly-audit
      - test/windows11-postboot-gpt-readonly-audit
      - test/windows11-gpt-primary-backup-readonly-gate
      - test/windows11-cachyos-cow-gpt-stage
    paths:
      - .github/workflows/windows-x64-two-stage-firstboot.yml
      - auto_tests/tools/windows_x64_tcg_firstboot.py
      - auto_tests/tools/windows_x64_installed_gpt_ro_audit.py
      - auto_tests/tools/windows_cachyos_qcow2_gpt_readonly.py
      - auto_tests/test_windows_cachyos_qcow2_gpt_readonly.py
      - auto_tests/tools/windows_cachyos_cow_checkpoint.py
      - auto_tests/test_windows_cachyos_cow_checkpoint.py
      - auto_tests/tools/windows_cachyos_overlay_gpt_stage.py
      - auto_tests/test_windows_cachyos_overlay_gpt_stage.py
      - auto_tests/test_windows11_cachyos_cow_preflight.py
      - auto_tests/test_windows_x64_installed_gpt_ro_audit.py
      - auto_tests/test_windows11_floppy_control.py
      - auto_tests/tools/windows_x64_libguestfs_kernel.sh
      - auto_tests/test_windows_x64_two_stage_boot.py
      - auto_tests/test_windows_x64_swtpm_reconnect.py
      - auto_tests/test_windows_x64_tcg_unattend_contract.py
      - auto_tests/powershell/test_windows_firstlogon_serial_line_contract.ps1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-host-and-proof-contracts:
    name: All Windows client and two-stage destructive-replay guards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: No media, no guest, fail-closed unit and Linux portability tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          python3 -m py_compile auto_tests/tools/windows_x64_tcg_firstboot.py
          python3 -m py_compile auto_tests/tools/windows_x64_installed_gpt_ro_audit.py
          python3 -m py_compile auto_tests/tools/windows_cachyos_qcow2_gpt_readonly.py
          python3 -m py_compile auto_tests/tools/windows_cachyos_cow_checkpoint.py
          python3 -m py_compile auto_tests/tools/windows_cachyos_overlay_gpt_stage.py
          bash -n auto_tests/tools/windows_x64_libguestfs_kernel.sh
          for name in \
              test_windows_x64_two_stage_boot.py \
              test_windows_x64_installed_gpt_ro_audit.py \
              test_windows_cachyos_qcow2_gpt_readonly.py \
              test_windows_cachyos_cow_checkpoint.py \
              test_windows_cachyos_overlay_gpt_stage.py \
              test_windows11_cachyos_cow_preflight.py \
              test_windows11_floppy_control.py \
              test_windows_x64_noprompt_one_shot.py \
              test_windows_x64_derived_noprompt.py \
              test_windows_x64_kvm_opt_in.py \
              test_windows_x64_clean_poweroff_gate.py \
              test_windows_x64_tcg_unattend_contract.py \
              test_windows_x64_winre_baseline_contract.py \
              test_windows_x64_qemu_host_gate.py; do
            python3 -m unittest discover -s auto_tests -p "$name" -v
          done
      - name: Prove physical-host-safe swtpm listener restart with same private NV directory
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends swtpm
          python3 -m unittest discover -s auto_tests -p 'test_windows_x64_swtpm_reconnect.py' -v
          echo 'Real swtpm Unix listener reconnected with same temporary NV directory; no Windows boot proven.' >> "$GITHUB_STEP_SUMMARY"

  genuine-client-two-stage-firstboot:
    name: Genuine Microsoft ${{ matrix.profile }}, QEMU KVM DVD stage -> disk-only Windows boot
    needs: verify-host-and-proof-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        profile:
          # Replay the Windows 11 26H2 FAT12 / derived DVD firstboot
          # verified in Actions #44094951108, adding only the inherited
          # read-only libguestfs offline check after clean guest shutdown.
          # FAT12 is strictly a historical disposable-VM control.
          - win11_26h2_en_us_x64
    env:
      PYTHONUNBUFFERED: '1'
      GASLUX_WINDOWS_KVM_CONSENT: I_ACCEPT_DISPOSABLE_GITHUB_KVM_ONLY
      GASLUX_WINDOWS_TWO_STAGE_INSTALL_CONSENT: I_ACCEPT_DISPOSABLE_GITHUB_KVM_DVD_THEN_DISK_ONLY
      GASLUX_WINDOWS_ACPI_LAB_CONSENT: I_ACCEPT_DISPOSABLE_WIN11_POSTAUDIT_ACPI_POWERDOWN
      GASLUX_WINDOWS_COW_CHECKPOINT_CONSENT: I_ACCEPT_GITHUB_HOSTED_POSTBOOT_OVERLAY_ONLY
      GASLUX_CACHYOS_OVERLAY_GPT_CONSENT: I_ACCEPT_DISPOSABLE_QCOW2_OVERLAY_GPT_ONLY
      GASLUX_WINDOWS11_CACHYOS_STAGE_CONSENT: I_ACCEPT_WIN11_POSTBOOT_GPT_COW_ONLY_NO_FILESYSTEM
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require hosted KVM and prepare isolated Windows/ISO UDF tools
        shell: bash
        timeout-minutes: 16
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          test "$(uname -m)" = x86_64
          # A previous runner remained in dependency setup >20 minutes, with
          # the Windows VM not even started. Bound package access before any
          # target media/Windows disk exists and report the stalled phase.
          trap 'rc=$?; if (( rc != 0 )); then
            echo "GASLUX_HOSTED_KVM_DEPENDENCY_SETUP_FAILED=1" >&2;
            echo "FAIL: owned hosted runner KVM prerequisite installation; no Windows guest launched" >> "$GITHUB_STEP_SUMMARY";
          fi' EXIT
          echo "GASLUX_HOSTED_KVM_APT_UPDATE_BEGIN=1"
          timeout --signal=TERM --kill-after=15s 300s sudo apt-get update -qq \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=40 \
            -o Acquire::https::Timeout=40
          echo "GASLUX_HOSTED_KVM_APT_INSTALL_BEGIN=1"
          timeout --signal=TERM --kill-after=15s 600s sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get install -y --no-install-recommends \
            -o DPkg::Lock::Timeout=60 -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=40 -o Acquire::https::Timeout=40 \
            qemu-system-x86 qemu-utils ovmf swtpm dosfstools mtools \
            p7zip-full genisoimage python3-guestfs libguestfs-tools linux-image-generic
          echo "GASLUX_HOSTED_KVM_PREREQUISITES_INSTALLED=1"
          test -c /dev/kvm && test ! -L /dev/kvm
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          mkdir -p "$GITHUB_WORKSPACE/windows-x64-tcg-evidence"
      - name: Select a complete private libguestfs kernel without switching host kernel
        shell: bash
        run: |
          set -Eeuo pipefail
          source auto_tests/tools/windows_x64_libguestfs_kernel.sh
          python3 - <<'PY'
          import guestfs
          print("PASS: Ubuntu python3-guestfs binding installed; no disk opened")
          PY
      - name: Validate official SHA, disposable first DVD Setup, detach DVD and independently firstboot Windows
        shell: bash
        run: |
          set -Eeuo pipefail
          export GASLUX_WINDOWS_EVIDENCE="$GITHUB_WORKSPACE/windows-x64-tcg-evidence"
          python3 auto_tests/tools/windows_x64_tcg_firstboot.py \
            --profile "${{ matrix.profile }}" --accel kvm \
            --derived-no-prompt --two-stage-install-only --boot-timeout 4800 \
            --audit-installed-gpt-readonly --audit-primary-backup-gpt-readonly \
            --stage-cachyos-win11-root-gpt-overlay-only
          echo 'PASS: Windows 11 clean firstboot plus read-only libguestfs and independent primary/backup GPT CRC/partition identity agreement.' >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path("windows-x64-tcg-evidence")
          result = json.loads((p/"win11_26h2_en_us_x64-result.json").read_text())
          doc = "win11_26h2_en_us_x64-cachyos-overlay-fifth-gpt-only.json"
          data = (p/doc).read_bytes()
          recorded, target = (p/(doc+".sha256")).read_text().strip().split(None, 1)
          assert target == doc and recorded == hashlib.sha256(data).hexdigest()
          staged = json.loads(data)
          assert result["isoHashVerified"] is True
          assert result["windowsClientBootVerified"] is True
          assert result["installedGptReadOnlyVerified"] is True
          assert result["gptPrimaryBackupReadOnlyVerified"] is True
          assert result["win11CachyosFifthGptOverlayStagedOnly"] is True
          assert result["win11CachyosOverlayDiscarded"] is True
          assert staged["linuxRoot"]["lengthBytes"] == 24*1024**3
          assert staged["linuxRootFilesystemFormatted"] is False
          assert staged["overlayDiscarded"] is True
          assert staged["windowsBaselineReadOnlyAfterDiscardVerified"] is True
          assert staged["windowsBackingQcow2Unchanged"] is True
          assert staged["windowsUefiVariablesUnchanged"] is True
          for key in ("cachyosInstalled", "cachyosFirstBootVerified",
                      "sameDiskDualBootVerified", "windowsRecoveryAfterLinuxVerified",
                      "rollbackProven", "storageWritesAuthorized", "releaseEligible",
                      "linuxInstalled", "windowsRebootAfterLinuxGptVerified"):
              assert staged[key] is False, key
          print("GASLUX_WIN11_FIFTH_GPT_OVERLAY_EVIDENCE_VERIFIED=1")
          PY
          echo 'Only fifth GPT unformatted entry was staged in private COW, discarded; Windows backing read-only GPT and filesystem identical.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Linux installation, second Windows boot, in-place rollback or production write authorization.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain only serial, hash and JSON; never ISO, WIM, QCOW2 or TPM state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-genuine-two-stage-firstboot-${{ matrix.profile }}
          path: windows-x64-tcg-evidence/
          retention-days: 7
          if-no-files-found: warn
