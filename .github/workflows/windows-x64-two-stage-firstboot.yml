name: Genuine Windows 10/11 two-stage DVD then disk-only installed firstboot (VM only)

on:
  push:
    branches:
      - feature/windows-eval-two-stage-disposable-firstboot
      - fix/windows-two-stage-second-guest-evidence
      - fix/windows-two-stage-swtpm-reconnect
      - fix/windows-two-stage-full-serial-dvd-guard
      - fix/windows-eval-oobe-international-pass
      - fix/windows-two-stage-removable-oobe-answer
      - test/windows-two-stage-offline-panther-cache-evidence
      - fix/windows-panther-guestfs-kernel-appliance
      - test/windows-panther-real-ntfs-readonly-fixture
      - diag/windows-stage1-timeout-offline-panther
      - fix/windows-stage1-hmp-ack-and-timeout-diagnostics
      - test/windows-official-iso-direct-two-stage-kvm
      - fix/windows-original-iso-com1-prompt-timing
      - test/windows-original-iso-fat12-floppy-controlled-ab
    paths:
      - .github/workflows/windows-x64-two-stage-firstboot.yml
      - auto_tests/tools/windows_x64_tcg_firstboot.py
      - auto_tests/test_windows_x64_two_stage_boot.py
      - auto_tests/test_windows_x64_stage1_stalled_panther.py
      - auto_tests/test_windows_x64_iso_boot_key.py
      - auto_tests/test_windows_x64_swtpm_reconnect.py
      - auto_tests/tools/windows_x64_offline_panther_probe.py
      - auto_tests/test_windows_x64_offline_panther_probe.py
      - auto_tests/tools/windows_x64_libguestfs_kernel.sh
      - auto_tests/test_windows_x64_tcg_unattend_contract.py
  workflow_dispatch:

permissions:
  contents: read

# New experimental commits supersede only this branch's earlier VM attempts.
concurrency:
  group: windows-two-stage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-host-and-proof-contracts:
    name: All Windows client and two-stage destructive-replay guards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: No media, no guest, fail-closed unit and Linux portability tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          python3 -m py_compile auto_tests/tools/windows_x64_tcg_firstboot.py
          python3 -m py_compile auto_tests/tools/windows_x64_offline_panther_probe.py
          bash -n auto_tests/tools/windows_x64_libguestfs_kernel.sh
          for name in \
              test_windows_x64_two_stage_boot.py \
              test_windows_x64_stage1_stalled_panther.py \
              test_windows_x64_iso_boot_key.py \
              test_windows_x64_offline_panther_probe.py \
              test_windows_x64_noprompt_one_shot.py \
              test_windows_x64_derived_noprompt.py \
              test_windows_x64_kvm_opt_in.py \
              test_windows_x64_clean_poweroff_gate.py \
              test_windows_x64_tcg_unattend_contract.py \
              test_windows_x64_winre_baseline_contract.py \
              test_windows_x64_qemu_host_gate.py; do
            python3 -m unittest discover -s auto_tests -p "$name" -v
          done
      - name: Prove physical-host-safe swtpm listener restart with same private NV directory
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends swtpm
          python3 -m unittest discover -s auto_tests -p 'test_windows_x64_swtpm_reconnect.py' -v
          echo 'Real swtpm Unix listener reconnected with same temporary NV directory; no Windows boot proven.' >> "$GITHUB_STEP_SUMMARY"
      - name: Prove guestfish read-only inspection of a newly created empty QCOW2 (no Windows)
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libguestfs-tools qemu-utils linux-image-generic
          # Ubuntu AWS runner can lack its executing kernel image in /boot.
          # This chooses a complete installed generic image for supermin only.
          source auto_tests/tools/windows_x64_libguestfs_kernel.sh
          tmp="$(mktemp -d "$RUNNER_TEMP/gaslux-win-x64-panther-XXXXXX")"
          chmod 700 "$tmp"
          trap 'rm -rf -- "$tmp"' EXIT
          qemu-img create -f qcow2 "$tmp/only-disposable-windows-target.qcow2" 64M
          echo '== Kernel appliance prerequisites (no user data) =='
          uname -r
          for kernel in /boot/vmlinuz-*; do
            if [[ -f "$kernel" ]]; then stat -c 'host-kernel=%n mode=%a owner=%U' "$kernel"; fi
          done
          if ! LIBGUESTFS_DEBUG=1 LIBGUESTFS_TRACE=1 \
            timeout --kill-after=10s 100s guestfish --ro --format=qcow2 \
            -a "$tmp/only-disposable-windows-target.qcow2" run : list-filesystems \
            > "$tmp/guestfish-smoke.log" 2>&1; then
            echo 'guestfish failure diagnostics (limited to kernel/supermin lines):'
            grep -Ei 'supermin:|kernel:|permission denied|failed to find|no suitable kernel|cp: cannot|error:' \
              "$tmp/guestfish-smoke.log" | tail -n 60 || true
            exit 1
          fi
          echo 'PASS: libguestfs opened only a synthetic QCOW2 read-only; no Windows/Panther data, no boot proof.' >> "$GITHUB_STEP_SUMMARY"

  genuine-client-two-stage-firstboot:
    name: Genuine Microsoft ${{ matrix.profile }}, QEMU KVM DVD stage -> disk-only Windows boot
    needs: verify-host-and-proof-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        profile:
          # This branch isolates the proven Windows 10 original ISO COM1
          # CD prompt timing. Windows 11 is independently running in PR #108.
          - win10_22h2_en_us_x64
    env:
      PYTHONUNBUFFERED: '1'
      GASLUX_WINDOWS_KVM_CONSENT: I_ACCEPT_DISPOSABLE_GITHUB_KVM_ONLY
      GASLUX_WINDOWS_TWO_STAGE_INSTALL_CONSENT: I_ACCEPT_DISPOSABLE_GITHUB_KVM_DVD_THEN_DISK_ONLY
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require hosted KVM and prepare isolated Windows/ISO UDF tools
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          test "$(uname -m)" = x86_64
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf swtpm dosfstools mtools \
            p7zip-full genisoimage libguestfs-tools linux-image-generic
          source auto_tests/tools/windows_x64_libguestfs_kernel.sh
          test -c /dev/kvm && test ! -L /dev/kvm
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          mkdir -p "$GITHUB_WORKSPACE/windows-x64-tcg-evidence"
      - name: Compare original SHA-pinned Microsoft ISO without remaster, then disk-only installed boot
        shell: bash
        run: |
          set -Eeuo pipefail
          export GASLUX_WINDOWS_EVIDENCE="$GITHUB_WORKSPACE/windows-x64-tcg-evidence"
          python3 auto_tests/tools/windows_x64_tcg_firstboot.py \
            --profile "${{ matrix.profile }}" --accel kvm \
            --official-original-iso --two-stage-install-only --boot-timeout 4800
          echo 'Only if this step succeeded, both native stages ran and a REAL Windows client boot/WinRE/BCD and clean poweroff were verified. Linux dualboot/rollback untested.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain only serial, hash and JSON; never ISO, WIM, QCOW2 or TPM state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-genuine-two-stage-firstboot-${{ matrix.profile }}
          path: windows-x64-tcg-evidence/
          retention-days: 7
          if-no-files-found: warn
