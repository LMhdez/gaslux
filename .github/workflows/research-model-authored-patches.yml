name: Research - Model Authored JSON Patch Repair

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-model-authored-patches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zero-credit-model-repair:
    if: >-
      github.repository == 'LMhdez/gaslux' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == 'LMhdez/gaslux')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        model: [qwen2.5-coder:7b, 'qwen3.5:9b']
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      GASLUX_PROBE_MODEL: ${{ matrix.model }}
    steps:
      - name: Checkout disposable research branch only, no saved token
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Report CPU and space
        shell: bash
        run: |
          set -euo pipefail
          nproc
          free -h
          df -h .
      - name: Install isolated focused-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/gaslux-probe-venv
          /tmp/gaslux-probe-venv/bin/python -m pip install --disable-pip-version-check \
            'pytest==9.2.0' 'python-json-logger==3.3.0'
      - name: Install SHA-verified Ollama 0.40.17
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 \
            https://github.com/ollama/ollama/releases/download/v0.40.17/install.sh \
            -o /tmp/ollama-install.sh
          echo 'eb510679f45de4a914d99953cd3deaada5dc73f9d585014df99d704449dd7dcc  /tmp/ollama-install.sh' | sha256sum -c -
          OLLAMA_VERSION=0.40.17 timeout 420 sh /tmp/ollama-install.sh
          (ollama serve > /tmp/ollama-probe.log 2>&1 &)
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:11434/api/version >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/ollama-probe.log
          exit 1
      - name: Download exactly one coding model (CPU)
        shell: bash
        run: |
          set -euo pipefail
          timeout 600 ollama pull "$GASLUX_PROBE_MODEL"
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          x=json.load(urllib.request.urlopen('http://127.0.0.1:11434/api/tags',timeout=15))
          model=next((m for m in x['models'] if m['name']==os.environ['GASLUX_PROBE_MODEL']), None)
          if not model or len(model.get('digest',''))!=64:
              raise SystemExit('Model identity missing')
          print('MODEL_DIGEST', model['digest'], 'BYTES',model['size'])
          PY
      - name: Generate model-authored one-line JSON patches, RED then GREEN
        shell: bash
        run: |
          set -euo pipefail
          timeout 1000 /tmp/gaslux-probe-venv/bin/python \
            auto_tests/tools/structured_coder_probe.py
      - name: Preserve independent candidate diffs and benchmark results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: structured-coder-${{ strategy.job-index }}
          path: evidence/structured-code-repair.json
          if-no-files-found: warn
          retention-days: 7
