name: Core Gaslux source provenance (offline)

on:
  push:
    branches:
      - core/mint-wpf-vm-recovery-20261122
    paths:
      - 'auto_tests/app/config.py'
      - 'auto_tests/app/services/source_tree.py'
      - 'auto_tests/app/services/validation.py'
      - 'auto_tests/tests/test_core_source_provenance.py'
      - '.github/workflows/core-source-provenance-offline.yml'
  pull_request:
    branches:
      - dev
    paths:
      - 'auto_tests/app/config.py'
      - 'auto_tests/app/services/source_tree.py'
      - 'auto_tests/app/services/validation.py'
      - 'auto_tests/tests/test_core_source_provenance.py'
      - '.github/workflows/core-source-provenance-offline.yml'

permissions:
  contents: read

jobs:
  source-identity-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install existing test-service dependencies
        run: python3 -m pip install -e ./auto_tests 'pytest==9.0.2' 'ruff==0.15.20'
      - name: Check Python source and tests
        run: |
          python3 -m compileall -q auto_tests/app/config.py auto_tests/app/services/source_tree.py auto_tests/app/services/validation.py auto_tests/tests/test_core_source_provenance.py
          python3 -m ruff check --config auto_tests/pyproject.toml auto_tests/app/config.py auto_tests/app/services/source_tree.py auto_tests/app/services/validation.py auto_tests/tests/test_core_source_provenance.py
          python3 -m ruff format --check --config auto_tests/pyproject.toml auto_tests/app/config.py auto_tests/app/services/source_tree.py auto_tests/app/services/validation.py auto_tests/tests/test_core_source_provenance.py
      - name: Provenance regressions (no VM access)
        run: python3 -m pytest -q auto_tests/tests/test_core_source_provenance.py
