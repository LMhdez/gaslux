name: Q4OS guest disk identity contract (read-only)
on:
  push:
    branches: [feature/q4os-guest-disk-identity]
    paths:
      - '.github/workflows/gaslux-q4os-guest-disk-probe.yml'
      - 'assets/live/gaslux_q4os_guest_disk_probe.py'
      - 'auto_tests/tests/test_q4os_guest_disk_probe.py'
      - 'schemas/gaslux-q4os-guest-disk-report.schema.json'
  pull_request:
    paths:
      - '.github/workflows/gaslux-q4os-guest-disk-probe.yml'
      - 'assets/live/gaslux_q4os_guest_disk_probe.py'
      - 'auto_tests/tests/test_q4os_guest_disk_probe.py'
      - 'schemas/gaslux-q4os-guest-disk-report.schema.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guest-identity-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install 'pytest>=9,<10' 'cryptography>=50,<51' 'ruff>=0.8,<1' 'jsonschema>=4,<5'
      - name: Compile, lint, format and test guest identity contract
        run: |
          set -Eeuo pipefail
          python -m compileall -q assets/live/gaslux_q4os_guest_disk_probe.py auto_tests/tests/test_q4os_guest_disk_probe.py
          python -m ruff check --config auto_tests/pyproject.toml assets/live/gaslux_q4os_guest_disk_probe.py auto_tests/tests/test_q4os_guest_disk_probe.py
          python -m ruff format --check --config auto_tests/pyproject.toml assets/live/gaslux_q4os_guest_disk_probe.py auto_tests/tests/test_q4os_guest_disk_probe.py
          python -m pytest -q auto_tests/tests/test_q4os_guest_disk_probe.py
          python - <<'PY'
          import json
          from jsonschema import validate
          schema = json.load(open("schemas/gaslux-q4os-guest-disk-report.schema.json", encoding="utf-8"))
          item = {"schemaVersion":1,"runId":"q4os-ci-example-12345678","nonce":"0123456789abcdef0123456789abcdef","device":"/dev/vda","serial":"GQ4OS-0123456789ABCD","sizeBytes":34359738368,"logicalSectorBytes":512,"physicalSectorBytes":512,"diskGuid":"a1234567-1111-4111-8111-abcdefabcdef","partitions":[{"number":1,"startLba":2048,"endLba":1050623,"typeGuid":"c12a7328-f81f-11d2-ba4b-00a0c93ec93b","partGuid":"12345678-1234-4123-8123-123456789abc","label":"GASLUX-LAB-ESP","filesystem":"vfat"}],"readOnlyProbe":True,"writeAttempted":False}
          validate(instance=item, schema=schema)
          print("Q4OS guest identity JSON Schema: PASS")
          PY
