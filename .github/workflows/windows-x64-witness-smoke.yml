name: Windows x64 unattended witness syntax and QEMU machine gates (no VM installer)

on:
  push:
    branches: [feature/windows-x64-tcg-disposable-firstboot-lab]
    paths:
      - .github/workflows/windows-x64-witness-smoke.yml
      - auto_tests/tools/windows_x64_tcg_firstboot.py
      - auto_tests/test_windows_x64_tcg_unattend_contract.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-parser:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Generate both first-logon PowerShell scripts without running a Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import sys;sys.path.insert(0,'auto_tests/tools');from windows_x64_tcg_firstboot import witness_powershell;from pathlib import Path;Path('win10-witness.ps1').write_text(witness_powershell('win10_22h2_en_us_x64','19045'),encoding='utf-8');Path('win11-witness.ps1').write_text(witness_powershell('win11_26h2_en_us_x64','26300'),encoding='utf-8')"
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell witness generation failed' }
          foreach ($file in @('win10-witness.ps1','win11-witness.ps1')) {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              throw ("{0}: PowerShell parser errors: {1}" -f $file, ($errors | Out-String))
            }
            $raw = Get-Content -LiteralPath $file -Raw
            foreach ($required in @('Win32_OperatingSystem','ProductType',
              'Get-Disk','Get-Partition','bcdedit /enum','reagentc /info',
              'GASLUX_WINDOWS_X64_REAL_CLIENT_FIRSTBOOT')) {
              if (-not $raw.Contains($required)) { throw "$file missing $required" }
            }
            foreach ($prohibited in @('bcdedit /set','bcdedit /delete','diskpart',
              'Remove-Partition','Format-Volume','Clear-Disk','Set-Disk')) {
              if ($raw.Contains($prohibited)) { throw "$file must never write host disks: $prohibited" }
            }
            Write-Host "$file Windows PowerShell parser and read-only audit: PASS"
          }
          'PowerShell parser success on hosted Windows SERVER, not Windows 10/11 client boot.' |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  qemu-machine-start-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify disposable TCG Q35/OFFLINE OVMF and floppy device wiring
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf dosfstools
          d="$(mktemp -d)"
          trap 'rm -rf -- "$d"' EXIT
          truncate -s 1440K "$d/floppy.img"
          mkfs.vfat -F 12 "$d/floppy.img"
          truncate -s 1M "$d/dummy-iso.img"
          cp /usr/share/OVMF/OVMF_VARS_4M.fd "$d/vars.fd"
          # A deadline is expected: QEMU is suspended (-S) to test its
          # machine/firmware/drive wiring without booting any operating system.
          set +e
          timeout -s TERM -k 3 8s \
            qemu-system-x86_64 -machine q35,accel=tcg,smm=on \
            -global driver=cfi.pflash01,property=secure,value=on \
            -cpu max -smp 2 -m 4096 -display none -vga std \
            -monitor none -net none -serial null -S \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.secboot.fd \
            -drive if=pflash,format=raw,file="$d/vars.fd" \
            -device ich9-ahci,id=lab_sata \
            -drive "if=none,id=verified_iso,media=cdrom,readonly=on,format=raw,file=$d/dummy-iso.img" \
            -device ide-cd,drive=verified_iso,bus=lab_sata.1 \
            -drive "if=floppy,format=raw,file=$d/floppy.img" \
            -boot order=dc > "$d/qemu-out.log" 2> "$d/qemu-err.log"
          rc=$?
          set -e
          cat "$d/qemu-err.log"
          if [[ "$rc" -ne 124 ]]; then
            echo "::error::QEMU TCG device startup failed with exit $rc" >&2
            exit 1
          fi
          echo 'QEMU OVMF Q35 floppy/IDE TCG startup: PASS (no Windows guest boot performed).'
