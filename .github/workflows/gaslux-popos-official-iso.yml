name: Pop OS official 24.04 Intel ISO integrity and live inspect (lab only)

on:
  push:
    branches:
      - feature/popos-native-preflight
      - feature/popos-ovmf-optical-media-proof
      - feature/popos-signed-distinst-agent-audit
      - feature/popos-native-distinst-guest-cli-proof
      - feature/popos-native-distinst-vm-partition-test
    paths:
      - '.github/workflows/gaslux-popos-official-iso.yml'
      - 'auto_tests/tools/gaslux_candidate_live_boot.sh'
      - 'auto_tests/tools/gaslux_popos_guest_serial.py'
      - 'auto_tests/tools/gaslux_popos_vm_guest_probe.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  popos-native-iso-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare isolated ISO lab tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends aria2 squashfs-tools binutils ntfs-3g xorriso gnupg curl ca-certificates ovmf qemu-system-x86 grub-common grub-efi-amd64-bin mtools dosfstools gdisk
      - name: Resolve official ISO API with exact release identity and versioned URL
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/gaslux-popos"
          python3 - "$RUNNER_TEMP/gaslux-popos" <<'PY'
          import json, pathlib, re, sys, urllib.request
          out = pathlib.Path(sys.argv[1])
          with urllib.request.urlopen(
              "https://api.pop-os.org/builds/24.04/intel", timeout=40
          ) as response:
              data = json.load(response)
          if data.get("version") != "24.04" or data.get("channel") != "intel":
              raise SystemExit("Unexpected System76 release API identity")
          url = data.get("url")
          if not isinstance(url, str) or re.fullmatch(
              r"https://iso[.]pop-os[.]org/24[.]04/amd64/intel/([0-9]{1,4})/pop-os_24[.]04_amd64_intel_\1[.]iso",
              url
          ) is None:
              raise SystemExit("Unexpected official Pop!_OS ISO URL")
          digest = data.get("sha_sum")
          if not isinstance(digest, str) or re.fullmatch("[0-9a-f]{64}", digest) is None:
              raise SystemExit("Missing or invalid official API SHA-256")
          size = data.get("size")
          if type(size) is not int or size < 2000000000 or size > 6000000000:
              raise SystemExit("Unreasonable or missing official ISO size")
          (out / "pinned-release.json").write_text(json.dumps(data, indent=2))
          with open(pathlib.Path(sys.argv[1]) / "download.sh", "w") as stream:
              stream.write('POP_ISO_URL=' + url + '\n')
              stream.write('POP_ISO_SIZE=' + str(size) + '\n')
              stream.write('POP_ISO_SHA256=' + digest + '\n')
          print("Resolved versioned official System76 API metadata; signature verification still required")
          PY
          source "$RUNNER_TEMP/gaslux-popos/download.sh"
          echo "GASLUX_POP_ISO_URL=$POP_ISO_URL" >> "$GITHUB_ENV"
          echo "GASLUX_POP_ISO_SIZE=$POP_ISO_SIZE" >> "$GITHUB_ENV"
          echo "GASLUX_POP_ISO_SHA256=$POP_ISO_SHA256" >> "$GITHUB_ENV"
      - name: Verify official Pop ISO signing key and detached checksum manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/gaslux-popos"
          base="${GASLUX_POP_ISO_URL%/*}"
          curl -fLsS --retry 4 --connect-timeout 20 --max-time 120 -o SHA256SUMS "$base/SHA256SUMS"
          curl -fLsS --retry 4 --connect-timeout 20 --max-time 120 -o SHA256SUMS.gpg "$base/SHA256SUMS.gpg"
          # Official pop-os/iso repository names key ID 204DD8AEC33A7AFF.
          # Pin the complete independently cross-checked key fingerprint.
          export GNUPGHOME="$RUNNER_TEMP/gaslux-popos/gnupg"
          install -d -m 0700 "$GNUPGHOME"
          gpg --batch --keyserver hkps://keyserver.ubuntu.com --recv-keys 204DD8AEC33A7AFF
          fpr="$(gpg --batch --with-colons --fingerprint 204DD8AEC33A7AFF |
              awk -F: '$1=="fpr" { print $10; exit }')"
          test "$fpr" = "63C46DF0140D738961429F4E204DD8AEC33A7AFF" || {
            echo "::error::Official Pop signing key fingerprint mismatch"; exit 1;
          }
          gpg --batch --verify SHA256SUMS.gpg SHA256SUMS
          basename="${GASLUX_POP_ISO_URL##*/}"
          python3 - "$basename" "$GASLUX_POP_ISO_SHA256" <<'PY'
          import re, sys
          from pathlib import Path
          name, expected = sys.argv[1:]
          matches = []
          for line in Path("SHA256SUMS").read_text(encoding="utf-8").splitlines():
              m = re.fullmatch(r"([0-9a-f]{64})\s+\*?([^/\s]+)", line)
              if m and m.group(2) == name:
                  matches.append(m.group(1))
          if matches != [expected]:
              raise SystemExit("Signed ISO checksum does not match exact official API build")
          print("PASS: Pop ISO digest is authenticated by the official signed SHA256SUMS")
          PY
      - name: Download versioned GPG-authenticated ISO and verify exact bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/gaslux-popos"
          aria2c --continue=true --split=8 --max-connection-per-server=8 \
            --max-tries=6 --retry-wait=8 --timeout=60 --connect-timeout=30 \
            --file-allocation=none --check-integrity=true \
            --checksum="sha-256=$GASLUX_POP_ISO_SHA256" -o popos.iso "$GASLUX_POP_ISO_URL"
          printf '%s  %s\n' "$GASLUX_POP_ISO_SHA256" popos.iso | sha256sum --check --status
          test "$(stat -c '%s' popos.iso)" -eq "$GASLUX_POP_ISO_SIZE"
          echo "GASLUX_POP_ISO_FILE=$RUNNER_TEMP/gaslux-popos/popos.iso" >> "$GITHUB_ENV"
      - name: Inspect System76 native live runtime from verified ISO read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          w="$RUNNER_TEMP/gaslux-popos"
          mkdir -p "$w/iso-root" "$w/evidence"
          sudo mount -o loop,ro,nosuid,nodev,noexec "$GASLUX_POP_ISO_FILE" "$w/iso-root"
          trap 'sudo umount "$w/iso-root" || true' EXIT
          find "$w/iso-root" -maxdepth 4 -type f | sed "s|$w/iso-root/||" |
            sort > "$w/evidence/iso-files.txt"
          find "$w/iso-root" -maxdepth 4 -type f -name '*squashfs' > "$w/evidence/squashfs-paths.txt"
          test -s "$w/evidence/squashfs-paths.txt" || {
            echo "::error::No squashfs live root was found in verified Pop ISO"
            exit 1
          }
          selected_squash=''
          while IFS= read -r squash; do
            unsquashfs -ll "$squash" > "$w/evidence/rootfs-listing.txt"
            if unsquashfs -cat "$squash" etc/os-release > "$w/evidence/os-release.txt" 2>/dev/null; then
              selected_squash="$squash"
              break
            fi
          done < "$w/evidence/squashfs-paths.txt"
          test -s "$w/evidence/os-release.txt" || {
            echo "::error::Pop live identity absent in verified ISO"
            exit 1
          }
          cat "$w/evidence/os-release.txt"
          grep -Eq '^ID="?pop"?$' "$w/evidence/os-release.txt" || {
            echo "::error::Pop live os-release ID mismatch"
            exit 1
          }
          grep -Eq '^VERSION_ID="?24.04"?$' "$w/evidence/os-release.txt" || {
            echo "::error::Pop 24.04 live os-release version mismatch"
            exit 1
          }
          grep -E 'usr/(bin|sbin)/(distinst|pop-installer)|systemd-boot|kernelstub' \
            "$w/evidence/rootfs-listing.txt" > "$w/evidence/system76-install-components.txt" || true
          test -s "$w/evidence/system76-install-components.txt" || {
            echo "::error::System76 native installation/boot components not discovered"
            exit 1
          }
          # Analyze actual System76 native installer bytes from the SAME verified
          # live root that yielded ID=pop. Read-only extraction, never execute
          # distinst or invoke the installer with partition manipulation flags.
          test -n "$selected_squash" || {
            echo "::error::No verified native live root selected"; exit 1;
          }
          grep -Fq 'squashfs-root/usr/bin/distinst' "$w/evidence/rootfs-listing.txt" || {
            echo "::error::Official Pop live root contains no usr/bin/distinst"; exit 1;
          }
          agent="$w/distinst.elf"
          unsquashfs -cat "$selected_squash" usr/bin/distinst > "$agent" || {
            echo "::error::Could not extract native distinst from verified ISO"; exit 1;
          }
          test "$(stat -c '%s' "$agent")" -ge 65536 || {
            echo "::error::Native System76 agent too small"; exit 1;
          }
          test "$(stat -c '%s' "$agent")" -le 104857600 || {
            echo "::error::Native System76 agent implausibly large"; exit 1;
          }
          readelf -h "$agent" > "$w/evidence/distinst-elf.txt"
          grep -Eq 'Class:[[:space:]]+ELF64' "$w/evidence/distinst-elf.txt" || {
            echo "::error::Native distinst must be ELF64"; exit 1;
          }
          grep -Eq 'Machine:.*Advanced Micro Devices X86-64' "$w/evidence/distinst-elf.txt" || {
            echo "::error::Native distinst architecture mismatch"; exit 1;
          }
          {
            printf 'isoSha256=%s\n' "$GASLUX_POP_ISO_SHA256"
            printf 'distinstSha256=%s\n' "$(sha256sum "$agent" | awk '{print $1}')"
            printf 'distinstSizeBytes=%s\n' "$(stat -c '%s' "$agent")"
            echo 'executed=false'
          } > "$w/evidence/native-installer-provenance.txt"
          echo "GASLUX_POP_NATIVE_DISTINST_SHA256=$(sha256sum "$agent" | awk '{print $1}')" >> "$GITHUB_ENV"
          rm -f -- "$agent"
          echo 'PASS: real native distinst bytes bound to authenticated Pop live squashfs.'
          echo 'NOT AUTHORIZED: distinst partition, target or EFI writes.'
          cp "$w/pinned-release.json" "$w/evidence/pinned-release.json"
          (cd "$w/evidence" && sha256sum *.txt *.json > manifest.sha256)
          echo "PASS: real SHA-pinned Pop!_OS ISO and matching live root inspected."
          echo "NOT TESTED: installed Pop OS, EFI boot, Windows dual boot or rollback."
      - name: Boot real Pop!_OS live ISO in disposable OVMF/QEMU
        shell: bash
        env:
          GASLUX_CANDIDATE_BOOT_EVIDENCE_DIR: ${{ runner.temp }}/gaslux-popos/evidence/guest
          GASLUX_POP_GUEST_DISTINST_PROBE: '1'
        run: |
          set -Eeuo pipefail
          bash -n auto_tests/tools/gaslux_candidate_live_boot.sh
          bash -n auto_tests/tools/gaslux_popos_vm_guest_probe.sh
          bash auto_tests/tools/gaslux_candidate_live_boot.sh \
            popos "$GASLUX_POP_ISO_FILE" "$GASLUX_POP_ISO_SHA256"
      - name: Native distinst partition-stage test on isolated mock-Windows GPT
        shell: bash
        env:
          GASLUX_CANDIDATE_BOOT_EVIDENCE_DIR: ${{ runner.temp }}/gaslux-popos/evidence/partition-guest
          GASLUX_POP_GUEST_DISTINST_PROBE: '0'
          GASLUX_POP_GUEST_DISTINST_TARGET_TEST: '1'
        run: |
          set -Eeuo pipefail
          bash -n auto_tests/tools/gaslux_popos_vm_target_test.sh
          bash auto_tests/tools/gaslux_candidate_live_boot.sh \
            popos "$GASLUX_POP_ISO_FILE" "$GASLUX_POP_ISO_SHA256"
      - name: Retain hash-linked live-media evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: popos-official-2404-intel-iso-evidence
          path: ${{ runner.temp }}/gaslux-popos/evidence/
          if-no-files-found: warn
          retention-days: 14
