name: Q4OS Windows 10 installed QCOW2 UEFI/GPT lab

on:
  push:
    branches:
      - fix/q4os-win10-qmp-path-and-boot-proof
      - fix/q4os-win10-first-logon-and-ovmf-diagnostics
    paths:
      - '.github/workflows/gaslux-q4os-windows10-qcow2.yml'
      - 'auto_tests/tools/gaslux_q4os_win10_ovmf_dvd_input.py'
      - 'auto_tests/tests/test_q4os_win10_ovmf_dvd_input.py'
  pull_request:
    paths:
      - '.github/workflows/gaslux-q4os-windows10-qcow2.yml'
      - 'docs/Q4OS_WINDOWS10_QCOW2_LAB.md'
      - 'auto_tests/tools/gaslux_q4os_win10_ovmf_dvd_input.py'
      - 'auto_tests/tests/test_q4os_win10_ovmf_dvd_input.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Normalize push and pull_request events to the same branch key.
  group: gaslux-q4os-win10-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows10-uefi-gpt:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install QEMU, OVMF and offline NTFS inspection tools
        shell: bash
        run: |
          set -Eeuo pipefail
          # Bound package-manager waits so a runner/network fault fails with
          # an actionable error instead of occupying the 90-minute VM budget.
          timeout --signal=TERM --kill-after=30s 12m \
            sudo apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=120 update -qq
          timeout --signal=TERM --kill-after=30s 15m \
            sudo env DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=3 -o DPkg::Lock::Timeout=120 install -y --no-install-recommends \
              qemu-system-x86 qemu-utils ovmf ntfs-3g gdisk dosfstools xorriso curl acl libxml2-utils
          sudo modprobe nbd max_part=8
          [[ -b /dev/nbd0 ]] || { echo 'QEMU NBD kernel device unavailable' >&2; exit 1; }
          if [[ -c /dev/kvm ]]; then
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm || true
          fi
          if [[ -c /dev/kvm && -r /dev/kvm && -w /dev/kvm ]]; then
            printf 'GASLUX_WIN10_ACCEL=kvm\n' >> "$GITHUB_ENV"
            echo 'Windows lab accelerator: KVM'
          else
            printf 'GASLUX_WIN10_ACCEL=tcg\n' >> "$GITHUB_ENV"
            echo 'Windows lab accelerator: TCG (extended timeout)'
          fi

      - name: Download Microsoft Windows 10 Enterprise Evaluation 22H2 and verify official SHA-256
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/gaslux-win10-$GITHUB_RUN_ID"
          mkdir -m 0700 "$work"
          printf 'GASLUX_WIN10_WORK=%s\n' "$work" >> "$GITHUB_ENV"
          iso="$work/Windows10_Enterprise_22H2_Eval_EN-US_x64.iso"
          url='https://software-static.download.prss.microsoft.com/dbazure/988969d5-f34g-4e03-ac9d-1f9786c66750/19045.2006.220908-0225.22h2_release_svc_refresh_CLIENTENTERPRISEEVAL_OEMRET_x64FRE_en-us.iso'
          curl --fail --location --retry 4 --retry-delay 5 --connect-timeout 30 \
            --output "$iso" "$url"
          expected='ef7312733a9f5d7d51cfa04ac497671995674ca5e1058d5164d6028f0938d668'
          actual="$(sha256sum "$iso" | awk '{print $1}')"
          [[ "$actual" == "$expected" ]] || {
            echo "Windows ISO SHA-256 mismatch: $actual" >&2
            exit 1
          }
          printf 'GASLUX_WIN10_ISO_SHA256=%s\n' "$actual" >> "$GITHUB_ENV"
          printf 'GASLUX_WIN10_ISO_VERIFIED=PASS\n'

      - name: Prepare an isolated UEFI/GPT QCOW2 and unattended evaluation install
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GASLUX_WIN10_WORK"
          image="$work/windows10-enterprise-eval-22h2-uefi-gpt.qcow2"
          vars="$work/OVMF_VARS.fd"
          unattend="$work/Autounattend.xml"
          first_logon="$work/GasluxFirstLogon.ps1"
          answer_iso="$work/unattend.iso"
          cp /usr/share/OVMF/OVMF_VARS_4M.fd "$vars"
          chmod 0600 "$vars"
          qemu-img create -f qcow2 -o compat=1.1 "$image" 48G
          password="Gaslux-$(openssl rand -hex 16)!"
          printf '::add-mask::%s\n' "$password"
          printf 'GASLUX_WIN10_LAB_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
          # Keep PowerShell source out of a Bash-expanded inline command.
          # The quoted heredoc preserves every PowerShell variable literally.
          cat > "$first_logon" <<'PS1'
          $ErrorActionPreference = 'Stop'
          $evidence = 'C:\GasluxEvidence'
          $recovery = 'R:\Recovery\WindowsRE'
          New-Item -Force -ItemType Directory $evidence | Out-Null
          New-Item -Force -ItemType Directory $recovery | Out-Null
          $source = 'C:\Windows\System32\Recovery\Winre.wim'
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw 'Windows RE image is missing' }
          Copy-Item -LiteralPath $source -Destination (Join-Path $recovery 'Winre.wim') -Force
          & reagentc.exe /setreimage /path $recovery
          if ($LASTEXITCODE -ne 0) { throw "reagentc /setreimage failed: $LASTEXITCODE" }
          & reagentc.exe /enable
          if ($LASTEXITCODE -ne 0) { throw "reagentc /enable failed: $LASTEXITCODE" }
          $info = & reagentc.exe /info 2>&1
          $info | Set-Content -Encoding UTF8 (Join-Path $evidence 'winre-info.txt')
          if (($info -join "`n") -notmatch 'Enabled') { throw 'Windows RE is not enabled' }
          'GASLUX_WINDOWS_WINRE=PASS' | Set-Content -Encoding ASCII (Join-Path $evidence 'winre-status.txt')
          'GASLUX_WINDOWS_FIRST_LOGON=PASS' | Set-Content -Encoding ASCII (Join-Path $evidence 'first-logon.txt')
          shutdown.exe /s /t 20
          PS1
          cat > "$unattend" <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <unattend xmlns="urn:schemas-microsoft-com:unattend" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">
            <settings pass="windowsPE">
              <component name="Microsoft-Windows-International-Core-WinPE" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
                <SetupUILanguage><UILanguage>en-US</UILanguage></SetupUILanguage>
                <InputLocale>en-US</InputLocale><SystemLocale>en-US</SystemLocale><UILanguage>en-US</UILanguage><UserLocale>en-US</UserLocale>
              </component>
              <component name="Microsoft-Windows-Setup" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
                <DiskConfiguration>
                  <Disk wcm:action="add"><DiskID>0</DiskID><WillWipeDisk>true</WillWipeDisk>
                    <CreatePartitions>
                      <CreatePartition wcm:action="add"><Order>1</Order><Type>EFI</Type><Size>100</Size></CreatePartition>
                      <CreatePartition wcm:action="add"><Order>2</Order><Type>MSR</Type><Size>16</Size></CreatePartition>
                      <CreatePartition wcm:action="add"><Order>3</Order><Type>Primary</Type><Size>47000</Size></CreatePartition>
                      <CreatePartition wcm:action="add"><Order>4</Order><Type>Primary</Type><Size>1024</Size></CreatePartition>
                    </CreatePartitions>
                    <ModifyPartitions>
                      <ModifyPartition wcm:action="add"><Order>1</Order><PartitionID>1</PartitionID><Format>FAT32</Format><Label>System</Label></ModifyPartition>
                      <ModifyPartition wcm:action="add"><Order>2</Order><PartitionID>3</PartitionID><Format>NTFS</Format><Label>Windows</Label><Letter>C</Letter></ModifyPartition>
                      <ModifyPartition wcm:action="add"><Order>3</Order><PartitionID>4</PartitionID><Format>NTFS</Format><Label>Windows RE</Label><Letter>R</Letter><TypeID>DE94BBA4-06D1-4D40-A16A-BFD50179D6AC</TypeID><GPTAttributes>0x8000000000000001</GPTAttributes></ModifyPartition>
                    </ModifyPartitions>
                  </Disk>
                </DiskConfiguration>
                <ImageInstall><OSImage>
                  <InstallFrom><MetaData wcm:action="add"><Key>/IMAGE/INDEX</Key><Value>1</Value></MetaData></InstallFrom>
                  <InstallTo><DiskID>0</DiskID><PartitionID>3</PartitionID></InstallTo>
                </OSImage></ImageInstall>
                <UserData><AcceptEula>true</AcceptEula><FullName>Gaslux Lab</FullName><Organization>Gaslux</Organization></UserData>
              </component>
            </settings>
            <settings pass="specialize">
              <component name="Microsoft-Windows-Shell-Setup" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
                <ComputerName>GASLUX-WIN10</ComputerName><TimeZone>UTC</TimeZone>
              </component>
            </settings>
            <settings pass="oobeSystem">
              <component name="Microsoft-Windows-International-Core" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
                <InputLocale>en-US</InputLocale><SystemLocale>en-US</SystemLocale><UILanguage>en-US</UILanguage><UserLocale>en-US</UserLocale>
              </component>
              <component name="Microsoft-Windows-Shell-Setup" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
                <OOBE><HideEULAPage>true</HideEULAPage><HideWirelessSetupInOOBE>true</HideWirelessSetupInOOBE><NetworkLocation>Work</NetworkLocation><ProtectYourPC>3</ProtectYourPC><SkipMachineOOBE>true</SkipMachineOOBE><SkipUserOOBE>true</SkipUserOOBE></OOBE>
                <UserAccounts><LocalAccounts><LocalAccount wcm:action="add"><Name>GasluxLab</Name><Group>Administrators</Group><Password><Value>$password</Value><PlainText>true</PlainText></Password></LocalAccount></LocalAccounts></UserAccounts>
                <AutoLogon><Password><Value>$password</Value><PlainText>true</PlainText></Password><Enabled>true</Enabled><LogonCount>1</LogonCount><Username>GasluxLab</Username></AutoLogon>
                <FirstLogonCommands><SynchronousCommand wcm:action="add"><Order>1</Order><Description>Configure WinRE and write first-logon evidence</Description><CommandLine>powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\GasluxFirstLogon.ps1</CommandLine><RequiresUserInput>false</RequiresUserInput></SynchronousCommand></FirstLogonCommands>
              </component>
            </settings>
          </unattend>
          XML
          xorriso -as mkisofs -quiet -o "$answer_iso" -V GASLUXANSWER -J -r "$unattend" "$first_logon"
          xmllint --noout "$unattend" 2>/dev/null || python - "$unattend" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          ET.parse(sys.argv[1])
          print("Autounattend XML: PASS")
          PY
          printf 'GASLUX_WIN10_QCOW2_CREATED=PASS\n'

      - name: Install Windows 10 and complete first logon across UEFI reboot cycles
        shell: bash
        env:
          GASLUX_WIN10_UEFI_OPTICAL_INPUT_LAB_ONLY: 'yes'
        run: |
          set -Eeuo pipefail
          work="$GASLUX_WIN10_WORK"
          image="$work/windows10-enterprise-eval-22h2-uefi-gpt.qcow2"
          iso="$work/Windows10_Enterprise_22H2_Eval_EN-US_x64.iso"
          vars="$work/OVMF_VARS.fd"
          answer="$work/unattend.iso"
          code='/usr/share/OVMF/OVMF_CODE_4M.fd'
          serial="$work/windows10-qemu-serial.log"
          qemu_log="$work/windows10-qemu-process.log"
          mount_root="$work/first-logon-check"
          mkdir -p "$mount_root"
          [[ -s "$code" && -s "$vars" && -s "$iso" && -s "$answer" ]]
          if [[ "$GASLUX_WIN10_ACCEL" == kvm ]]; then
            accelerator='kvm'
            cpu='host'
          else
            accelerator='tcg,thread=multi'
            cpu='max'
          fi

          check_first_logon() {
            sudo qemu-nbd --read-only --connect=/dev/nbd0 --format=qcow2 "$image"
            sudo udevadm settle
            local found=1
            if [[ -b /dev/nbd0p3 ]]; then
              sudo mount -t ntfs-3g -o ro,norecover /dev/nbd0p3 "$mount_root"
              if [[ -s "$mount_root/GasluxEvidence/first-logon.txt" ]] &&
                 grep -q 'GASLUX_WINDOWS_FIRST_LOGON=PASS' "$mount_root/GasluxEvidence/first-logon.txt"; then
                found=0
              fi
              sudo umount "$mount_root"
            fi
            sudo qemu-nbd --disconnect /dev/nbd0
            sudo udevadm settle
            return "$found"
          }

          # Windows Setup requests one or more guest resets between the
          # specialize and OOBE/first-logon phases. -no-reboot makes each reset
          # return control to this host loop, so the installer ISO is detached
          # after the first boot and the next cycle must boot from the QCOW2.
          completed=0
          for attempt in $(seq 1 8); do
            remaining=$((3600-SECONDS))
            if (( remaining <= 30 )); then
              echo 'Windows setup exceeded its one-hour guest budget' >&2
              exit 1
            fi
            disk_bootindex=1
            if (( attempt == 1 )); then disk_bootindex=2; fi
            args=(
              -no-user-config
              -no-reboot
              -machine q35
              -accel "$accelerator"
              -cpu "$cpu"
              -smp 4
              -m 6144
              -rtc base=utc
              -display none
              -vga std
              -serial "file:$serial"
              -net none
              -drive "if=pflash,format=raw,unit=0,readonly=on,file=$code"
              -drive "if=pflash,format=raw,unit=1,file=$vars"
              -device ich9-ahci,id=sata
              # Firmware-level HID input is explicit; legacy HMP input without
              # a guest keyboard did not satisfy the OVMF DVD key prompt.
              -device qemu-xhci,id=usbctrl
              -device usb-kbd,bus=usbctrl.0
              -drive "if=none,id=system,file=$image,format=qcow2,cache=writeback"
              -device ide-hd,drive=system,bus=sata.0,bootindex=$disk_bootindex
              -drive "if=none,id=answer,file=$answer,format=raw,media=cdrom,readonly=on"
              -device ide-cd,drive=answer,bus=sata.2,bootindex=3
            )
            if (( attempt == 1 )); then
              args+=(
                -drive "if=none,id=install,file=$iso,format=raw,media=cdrom,readonly=on"
                -device ide-cd,drive=install,bus=sata.1,bootindex=1
                -qmp "unix:$work/windows10-qemu-qmp.sock,server=on,wait=off"
              )
            else
              args+=(-monitor none)
            fi
            echo "Starting Windows setup/boot cycle $attempt (install media attached: $((attempt == 1 ? 1 : 0)))"
            set +e
            if (( attempt == 1 )); then
              # Official EFI DVD requires an explicit key. The helper watches
              # the genuine OVMF serial prompt and sends a USB HID Space key-down/key-up event to the
              # exact QEMU PID through a private QMP Unix monitor socket.
              first_cycle_limit=$(( remaining < 1500 ? remaining : 1500 ))
              python3 auto_tests/tools/gaslux_q4os_win10_ovmf_dvd_input.py \
                "$work" "$serial" "$work/windows10-qemu-qmp.sock" "$qemu_log" \
                --prompt-seconds 45 --cycle-seconds "$first_cycle_limit" \
                -- qemu-system-x86_64 "${args[@]}"
              status=$?
            else
              cycle_limit=$(( remaining < 1500 ? remaining : 1500 ))
              timeout --signal=TERM --kill-after=30s "${cycle_limit}s" \
                qemu-system-x86_64 "${args[@]}" > "$qemu_log" 2>&1
              status=$?
            fi
            set -e
            if [[ $status -eq 124 || $status -eq 137 ]]; then
              tail -n 120 "$qemu_log" || true
              tail -n 120 "$serial" || true
              echo "Windows guest did not reboot or shut down within the remaining time budget" >&2
              exit 1
            fi
            if [[ $status -ne 0 ]]; then
              tail -n 120 "$qemu_log" || true
              tail -n 120 "$serial" || true
              echo "Windows QEMU cycle $attempt exited with status $status" >&2
              exit "$status"
            fi
            qemu-img check "$image"
            if check_first_logon; then
              completed=1
              echo "GASLUX_WIN10_FIRST_LOGON_HOST_CHECK=PASS"
              break
            fi
            echo "Windows first-logon marker not present after cycle $attempt; retrying from installed disk without Windows ISO."
          done
          [[ "$completed" -eq 1 ]] || {
            tail -n 120 "$qemu_log" || true
            tail -n 120 "$serial" || true
            echo 'Windows did not reach the required first-logon marker after eight UEFI boot cycles' >&2
            exit 1
          }
          printf 'GASLUX_WIN10_QEMU_SHUTDOWN=PASS\n'

      - name: Verify installed Windows files, GPT ESP, BCD and first-logon marker
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GASLUX_WIN10_WORK"
          image="$work/windows10-enterprise-eval-22h2-uefi-gpt.qcow2"
          mount_root="$work/mnt"
          mkdir -p "$mount_root/windows" "$mount_root/esp" "$mount_root/winre"
          cleanup() {
            sudo umount "$mount_root/windows" 2>/dev/null || true
            sudo umount "$mount_root/esp" 2>/dev/null || true
            sudo umount "$mount_root/winre" 2>/dev/null || true
            sudo qemu-nbd --disconnect /dev/nbd0 2>/dev/null || true
          }
          trap cleanup EXIT
          sudo qemu-nbd --read-only --connect=/dev/nbd0 --format=qcow2 "$image"
          sudo udevadm settle
          sudo sgdisk --verify /dev/nbd0
          lsblk -nrpo NAME,PARTTYPE /dev/nbd0
          [[ -b /dev/nbd0p1 && -b /dev/nbd0p3 && -b /dev/nbd0p4 ]]
          sudo sgdisk --info=4 /dev/nbd0 | grep -qi 'DE94BBA4-06D1-4D40-A16A-BFD50179D6AC'
          sudo mount -t vfat -o ro /dev/nbd0p1 "$mount_root/esp"
          sudo mount -t ntfs-3g -o ro,norecover /dev/nbd0p3 "$mount_root/windows"
          sudo mount -t ntfs-3g -o ro,norecover /dev/nbd0p4 "$mount_root/winre"
          test -s "$mount_root/windows/Windows/System32/winload.efi"
          test -s "$mount_root/esp/EFI/Microsoft/Boot/bootmgfw.efi"
          test -s "$mount_root/esp/EFI/Microsoft/Boot/BCD"
          grep -q 'GASLUX_WINDOWS_FIRST_LOGON=PASS' \
            "$mount_root/windows/GasluxEvidence/first-logon.txt"
          grep -q 'GASLUX_WINDOWS_WINRE=PASS' \
            "$mount_root/windows/GasluxEvidence/winre-status.txt"
          test -s "$mount_root/winre/Recovery/WindowsRE/Winre.wim"
          printf 'GASLUX_WIN10_GPT=PASS\n'
          printf 'GASLUX_WIN10_WINDOWS_ROOT=PASS\n'
          printf 'GASLUX_WIN10_ESP_BOOTMGR_BCD=PASS\n'
          printf 'GASLUX_WIN10_FIRST_LOGON=PASS\n'
          printf 'GASLUX_WIN10_WINRE=PASS\n'
          sudo umount "$mount_root/windows"
          sudo umount "$mount_root/esp"
          sudo umount "$mount_root/winre"
          sudo qemu-nbd --disconnect /dev/nbd0
          trap - EXIT

      - name: Produce self-contained compressed Windows 10 QCOW2 and SHA-256 evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GASLUX_WIN10_WORK"
          source="$work/windows10-enterprise-eval-22h2-uefi-gpt.qcow2"
          output="$work/windows10-enterprise-eval-22h2-uefi-gpt-installed.qcow2"
          qemu-img convert -p -f qcow2 -O qcow2 -c "$source" "$output"
          qemu-img check "$output"
          info="$(qemu-img info --output=json "$output")"
          python - "$info" <<'PY'
          import json, sys
          x=json.loads(sys.argv[1])
          assert x["format"]=="qcow2"
          assert x["virtual-size"]==48*1024**3
          assert not x.get("backing-filename")
          print("GASLUX_WIN10_SELF_CONTAINED_QCOW2=PASS")
          PY
          sha="$(sha256sum "$output" | awk '{print $1}')"
          printf '%s  %s\n' "$sha" "$(basename "$output")" > "$work/windows10-qcow2.sha256"
          cat > "$work/windows10-install-manifest.json" <<JSON
          {
            "schemaVersion": 1,
            "distribution": "Windows 10 Enterprise Evaluation 22H2",
            "architecture": "x86_64",
            "firmware": "UEFI",
            "partitionTable": "GPT",
            "isoSha256": "$GASLUX_WIN10_ISO_SHA256",
            "qcow2Filename": "$(basename "$output")",
            "qcow2Sha256": "$sha",
            "virtualSizeBytes": 51539607552,
            "selfContained": true,
            "windowsRootVerified": true,
            "efiBootManagerVerified": true,
            "bcdVerified": true,
            "firstLogonVerified": true,
            "winrePartitionVerified": true,
            "winreEnabledVerified": true,
            "networkAttached": false,
            "qemuAccelerator": "$GASLUX_WIN10_ACCEL",
            "evaluationLicense": true
          }
          JSON
          printf 'GASLUX_WIN10_QCOW2_SHA256=%s\n' "$sha" >> "$GITHUB_ENV"
          printf 'GASLUX_WIN10_INSTALLED=PASS\n'
          printf 'GASLUX_WIN10_QCOW2_SHA256=%s\n' "$sha"

      - name: Upload verified Windows 10 installed QCOW2 and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaslux-windows10-enterprise-eval-22h2-uefi-gpt-installed
          path: |
            ${{ runner.temp }}/gaslux-win10-${{ github.run_id }}/windows10-enterprise-eval-22h2-uefi-gpt-installed.qcow2
            ${{ runner.temp }}/gaslux-win10-${{ github.run_id }}/windows10-qcow2.sha256
            ${{ runner.temp }}/gaslux-win10-${{ github.run_id }}/windows10-install-manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload OVMF timeout diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaslux-windows10-ovmf-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gaslux-win10-${{ github.run_id }}/windows10-ovmf-timeout.ppm
            ${{ runner.temp }}/gaslux-win10-${{ github.run_id }}/windows10-qemu-serial.log
            ${{ runner.temp }}/gaslux-win10-${{ github.run_id }}/windows10-qemu-process.log
          if-no-files-found: warn
          retention-days: 7
