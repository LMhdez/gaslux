name: CachyOS Windows recovery evidence (read-only contract)
on:
  push:
    branches:
      - feature/cachyos-windows-recovery-evidence
  pull_request:
    branches:
      - feature/signed-distro-capabilities-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-evidence:
    name: Windows recovery evidence rules (fixtures only)
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Parse PowerShell 5.1 recovery evidence code
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'Scripts/modules/Gaslux.CachyosWindowsEvidence.psm1'),
            [ref]$null, [ref]$errors
          ) | Out-Null
          if (@($errors).Count -gt 0) { throw ($errors | Out-String) }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'Scripts/libertix-cachyos-windows-evidence.ps1'),
            [ref]$null, [ref]$errors
          ) | Out-Null
          if (@($errors).Count -gt 0) { throw ($errors | Out-String) }
      - name: Reject missing baseline without inspecting disks
        shell: powershell
        run: |
          $runner = Join-Path (Get-Location) 'Scripts/libertix-cachyos-windows-evidence.ps1'
          $stdout = @(& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $runner -Mode Compare -RunId 'cachyos-windows-lab-123' -EspRoot 'S:\' 2>&1)
          $childExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          Write-Host ('Negative test exit=' + $childExit)
          Write-Host ('Negative test output=' + ($stdout -join [Environment]::NewLine))
          if ($childExit -eq 0) { throw 'Compare accepted missing recovery baseline' }
          $result = ($stdout -join [Environment]::NewLine) | ConvertFrom-Json
          if ($result.ok -ne $false -or $result.physicalInstallerReady -ne $false) {
            throw 'Fail-closed Windows recovery CLI contract violated'
          }
      - name: Execute Windows PowerShell 5.1 fixture tests
        shell: powershell
        run: |
          & .\auto_tests\powershell\test_cachyos_windows_recovery_evidence.ps1
      - name: Static audit rejects mutating commands
        shell: powershell
        run: |
          $script = Get-Content 'Scripts/modules/Gaslux.CachyosWindowsEvidence.psm1' -Raw
          $statements = @($script.Split([char]10) | Where-Object {
            -not $_.TrimStart().StartsWith('#')
          })
          foreach ($command in @('Add-PartitionAccessPath','Set-Partition','Remove-Partition',
            'Format-Volume','Clear-Disk','Set-Disk','Suspend-BitLocker',
            'manage-bde.exe -off','bcdedit.exe /set','bcdedit.exe /delete',
            'mountvol.exe /S','efibootmgr -o')) {
            if (($statements -join [Environment]::NewLine).Contains($command)) {
              throw "Evidence module has prohibited mutation: $command"
            }
          }
      - name: Confirm production backend is still restricted
        shell: powershell
        run: |
          $text = Get-Content Installation/DistributionBackendPolicy.cs -Raw
          if ($text -notmatch 'CanUseLegacyDebianBackend') {
            throw 'Production distribution gate missing'
          }
          if ($text -match 'archiso-cachyos') {
            throw 'Production backend was unexpectedly enabled'
          }
