name: Windows CachyOS two-stage COM1 manifest binding contracts

on:
  push:
    branches:
      - feature/windows-cachyos-two-stage-serial-manifest-binding
    paths:
      - .github/workflows/windows-cachyos-two-stage-manifest-contract.yml
      - auto_tests/tools/windows_cachyos_readonly_baseline_gate.py
      - auto_tests/test_windows_cachyos_readonly_baseline_gate.py
      - .github/workflows/windows-x64-two-stage-firstboot.yml
      - docs/WINDOWS_CACHYOS_READONLY_BASELINE_GATE.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-firstboot-candidate-manifests:
    name: Read-only first/second stage evidence and pinned Microsoft contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile and enforce hosted-runner safety
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          python3 -m py_compile \
            auto_tests/tools/windows_cachyos_readonly_baseline_gate.py \
            auto_tests/test_windows_cachyos_readonly_baseline_gate.py
      - name: Run first- and second-stage negative and positive candidate contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -v -s auto_tests \
            -p 'test_windows_cachyos_readonly_baseline_gate.py'
          python3 -m unittest discover -v -s auto_tests \
            -p 'test_windows_x64_qemu_host_gate.py'
          echo 'PASS: synthetic Windows DVD and disk-only serial manifest consistency only. No Windows guest, CachyOS installation, real disk mutation or dual boot executed.' >> "$GITHUB_STEP_SUMMARY"
