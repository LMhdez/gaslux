name: Distro UI historical schema contracts (OFFLINE ONLY)

on:
  push:
    branches:
      - integration/distro-ui-static-evidence-dev-20261122
      - dev
    paths:
      - 'schemas/distro-ui-map.schema.json'
      - 'schemas/distro-ui-evidence.schema.json'
      - 'auto_tests/tests/test_distro_ui_schema_offline.py'
      - '.github/workflows/distro-ui-schema-offline.yml'
  pull_request:
    branches:
      - dev
    paths:
      - 'schemas/distro-ui-map.schema.json'
      - 'schemas/distro-ui-evidence.schema.json'
      - 'auto_tests/tests/test_distro_ui_schema_offline.py'
      - '.github/workflows/distro-ui-schema-offline.yml'

permissions:
  contents: read

jobs:
  validate-static-ui-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install static validation tools only
        run: python -m pip install 'pytest==9.0.2' 'jsonschema==4.25.1' 'ruff==0.13.3'
      - name: Offline schema and Ruff regression
        run: |
          python -m compileall -q auto_tests/tests/test_distro_ui_schema_offline.py
          python -m ruff check --config auto_tests/pyproject.toml auto_tests/tests/test_distro_ui_schema_offline.py
          python -m ruff format --check --config auto_tests/pyproject.toml auto_tests/tests/test_distro_ui_schema_offline.py
          python -m pytest -q auto_tests/tests/test_distro_ui_schema_offline.py
