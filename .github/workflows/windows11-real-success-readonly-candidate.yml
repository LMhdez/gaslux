name: Historic successful Windows 11 firstboot candidate evidence (read-only)
on:
  push:
    branches:
      - test/windows11-real-firstboot-readonly-candidate-gate
    paths:
      - .github/workflows/windows11-real-success-readonly-candidate.yml
      - auto_tests/tools/windows_cachyos_readonly_baseline_gate.py
      - auto_tests/tools/windows11_success_artifact_candidate_probe.py
      - auto_tests/test_windows_cachyos_readonly_baseline_gate.py
      - auto_tests/test_windows11_success_artifact_candidate_probe.py
      - auto_tests/tools/windows_x64_tcg_firstboot.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  candidate-artifact-readonly:
    name: Exact pinned Windows 11 installed serial and JSON, no VM/no disk
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reuse PR110 candidate verifier and reject forged evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          python3 -m py_compile \
            auto_tests/tools/windows_x64_tcg_firstboot.py \
            auto_tests/tools/windows_cachyos_readonly_baseline_gate.py \
            auto_tests/tools/windows11_success_artifact_candidate_probe.py
          python3 -m unittest discover -s auto_tests -p 'test_windows_cachyos_readonly_baseline_gate.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_windows11_success_artifact_candidate_probe.py' -v
      - name: Download and pin genuine successful Actions artifact, inspect only bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          test "$RUNNER_TEMP" = /home/runner/work/_temp
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          test "$(gh api repos/LMhdez/gaslux/actions/runs/44094951108 --jq '.head_sha + " " + .conclusion')" = "35ef6de46b71524c6c05c8d9f3a9f87564529ce7 success"
          test "$(gh api repos/LMhdez/gaslux/actions/artifacts/14335490721 --jq '.name + " " + (.expired|tostring)')" = "windows-genuine-two-stage-firstboot-win11_26h2_en_us_x64 false"
          work=$(mktemp -d "$RUNNER_TEMP/gaslux-win11-candidate-XXXXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          gh api repos/LMhdez/gaslux/actions/artifacts/14335490721/zip > "$work/verified-artifact.zip"
          echo '55b40f86d4de9f40508b564f9029beb04788fd5d03832370ce3099d259953cc4  '"$work/verified-artifact.zip" | sha256sum -c -
          python3 auto_tests/tools/windows11_success_artifact_candidate_probe.py "$work/verified-artifact.zip"
          echo 'PASS: immutable authentic Actions artifact documents internally consistent, release/storage/guest-origin AUTHORIZATION all false. No VM, original disk or rollback tested.' >> "$GITHUB_STEP_SUMMARY"
