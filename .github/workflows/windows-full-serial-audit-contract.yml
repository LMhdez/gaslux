name: Windows full COM1 serial audit contracts (no VM or ISO)

on:
  push:
    branches:
      - fix/windows-full-serial-firstboot-audit
    paths:
      - auto_tests/tools/windows_x64_tcg_firstboot.py
      - auto_tests/test_windows_x64_full_serial_audit.py
      - auto_tests/test_windows_x64_clean_poweroff_gate.py
      - .github/workflows/windows-full-serial-audit-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  negative-serial-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Streaming COM1 evidence and clean shutdown contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          python3 -m py_compile auto_tests/tools/windows_x64_tcg_firstboot.py
          python3 -m unittest discover -s auto_tests -p 'test_windows_x64_full_serial_audit.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_windows_x64_clean_poweroff_gate.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_windows_x64_noprompt_one_shot.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_windows_x64_two_stage_boot.py' -v
          echo 'COM1 regression contracts only: no genuine Windows firstboot or Linux dual boot proven.' >> "$GITHUB_STEP_SUMMARY"
