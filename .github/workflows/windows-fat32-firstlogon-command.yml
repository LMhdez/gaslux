name: Windows FAT32 USB dynamic FirstLogon and SHA contract (NO guest)

on:
  push:
    branches:
      - fix/windows-fat32-firstlogon-drive-label-hash
    paths:
      - .github/workflows/windows-fat32-firstlogon-command.yml
      - auto_tests/tools/windows_x64_tcg_firstboot.py
      - auto_tests/test_windows_x64_usb_firstlogon_command.py
      - auto_tests/powershell/test_windows_usb_firstlogon_command.ps1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-usb-xml-contracts:
    name: USB FirstLogon XML SHA and legacy FAT12 isolation (no disk)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile and check XML and pinned guest script for both Windows profiles
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          python3 -m py_compile auto_tests/tools/windows_x64_tcg_firstboot.py
          python3 -m unittest discover -s auto_tests -p 'test_windows_x64_usb_firstlogon_command.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_windows_x64_derived_iso_usb_ab.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_windows_x64_tcg_unattend_contract.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_windows_x64_two_stage_boot.py' -v
          echo 'No guest, Microsoft ISO, mounted USB or physical block device tested.' >> "$GITHUB_STEP_SUMMARY"

  native-powershell-command-parser:
    name: Native Windows PS5.1 and PS7 unique volume + hash (no real volumes)
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check native Windows FirstLogon PowerShell syntax and fail closed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($profile in @('win10_22h2_en_us_x64', 'win11_26h2_en_us_x64')) {
            $build = if ($profile.StartsWith('win10')) { '19045' } else { '26300' }
            $source = "auto_tests/powershell/usb-firstlogon-$profile.txt"
            python -c "import sys;sys.path.insert(0,'auto_tests/tools');from windows_x64_tcg_firstboot import usb_firstlogon_command;print(usb_firstlogon_command(sys.argv[1],sys.argv[2]))" $profile $build |
              Out-File -LiteralPath $source -Encoding ascii
            if ($LASTEXITCODE -ne 0) { throw 'Python generator of USB FirstLogon command failed' }
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File auto_tests/powershell/test_windows_usb_firstlogon_command.ps1 -CommandFile $source
            if ($LASTEXITCODE -ne 0) { throw "Native Windows PS5.1 USB $profile command contract failed" }
            & pwsh -NoProfile -NonInteractive -File auto_tests/powershell/test_windows_usb_firstlogon_command.ps1 -CommandFile $source
            if ($LASTEXITCODE -ne 0) { throw "Native Windows PS7 USB $profile command contract failed" }
          }
          'Native PS 5.1/7: only mocked volumes and hashes, no guest script or Windows disk read.' |
            Out-File $env:GITHUB_STEP_SUMMARY -Append
