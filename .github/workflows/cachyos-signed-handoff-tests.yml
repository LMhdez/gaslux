name: CachyOS authenticated handoff safety contracts

on:
  push:
    paths:
      - .github/workflows/cachyos-signed-handoff-tests.yml
      - assets/live/cachyos-stage-target.sh
      - assets/live/cachyos-handoff-auth.py
      - assets/live/cachyos-signed-grub-handoff.py
      - assets/live/cachyos-archiso-handoff.py
      - auto_tests/test_cachyos_signed_handoff.py
      - auto_tests/test_cachyos_signed_grub_handoff.py
      - auto_tests/test_cachyos_release_gate.py
      - auto_tests/test_windows_cachyos_archiso_shared_disk_gate.py
      - auto_tests/tools/windows_cachyos_archiso_shared_disk_gate.py
  pull_request:
    paths:
      - .github/workflows/cachyos-signed-handoff-tests.yml
      - assets/live/cachyos-stage-target.sh
      - assets/live/cachyos-handoff-auth.py
      - assets/live/cachyos-signed-grub-handoff.py
      - assets/live/cachyos-archiso-handoff.py
      - auto_tests/test_cachyos_signed_handoff.py
      - auto_tests/test_cachyos_signed_grub_handoff.py
      - auto_tests/test_cachyos_release_gate.py
      - auto_tests/test_windows_cachyos_archiso_shared_disk_gate.py
      - auto_tests/tools/windows_cachyos_archiso_shared_disk_gate.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-handoff:
    name: Fail-closed signed handoff validation (no installation)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Syntax and signature verifier prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n assets/live/cachyos-stage-target.sh
          python3 -m py_compile assets/live/cachyos-handoff-auth.py assets/live/cachyos-signed-grub-handoff.py
          openssl version
      - name: Signed handoff and release-gate regression tests
        run: |
          python3 -m unittest -v \
            auto_tests.test_cachyos_signed_handoff \
            auto_tests.test_cachyos_signed_grub_handoff \
            auto_tests.test_cachyos_release_gate
      - name: Windows/CachyOS shared GPT prewrite refusal contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            auto_tests/tools/windows_cachyos_archiso_shared_disk_gate.py \
            auto_tests/test_windows_cachyos_archiso_shared_disk_gate.py
          python3 -m unittest discover -s auto_tests \
            -p 'test_windows_cachyos_archiso_shared_disk_gate.py' -v
          echo 'Read-only evidence candidate only; Archiso writes, pacstrap, dual boot and rollback NOT verified.' >> "$GITHUB_STEP_SUMMARY"
