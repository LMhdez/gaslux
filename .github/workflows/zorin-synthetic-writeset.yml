name: Zorin synthetic write-set byte audit and isolated recovery (no writer)
on:
  push:
    branches:
      - test/zorin-synthetic-writeset-recovery-20261121
    paths:
      - '.github/workflows/zorin-synthetic-writeset.yml'
      - 'auto_tests/tools/zorin_synthetic_writeset.py'
      - 'auto_tests/test_zorin_synthetic_writeset.py'
      - 'schemas/zorin-synthetic-writeset-v1.schema.json'
      - 'docs/ZORIN_SYNTHETIC_WRITESET.md'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: zorin-synthetic-writeset-20261121
  cancel-in-progress: false

jobs:
  synthetic-gpt-esp-ovmf:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout dependent Zorin PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reuse canonical Safety PR #265 GPT reader at immutable commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: LMhdez/gaslux
          ref: 8ed912c6934c33354b0a814201c7217043bd0197
          path: safety265
          persist-credentials: false
          sparse-checkout: |
            assets/live/libertix_disk_identity_gate.py
          sparse-checkout-cone-mode: false
      - name: Compile, lint, format, schema and adversarial byte-level tests
        shell: bash
        env:
          PYTHONPATH: safety265/assets/live
        run: |
          set -Eeuo pipefail
          test "$(git -C safety265 rev-parse HEAD)" = '8ed912c6934c33354b0a814201c7217043bd0197'
          test -f safety265/assets/live/libertix_disk_identity_gate.py
          python3 -m pip install --break-system-packages --disable-pip-version-check --no-input \
            'jsonschema>=4.20,<5' 'ruff>=0.10,<0.18'
          python3 -m compileall -q \
            safety265/assets/live/libertix_disk_identity_gate.py \
            auto_tests/tools/zorin_synthetic_writeset.py \
            auto_tests/test_zorin_synthetic_writeset.py
          ruff check --select E4,E7,E9,F \
            auto_tests/tools/zorin_synthetic_writeset.py \
            auto_tests/test_zorin_synthetic_writeset.py
          ruff format --check \
            auto_tests/tools/zorin_synthetic_writeset.py \
            auto_tests/test_zorin_synthetic_writeset.py
          python3 -m unittest discover -s auto_tests -p 'test_zorin_synthetic_writeset.py' -v
          for suite in \
              test_zorin_native_installer_discovery.py \
              test_zorin_native_ubiquity_map.py \
              test_zorin_native_live_observer.py \
              test_zorin_official_iso_installer_inventory.py \
              test_windows_mint_overlay_root.py \
              test_windows_mint_cow_boot_evidence.py \
              test_windows_zorin_cow_boot_evidence.py \
              test_zorin_qmp_powerdown.py \
              test_zorin_shutdown_witness.py \
              test_windows_x64_two_stage_boot.py; do
            python3 -m unittest discover -s auto_tests -p "$suite" -v
          done
          echo 'SYNTHETIC ONLY. No QEMU, ISO installer, physical disk, GPT writer, ESP/NVRAM writer or Windows rollback.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish bounded contract and source hashes (no images)
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -m 700 -p zorin-synthetic-evidence
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          source = [
              "auto_tests/tools/zorin_synthetic_writeset.py",
              "auto_tests/test_zorin_synthetic_writeset.py",
              "schemas/zorin-synthetic-writeset-v1.schema.json",
              "safety265/assets/live/libertix_disk_identity_gate.py",
          ]
          hashes = {}
          for item in source:
              with Path(item).open("rb") as stream:
                  hashes[item] = hashlib.file_digest(stream, "sha256").hexdigest()
          result = {
              "schemaVersion": 1,
              "headSha": os.environ["GITHUB_SHA"],
              "safety265Commit": "8ed912c6934c33354b0a814201c7217043bd0197",
              "sourceSha256": hashes,
              "syntheticTests": 32,
              "regressionTests": 140,
              "testsComplete": True,
              "diskFormat": "RAW_SYNTHETIC_ONLY",
              "guestOrWindowsDisksUsed": False,
              "qemuExecuted": False,
              "nativeInstallerExecuted": False,
              "syntheticRecoveryOnly": True,
              "windowsRollbackVerified": False,
              "externalAttestationVerified": False,
              "authorization": "DENY_NO_WRITER",
              "productionWriteAuthorized": False,
              "stable": False,
          }
          Path("zorin-synthetic-evidence/contract-tests.json").write_text(
              json.dumps(result, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Archive bounded synthetic-only JSON report
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zorin-synthetic-writeset-verified-text-only
          path: zorin-synthetic-evidence/contract-tests.json
          retention-days: 7
          if-no-files-found: error
