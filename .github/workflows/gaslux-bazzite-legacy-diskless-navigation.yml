name: Bazzite legacy diskless locale navigation lab (no install)

on:
  push:
    branches:
      - feature/bazzite-legacy-iso-scout-20261118
    paths:
      - '.github/workflows/gaslux-bazzite-legacy-diskless-navigation.yml'
      - 'auto_tests/bazzite_legacy_diskless_navigation.py'
      - 'auto_tests/tests/test_bazzite_legacy_diskless_navigation.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test diskless navigation constraints and Ruff
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install pytest ruff PyYAML pillow
          python -m pytest -q \
            auto_tests/tests/test_bazzite_legacy_diskless_navigation.py \
            auto_tests/tests/test_bazzite_legacy_diskless_navigation_workflow.py
          python -m ruff check --config auto_tests/pyproject.toml \
            auto_tests/bazzite_legacy_diskless_navigation.py \
            auto_tests/tests/test_bazzite_legacy_diskless_navigation.py \
            auto_tests/tests/test_bazzite_legacy_diskless_navigation_workflow.py
          python -m ruff format --check --config auto_tests/pyproject.toml \
            auto_tests/bazzite_legacy_diskless_navigation.py \
            auto_tests/tests/test_bazzite_legacy_diskless_navigation.py \
            auto_tests/tests/test_bazzite_legacy_diskless_navigation_workflow.py

  diskless-locale-stage2:
    needs: contracts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reserve ephemeral isolated lab and require exactly pinned ISO headers
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/bazzite-legacy-stage2"
          mkdir -m 700 "$work"
          mkdir bazzite-legacy-stage2-evidence
          base='https://download.bazzite.gg/bazzite-stable-amd64.iso'
          curl --fail --silent --show-error --head --location \
            --retry 2 --connect-timeout 20 --max-time 90 \
            --proto '=https' --proto-redir '=https' \
            "$base" -o "$work/headers.txt"
          bytes=$(tr -d '\r' < "$work/headers.txt" \
            | awk 'tolower($1)=="content-length:" {n=$2} END {print n}')
          [[ "$bytes" == 7907770368 ]] || exit 1
          free=$(df -PB1 "$work" | awk 'NR==2 {print $4}')
          (( free > 7907770368 + 2*1024*1024*1024 )) || exit 1
          echo 'Unsigned Bazzite 42 legacy ISO: optical-only, no target disk or network'
      - name: Install only KVM/OVMF guest and OCR tools
        shell: bash
        timeout-minutes: 18
        run: |
          set -Eeuo pipefail
          sudo env DEBIAN_FRONTEND=noninteractive \
            timeout --signal=TERM --kill-after=30s 300s apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive \
            timeout --signal=TERM --kill-after=30s 900s apt-get install -y -qq \
              qemu-system-x86 ovmf tesseract-ocr
          python -m pip install --user Pillow vncdotool
      - name: Download exact laboratory bytes and SHA gate before guest execution
        shell: bash
        timeout-minutes: 65
        run: |
          set -Eeuo pipefail
          iso="$RUNNER_TEMP/bazzite-legacy-stage2/bazzite-stable-amd64.iso"
          curl --fail --silent --show-error --location \
            --retry 7 --retry-all-errors --retry-delay 5 --continue-at - \
            --connect-timeout 30 --max-time 3400 \
            --proto '=https' --proto-redir '=https' \
            https://download.bazzite.gg/bazzite-stable-amd64.iso -o "$iso"
          [[ $(stat -c '%s' "$iso") == 7907770368 ]] || exit 1
          echo '9c8d06cd8e57f2274678edeb14b4b13a79b8117c70571a65199919a66305b5c7  '"$iso" \
            | sha256sum --check --strict
          echo 'LAB ONLY: hash matches mutable CDN discovery; upstream signature not verified' \
            > bazzite-legacy-stage2-evidence/media-identity.txt
      - name: Boot diskless UEFI, select verified locale and observe optional Continue
        shell: bash
        timeout-minutes: 16
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/bazzite-legacy-stage2"
          iso="$work/bazzite-stable-amd64.iso"
          if [[ -f /usr/share/OVMF/OVMF_CODE_4M.fd && -f /usr/share/OVMF/OVMF_VARS_4M.fd ]]; then
            code=/usr/share/OVMF/OVMF_CODE_4M.fd
            vars=/usr/share/OVMF/OVMF_VARS_4M.fd
          elif [[ -f /usr/share/OVMF/OVMF_CODE.fd && -f /usr/share/OVMF/OVMF_VARS.fd ]]; then
            code=/usr/share/OVMF/OVMF_CODE.fd
            vars=/usr/share/OVMF/OVMF_VARS.fd
          else
            echo 'No OVMF pair'; exit 1
          fi
          host_kib=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          (( host_kib >= 11*1024*1024 )) || { echo 'Runner RAM below 8GiB guest requirement'; exit 1; }
          [[ -c /dev/kvm ]] || { echo 'KVM unavailable'; exit 1; }
          sudo chmod 0666 /dev/kvm
          [[ -r /dev/kvm && -w /dev/kvm ]] || exit 1
          cp "$vars" "$work/disposable-ovmf-vars.fd"
          qemu-system-x86_64 \
            -nodefaults -machine q35,accel=kvm -cpu host -smp 2 -m 8192 \
            -sandbox on,obsolete=deny,elevateprivileges=deny,spawn=deny,resourcecontrol=deny \
            -drive "if=pflash,format=raw,unit=0,readonly=on,file=$code" \
            -drive "if=pflash,format=raw,unit=1,file=$work/disposable-ovmf-vars.fd" \
            -vga std -device ich9-ahci,id=sata \
            -drive "if=none,id=optical,media=cdrom,format=raw,readonly=on,file=$iso" \
            -device ide-cd,drive=optical,bus=sata.0 \
            -boot order=d -nic none -monitor none \
            -serial "file:bazzite-legacy-stage2-evidence/serial.txt" \
            -vnc 127.0.0.1:1 -no-reboot \
            > bazzite-legacy-stage2-evidence/qemu-out.txt \
            2> bazzite-legacy-stage2-evidence/qemu-err.txt &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || :; wait "$pid" 2>/dev/null || :' EXIT
          capture() {
            local label="$1"
            local picture="bazzite-legacy-stage2-evidence/$label.png"
            kill -0 "$pid" || { echo 'Diskless guest exited'; return 1; }
            timeout --signal=TERM --kill-after=5s 40s \
              "$HOME/.local/bin/vncdotool" -s 127.0.0.1::5901 capture "$picture"
            tesseract "$picture" stdout 2>/dev/null \
              > "bazzite-legacy-stage2-evidence/$label.ocr" || :
            tesseract "$picture" stdout tsv 2>/dev/null \
              > "bazzite-legacy-stage2-evidence/$label.tsv" || :
          }
          sleep 200
          capture language-before
          python3 auto_tests/bazzite_legacy_diskless_navigation.py \
            --phase locale \
            --png bazzite-legacy-stage2-evidence/language-before.png \
            --ocr bazzite-legacy-stage2-evidence/language-before.ocr \
            --tsv bazzite-legacy-stage2-evidence/language-before.tsv \
            --coords "$work/locale-coordinate" \
            > bazzite-legacy-stage2-evidence/locale-gate.json
          read -r lx ly < "$work/locale-coordinate"
          [[ "$lx" =~ ^[0-9]{1,4}$ && "$ly" =~ ^[0-9]{1,4}$ ]] || exit 1
          timeout --signal=TERM --kill-after=5s 30s \
            "$HOME/.local/bin/vncdotool" -s 127.0.0.1::5901 \
            move "$lx" "$ly" click 1
          echo 'Only the run-local verified English UK locale was clicked; no guest hard disk'
          sleep 15
          capture language-after
          python3 auto_tests/bazzite_legacy_diskless_navigation.py \
            --phase continue \
            --png bazzite-legacy-stage2-evidence/language-after.png \
            --ocr bazzite-legacy-stage2-evidence/language-after.ocr \
            --tsv bazzite-legacy-stage2-evidence/language-after.tsv \
            --coords "$work/continue-coordinate" \
            > bazzite-legacy-stage2-evidence/continue-gate.json
          if [[ -s "$work/continue-coordinate" ]]; then
            read -r cx cy < "$work/continue-coordinate"
            [[ "$cx" =~ ^[0-9]{1,4}$ && "$cy" =~ ^[0-9]{1,4}$ ]] || exit 1
            timeout --signal=TERM --kill-after=5s 30s \
              "$HOME/.local/bin/vncdotool" -s 127.0.0.1::5901 \
              move "$cx" "$cy" click 1
            sleep 45
            capture after-continue
            echo 'Attempted only safe Continue on diskless guest' \
              > bazzite-legacy-stage2-evidence/continue-observed.txt
          else
            echo 'BLOCKED: No unique Continue control after selecting locale' \
              > bazzite-legacy-stage2-evidence/no-continue.txt
          fi
          python3 - <<'PY' > bazzite-legacy-stage2-evidence/summary.json
          import json
          from pathlib import Path
          root = Path("bazzite-legacy-stage2-evidence")
          moved = (root / "after-continue.ocr").is_file()
          text = (root / "after-continue.ocr").read_text(errors="replace").lower() if moved else ""
          print(json.dumps({
              "distributionId": "bazzite",
              "labOnly": True,
              "firmware": "uefi",
              "partitionStyleObserved": None,
              "diskCount": 0,
              "networkEnabled": False,
              "guestHardDiskAttached": False,
              "localeInputOnlyAfterRuntimeOCRGate": True,
              "continueInputOnlyAfterRuntimeOCRGate": moved,
              "installationSummaryTextObserved": "installation summary" in text,
              "installationDestinationTextObserved": "installation destination" in text,
              "anacondaBinaryIdentityVerified": False,
              "blivetGuiVerified": False,
              "isoProvenanceSignatureVerified": False,
              "installedPayloadVersionVerified": False,
              "installationAuthorized": False,
              "partitionWriteAuthorized": False,
              "windowsEspWriteAuthorized": False,
              "secureBootEnrollmentAuthorized": False,
              "windowsDualBootVerified": False,
          }, indent=2, sort_keys=True))
          PY
          cat bazzite-legacy-stage2-evidence/summary.json
      - name: Publish screenshot/OCR only; never ISO or OVMF variables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazzite-legacy-diskless-locale-navigation-evidence
          path: bazzite-legacy-stage2-evidence/
          if-no-files-found: warn
          retention-days: 7
