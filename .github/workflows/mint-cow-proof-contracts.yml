name: Mint COW boot evidence contracts

on:
  push:
    branches:
      - test/mint-cow-proof-validation
    paths:
      - .github/workflows/mint-cow-proof-contracts.yml
      - auto_tests/tools/validate_mint_cow_boot_evidence.py
      - auto_tests/test_windows_mint_cow_boot_evidence.py
      - auto_tests/test_windows_x64_private_workspace.py
      - auto_tests/tools/windows_mint_overlay_root.py
      - auto_tests/test_windows_mint_overlay_root.py
      - auto_tests/tools/windows_x64_tcg_firstboot.py
      - auto_tests/test_windows_x64_private_workspace.py
      - .github/workflows/windows-cachyos-post-ext4-fourth-boot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile Mint evidence validator and tests
        run: |
          set -Eeuo pipefail
          python3 -m py_compile auto_tests/tools/validate_mint_cow_boot_evidence.py auto_tests/test_windows_mint_cow_boot_evidence.py auto_tests/tools/windows_mint_overlay_root.py auto_tests/test_windows_mint_overlay_root.py auto_tests/tools/windows_x64_tcg_firstboot.py auto_tests/test_windows_x64_private_workspace.py
          ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/mint-cow-proof-contracts.yml"); YAML.parse_file(".github/workflows/windows-cachyos-post-ext4-fourth-boot.yml")'
      - name: Run fail-closed Mint evidence tests
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s auto_tests -p 'test_windows_mint_overlay_root.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_windows_mint_cow_boot_evidence.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_windows_x64_private_workspace.py' -v
      - name: Exercise root-owned guestmount with runner-readable FUSE permissions
        shell: bash
        run: |
          set -Eeuo pipefail
          set -x
          trap 'rc=$?; echo "FUSE smoke failed at line ${LINENO} (exit ${rc})" >&2; exit "$rc"' ERR
          printf 'GITHUB_ACTIONS=%s RUNNER_ENVIRONMENT=%s RUNNER_OS=%s GITHUB_REPOSITORY=%s UID=%s\\n' \
            "${GITHUB_ACTIONS:-missing}" "${RUNNER_ENVIRONMENT:-missing}" \
            "${RUNNER_OS:-missing}" "${GITHUB_REPOSITORY:-missing}" "$(id -u)"
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          test "$(id -u)" -ne 0
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils libguestfs-tools linux-image-virtual fuse3
          source auto_tests/tools/windows_x64_libguestfs_kernel.sh
          sudo modprobe fuse
          test -c /dev/fuse && test ! -L /dev/fuse
          if ! sudo grep -Eq '^[[:space:]]*user_allow_other([[:space:]]|$)' /etc/fuse.conf; then
            printf 'user_allow_other\n' | sudo tee -a /etc/fuse.conf >/dev/null
          fi
          sudo grep -Eq '^[[:space:]]*user_allow_other([[:space:]]|$)' /etc/fuse.conf
          work="$(mktemp -d "$RUNNER_TEMP/gaslux-fuse-smoke-XXXXXXXX")"
          chmod 700 "$work"
          disk="$work/guest.raw"
          mountpoint="$work/target"
          mkdir -m 700 "$mountpoint"
          cleanup() {
            local original_status=$?
            trap - EXIT

            if mountpoint -q "$mountpoint"; then
              if ! sudo guestunmount "$mountpoint" >/dev/null 2>&1; then
                echo "ERROR: guestunmount failed; preserving private workspace: $work" >&2
                exit 1
              fi
            fi
            if mountpoint -q "$mountpoint"; then
              echo "ERROR: FUSE mount remains active; preserving private workspace: $work" >&2
              exit 1
            fi

            if [[ ! -d "$work" || -L "$work" || "$(stat -c '%u' -- "$work")" != "$(id -u)" ]]; then
              echo "ERROR: refusing to remove an unowned or non-directory workspace: $work" >&2
              exit 1
            fi
            local work_real runner_temp_real
            work_real="$(realpath -e -- "$work")"
            runner_temp_real="$(realpath -e -- "$RUNNER_TEMP")"
            case "$work_real" in
              "$runner_temp_real"/gaslux-fuse-smoke-*) ;;
              *)
                echo "ERROR: refusing to remove workspace outside RUNNER_TEMP: $work_real" >&2
                exit 1
                ;;
            esac
            rm -rf --one-file-system -- "$work_real"
            exit "$original_status"
          }
          trap cleanup EXIT
          truncate -s 64M "$disk"
          sudo mkfs.ext4 -F "$disk" >/dev/null
          sudo guestmount -a "$disk" -m /dev/sda --rw \
            -o allow_other -o default_permissions "$mountpoint"
          printf 'runner-visible\n' | sudo tee "$mountpoint/runner-visible" >/dev/null
          test -d "$mountpoint"
          test "$(cat "$mountpoint/runner-visible")" = runner-visible
          sudo guestunmount "$mountpoint"
          # Exercise the exact libguestfs copy-in semantics used by the Mint root transfer.
          copy_disk="$work/copy-in.raw"
          source_dir="$work/source-root"
          truncate -s 64M "$copy_disk"
          sudo mkfs.ext4 -F "$copy_disk" >/dev/null
          mkdir -p "$source_dir/etc" "$source_dir/usr/bin"
          printf '%s\n' 'NAME=Linux Mint' 'ID=linuxmint' > "$source_dir/etc/os-release"
          printf '%s\n' '#!/bin/sh' 'exit 0' > "$source_dir/usr/bin/mint-smoke"
          chmod 0755 "$source_dir/usr/bin/mint-smoke"
          sudo guestfish --rw -a "$copy_disk" -m /dev/sda copy-in "$source_dir/." /
          actual_os_release="$(sudo guestfish --ro -a "$copy_disk" -m /dev/sda cat /etc/os-release)"
          test "$actual_os_release" = "$(printf '%s\n' 'NAME=Linux Mint' 'ID=linuxmint')"
          test "$(sudo guestfish --ro -a "$copy_disk" -m /dev/sda is-file /usr/bin/mint-smoke)" = true
          downloaded_os_release="$work/downloaded-os-release"
          sudo guestfish --ro -a "$copy_disk" -m /dev/sda download /etc/os-release "$downloaded_os_release"
          test "$(cat "$downloaded_os_release")" = "$actual_os_release"
          echo 'PASS: guestfish read-only download retrieves an ext4 file to runner-local storage'
          echo 'PASS: guestfish copy-in transfers root directory contents directly into ext4'
          echo 'PASS: root-owned guestmount FUSE is readable by the unprivileged runner with default permission checks'
