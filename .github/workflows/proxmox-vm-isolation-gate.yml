name: Proxmox Windows lab disk-isolation preflight (read-only)
on:
  push:
    branches:
      - feature/proxmox-guest-disk-isolation-gate
  pull_request:
    branches:
      - feature/windows-guest-recovery-proof
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-destructive-vm-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python syntax
        run: python3 -m py_compile auto_tests/tools/cachyos_lab_readiness.py auto_tests/test_cachyos_lab_readiness.py
      - name: Run read-only Proxmox isolation tests with synthetic configs
        run: python3 -m unittest auto_tests.test_cachyos_lab_readiness -v
      - name: Install lint tools
        run: python3 -m pip install --break-system-packages ruff==0.13.3
      - name: Static analysis
        run: |
          python3 -m ruff check --config auto_tests/pyproject.toml auto_tests/tools/cachyos_lab_readiness.py auto_tests/test_cachyos_lab_readiness.py
          python3 -m ruff format --check --config auto_tests/pyproject.toml auto_tests/tools/cachyos_lab_readiness.py auto_tests/test_cachyos_lab_readiness.py
