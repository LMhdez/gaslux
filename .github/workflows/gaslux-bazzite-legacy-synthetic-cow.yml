name: Bazzite legacy owned synthetic GPT disposable COW storage lab

on:
  push:
    branches:
      - feature/bazzite-legacy-iso-scout-20261118
    paths:
      - '.github/workflows/gaslux-bazzite-legacy-synthetic-cow.yml'
      - 'auto_tests/bazzite_legacy_readonly_storage_gate.py'
      - 'auto_tests/tests/test_bazzite_legacy_readonly_storage_gate.py'
      - 'auto_tests/tests/test_bazzite_legacy_synthetic_cow_workflow.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test synthetic-storage isolation contracts and formatting
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install pytest ruff PyYAML pillow
          python -m pytest -q \
            auto_tests/tests/test_bazzite_legacy_readonly_storage_gate.py \
            auto_tests/tests/test_bazzite_legacy_synthetic_cow_workflow.py
          python -m ruff check --config auto_tests/pyproject.toml \
            auto_tests/bazzite_legacy_readonly_storage_gate.py \
            auto_tests/tests/test_bazzite_legacy_readonly_storage_gate.py \
            auto_tests/tests/test_bazzite_legacy_readonly_gpt_workflow.py
          python -m ruff format --check --config auto_tests/pyproject.toml \
            auto_tests/bazzite_legacy_readonly_storage_gate.py \
            auto_tests/tests/test_bazzite_legacy_readonly_storage_gate.py \
            auto_tests/tests/test_bazzite_legacy_readonly_gpt_workflow.py

  owned-cow-gpt-ovmf:
    needs: contracts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 86
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify previous diskless GUI observation source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api repos/LMhdez/gaslux/actions/runs/44443420174 \
            | jq -e '
                .conclusion == "success"
                and .head_sha == "c7c808f6da61fca02f2dadb37f74d3bfa0de1166"
                and .head_repository.full_name == "LMhdez/gaslux"
                and .event == "push"
              ' > /dev/null
          echo 'Authenticated prior no-disk native storage page; no ISO signing claim'
      - name: Install isolated QEMU, OVMF, GPT and visual observation utilities
        shell: bash
        timeout-minutes: 16
        run: |
          set -Eeuo pipefail
          sudo env DEBIAN_FRONTEND=noninteractive \
            timeout --signal=TERM --kill-after=30s 300s apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive \
            timeout --signal=TERM --kill-after=30s 800s apt-get install -y -qq \
              qemu-system-x86 qemu-utils ovmf gdisk tesseract-ocr
          python -m pip install --user Pillow vncdotool
      - name: Create exact runner-owned GPT raw image before sealing it read-only
        shell: bash
        timeout-minutes: 12
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/bazzite-synthetic-gpt-cow"
          mkdir -m 700 "$work"
          mkdir bazzite-synthetic-cow-evidence
          disk="$work/gaslux-owned-raw-gpt.img"
          [[ ! -e "$disk" && ! -L "$disk" ]] || exit 1
          [[ -d "$work" && ! -L "$work" ]] || exit 1
          [[ "$(stat -c '%u' "$work")" == "$(id -u)" ]] || exit 1
          truncate -s 68719476736 "$disk"
          [[ "$(stat -c '%s' "$disk")" == 68719476736 ]] || exit 1
          sgdisk --clear \
            -U 37566E43-902A-4DF9-901E-25007AF638C2 \
            -n 1:2048:+512M -t 1:EF00 -c 1:GASLUX-LAB-ESP \
            -n 2:0:+1G -t 2:8300 -c 2:GASLUX-LAB-DATA "$disk"
          sgdisk --verify "$disk"
          sgdisk --print "$disk" > bazzite-synthetic-cow-evidence/synthetic-gpt.txt
          grep -F 'GASLUX-LAB-ESP' bazzite-synthetic-cow-evidence/synthetic-gpt.txt
          grep -F 'GASLUX-LAB-DATA' bazzite-synthetic-cow-evidence/synthetic-gpt.txt
          [[ -f "$disk" && ! -L "$disk" ]] || exit 1
          [[ "$(stat -c '%u' "$disk")" == "$(id -u)" ]] || exit 1
          chmod 0400 "$disk"
          [[ "$(stat -c '%a' "$disk")" == 400 ]] || exit 1
          sha256sum "$disk" > "$work/pre-boot.sha256"
          cp "$work/pre-boot.sha256" bazzite-synthetic-cow-evidence/pre-boot.sha256
          echo 'Owned synthetic GPT raw image sealed mode 0400; no Windows image'
      - name: Create owned disposable QCOW2 above sealed synthetic GPT
        shell: bash
        timeout-minutes: 5
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/bazzite-synthetic-gpt-cow"
          disk="$work/gaslux-owned-raw-gpt.img"
          cow="$work/gaslux-disposable-guest-cow.qcow2"
          [[ -f "$disk" && ! -L "$disk" && ! -e "$cow" && ! -L "$cow" ]] || exit 1
          [[ "$(stat -c '%a' "$disk")" == 400 ]] || exit 1
          (cd "$work" && sha256sum --check --strict pre-boot.sha256)
          qemu-img create -f qcow2 -F raw -b "$disk" "$cow"
          [[ -f "$cow" && ! -L "$cow" ]] || exit 1
          [[ "$(stat -c '%u' "$cow")" == "$(id -u)" ]] || exit 1
          chmod 0600 "$cow"
          qemu-img info --output=json "$cow" \
            | jq -e --arg disk "$disk" '
                .format == "qcow2"
                and .["backing-filename"] == $disk
                and .["backing-filename-format"] == "raw"
                and .["virtual-size"] == 68719476736
              ' > /dev/null
          echo 'COW is owned by runner and points only to sealed lab GPT' \
            > bazzite-synthetic-cow-evidence/cow-ownership-gate.txt

      - name: Download and verify legacy ISO exact lab bytes before optical boot
        shell: bash
        timeout-minutes: 65
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/bazzite-synthetic-gpt-cow"
          iso="$work/bazzite-stable-amd64.iso"
          url='https://download.bazzite.gg/bazzite-stable-amd64.iso'
          curl --fail --silent --show-error --head --location \
            --retry 3 --connect-timeout 20 --max-time 90 \
            --proto '=https' --proto-redir '=https' "$url" \
            -o "$work/iso-head.txt"
          size=$(tr -d '\r' < "$work/iso-head.txt" \
            | awk 'tolower($1)=="content-length:" {n=$2} END {print n}')
          [[ "$size" == 7907770368 ]] || exit 1
          free=$(df -PB1 "$work" | awk 'NR==2 {print $4}')
          (( free > 7907770368 + 2*1024*1024*1024 )) || exit 1
          curl --fail --silent --show-error --location \
            --retry 7 --retry-all-errors --retry-delay 5 --continue-at - \
            --connect-timeout 30 --max-time 3400 \
            --proto '=https' --proto-redir '=https' "$url" -o "$iso"
          [[ "$(stat -c '%s' "$iso")" == 7907770368 ]] || exit 1
          echo '9c8d06cd8e57f2274678edeb14b4b13a79b8117c70571a65199919a66305b5c7  '"$iso" \
            | sha256sum --check --strict
          (cd "$work" && sha256sum --check --strict pre-boot.sha256)
          echo 'LAB ONLY: ISO hash confirmed, but official signature still absent' \
            > bazzite-synthetic-cow-evidence/iso-trust-boundary.txt
      - name: Observe native storage GUI through disposable GPT COW overlay
        shell: bash
        timeout-minutes: 16
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/bazzite-synthetic-gpt-cow"
          iso="$work/bazzite-stable-amd64.iso"
          disk="$work/gaslux-owned-raw-gpt.img"
          cow="$work/gaslux-disposable-guest-cow.qcow2"
          [[ -f "$disk" && ! -L "$disk" && -f "$cow" && ! -L "$cow" ]] || exit 1
          [[ "$(stat -c '%a' "$disk")" == 400 ]] || exit 1
          [[ "$(stat -c '%s' "$disk")" == 68719476736 ]] || exit 1
          (cd "$work" && sha256sum --check --strict pre-boot.sha256)
          qemu-img info --output=json "$cow" \
            | jq -e --arg disk "$disk" '
                .format == "qcow2"
                and .["backing-filename"] == $disk
                and .["backing-filename-format"] == "raw"
                and .["virtual-size"] == 68719476736
              ' > /dev/null
          [[ -c /dev/kvm ]] || { echo 'KVM not available'; exit 1; }
          sudo chmod 0666 /dev/kvm
          [[ -r /dev/kvm && -w /dev/kvm ]] || exit 1
          ram=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          (( ram >= 11*1024*1024 )) || exit 1
          if [[ -f /usr/share/OVMF/OVMF_CODE_4M.fd && -f /usr/share/OVMF/OVMF_VARS_4M.fd ]]; then
            code=/usr/share/OVMF/OVMF_CODE_4M.fd
            vars=/usr/share/OVMF/OVMF_VARS_4M.fd
          elif [[ -f /usr/share/OVMF/OVMF_CODE.fd && -f /usr/share/OVMF/OVMF_VARS.fd ]]; then
            code=/usr/share/OVMF/OVMF_CODE.fd
            vars=/usr/share/OVMF/OVMF_VARS.fd
          else
            echo 'No compatible OVMF firmware pair'; exit 1
          fi
          cp "$vars" "$work/OVMF_VARS.disposable.fd"
          qemu-system-x86_64 \
            -nodefaults -machine q35,accel=kvm -cpu host -smp 2 -m 8192 \
            -sandbox on,obsolete=deny,elevateprivileges=deny,spawn=deny,resourcecontrol=deny \
            -drive "if=pflash,format=raw,unit=0,readonly=on,file=$code" \
            -drive "if=pflash,format=raw,unit=1,file=$work/OVMF_VARS.disposable.fd" \
            -vga std -device ich9-ahci,id=sata \
            -drive "if=none,id=optical,media=cdrom,format=raw,readonly=on,file=$iso" \
            -device ide-cd,drive=optical,bus=sata.0 \
            -drive "if=none,id=synthetic-cow,media=disk,format=qcow2,readonly=off,file=$cow" \
            -device virtio-blk-pci,drive=synthetic-cow,serial=GASLUX-COWGPT-42 \
            -boot order=d -nic none -monitor none \
            -serial "file:bazzite-synthetic-cow-evidence/guest-serial.txt" \
            -vnc 127.0.0.1:1 -no-reboot \
            > bazzite-synthetic-cow-evidence/qemu-out.txt \
            2> bazzite-synthetic-cow-evidence/qemu-err.txt &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || :; wait "$pid" 2>/dev/null || :' EXIT
          capture() {
            local phase="$1"
            kill -0 "$pid" || { echo 'Synthetic GPT guest unexpectedly exited'; return 1; }
            local png="bazzite-synthetic-cow-evidence/$phase.png"
            timeout --signal=TERM --kill-after=5s 40s \
              "$HOME/.local/bin/vncdotool" -s 127.0.0.1::5901 capture "$png"
            tesseract "$png" stdout 2>/dev/null \
              > "bazzite-synthetic-cow-evidence/$phase.ocr" || :
            tesseract "$png" stdout tsv 2>/dev/null \
              > "bazzite-synthetic-cow-evidence/$phase.tsv" || :
          }
          sleep 200
          capture language-before
          python3 auto_tests/bazzite_legacy_diskless_navigation.py \
            --phase locale \
            --png bazzite-synthetic-cow-evidence/language-before.png \
            --ocr bazzite-synthetic-cow-evidence/language-before.ocr \
            --tsv bazzite-synthetic-cow-evidence/language-before.tsv \
            --coords "$work/locale-coordinate" \
            > bazzite-synthetic-cow-evidence/locale-gate.json
          read -r lx ly < "$work/locale-coordinate"
          [[ "$lx" =~ ^[0-9]{1,4}$ && "$ly" =~ ^[0-9]{1,4}$ ]] || exit 1
          timeout --signal=TERM --kill-after=5s 30s \
            "$HOME/.local/bin/vncdotool" -s 127.0.0.1::5901 \
            move "$lx" "$ly" click 1
          sleep 15
          capture language-after
          python3 auto_tests/bazzite_legacy_blue_button.py \
            --png bazzite-synthetic-cow-evidence/language-after.png \
            --ocr bazzite-synthetic-cow-evidence/language-after.ocr \
            --coords "$work/continue-coordinate" \
            > bazzite-synthetic-cow-evidence/continue-gate.json
          read -r cx cy < "$work/continue-coordinate"
          [[ "$cx" =~ ^[0-9]{1,4}$ && "$cy" =~ ^[0-9]{1,4}$ ]] || exit 1
          timeout --signal=TERM --kill-after=5s 30s \
            "$HOME/.local/bin/vncdotool" -s 127.0.0.1::5901 \
            move "$cx" "$cy" click 1
          sleep 45
          capture summary
          python3 auto_tests/bazzite_legacy_readonly_storage_gate.py \
            --phase summary \
            --png bazzite-synthetic-cow-evidence/summary.png \
            --ocr bazzite-synthetic-cow-evidence/summary.ocr \
            --tsv bazzite-synthetic-cow-evidence/summary.tsv \
            --coords "$work/destination-coordinate" \
            > bazzite-synthetic-cow-evidence/destination-target.json
          read -r dx dy < "$work/destination-coordinate"
          [[ "$dx" =~ ^[0-9]{1,4}$ && "$dy" =~ ^[0-9]{1,4}$ ]] || exit 1
          timeout --signal=TERM --kill-after=5s 30s \
            "$HOME/.local/bin/vncdotool" -s 127.0.0.1::5901 \
            move "$dx" "$dy" click 1
          sleep 25
          capture native-storage
          python3 auto_tests/bazzite_legacy_readonly_storage_gate.py \
            --phase destination \
            --ocr bazzite-synthetic-cow-evidence/native-storage.ocr \
            > bazzite-synthetic-cow-evidence/native-storage-report.json
          python3 - <<'PY' > bazzite-synthetic-cow-evidence/summary.json
          import json
          from pathlib import Path
          root = Path("bazzite-synthetic-cow-evidence")
          observed = json.loads((root / "native-storage-report.json").read_text())
          print(json.dumps({
              "distributionId": "bazzite",
              "labOnly": True,
              "uefiFirmware": True,
              "syntheticRawGptDiskPresentedToQemu": False,
              "syntheticDiskPresentedThroughOwnedCow": True,
              "qemuGuestDiskReadOnly": False,
              "guestWritesConfinedToDisposableOwnedCow": True,
              "immutableGptBackingVerifiedAfterGuest": None,
              "syntheticDiskVirtualBytes": 68719476736,
              "syntheticGptDiskGuid": "37566E43-902A-4DF9-901E-25007AF638C2",
              "guestDiskDetectedByInstaller": None,
              "advancedCustomBlivetOptionTextObserved": observed[
                  "advancedCustomBlivetOptionTextObserved"
              ],
              "nativeStoragePageObserved": observed["nativeStoragePageObserved"],
              "installerStorageWriteTested": False,
              "blivetGuiExecutableVerified": False,
              "isoCryptographicProvenanceVerified": False,
              "installationAuthorized": False,
              "partitionWriteAuthorized": False,
              "windowsEspWriteAuthorized": False,
              "windowsDualBootVerified": False,
          }, indent=2, sort_keys=True))
          PY
          cat bazzite-synthetic-cow-evidence/summary.json
          echo 'Only storage GUI observation; no partition, Blivet, Done or Begin Installation input'
      - name: Verify immutable GPT and discard owned disposable QCOW2
        if: always()
        shell: bash
        timeout-minutes: 10
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/bazzite-synthetic-gpt-cow"
          disk="$work/gaslux-owned-raw-gpt.img"
          if [[ -f "$disk" ]]; then
            [[ ! -L "$disk" && "$(stat -c '%u' "$disk")" == "$(id -u)" ]] || exit 1
            [[ "$(stat -c '%a' "$disk")" == 400 ]] || exit 1
            [[ "$(stat -c '%s' "$disk")" == 68719476736 ]] || exit 1
            (cd "$work" && sha256sum --check --strict pre-boot.sha256)
            sgdisk --verify "$disk"
            cow="$work/gaslux-disposable-guest-cow.qcow2"
            if [[ -f "$cow" ]]; then
              [[ ! -L "$cow" && "$(stat -c '%u' "$cow")" == "$(id -u)" ]] || exit 1
              qemu-img info --output=json "$cow" \
                | jq -e --arg disk "$disk" '
                    .format == "qcow2"
                    and .["backing-filename"] == $disk
                    and .["backing-filename-format"] == "raw"
                    and .["virtual-size"] == 68719476736
                  ' > /dev/null
              qemu-img info --output=json "$cow" \
                | jq '{format, "virtual-size": .["virtual-size"], "actual-size": .["actual-size"]}' \
                > bazzite-synthetic-cow-evidence/cow-size-after-guest.json
              rm -- "$cow"
              [[ ! -e "$cow" && ! -L "$cow" ]] || exit 1
            fi
            printf '%s\n' 'Immutable lab GPT SHA unchanged and disposable guest QCOW2 discarded' \
              > bazzite-synthetic-cow-evidence/post-boot-immutability.txt
          else
            echo 'Owned synthetic GPT was not created; no immutability proof'
          fi
      - name: Publish GUI/OCR, backing digest and COW discard evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazzite-legacy-synthetic-owned-cow-gpt-observation
          path: bazzite-synthetic-cow-evidence/
          if-no-files-found: warn
          retention-days: 7
