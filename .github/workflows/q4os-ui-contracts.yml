name: Q4OS no-write UI map contracts (schema + provenance)
on:
  push:
    branches:
      - docs/distro-one-shot-playbooks-20261119
    paths:
      - '.github/workflows/q4os-ui-contracts.yml'
      - '.github/workflows/q4os-ui-repro-2vm.yml'
      - 'auto_tests/tests/test_q4os_ui_map_contract.py'
      - 'schemas/distro-ui-map.schema.json'
      - 'schemas/distro-ui-evidence.schema.json'
      - 'docs/distro-backends/ui-maps/q4os.json'
      - 'docs/distro-backends/evidence/q4os-manifest.json'
  pull_request:
    paths:
      - '.github/workflows/q4os-ui-contracts.yml'
      - '.github/workflows/q4os-ui-repro-2vm.yml'
      - 'auto_tests/tests/test_q4os_ui_map_contract.py'
      - 'schemas/distro-ui-map.schema.json'
      - 'schemas/distro-ui-evidence.schema.json'
      - 'docs/distro-backends/ui-maps/q4os.json'
      - 'docs/distro-backends/evidence/q4os-manifest.json'
permissions:
  contents: read
jobs:
  schema-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate schemas, UI state machine and fail-closed evidence semantics
        run: |
          python -m pip install pytest jsonschema ruff
          python -m compileall -q auto_tests/tests/test_q4os_ui_map_contract.py
          python -m ruff check --config auto_tests/pyproject.toml auto_tests/tests/test_q4os_ui_map_contract.py
          python -m ruff format --check --config auto_tests/pyproject.toml auto_tests/tests/test_q4os_ui_map_contract.py
          python -m pytest -q auto_tests/tests/test_q4os_ui_map_contract.py
