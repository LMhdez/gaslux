name: Synthetic Windows-like GPT/EFI/NTFS read-only inspector (NO Windows)
on:
  push:
    branches:
      - test/windows10-postboot-gpt-readonly-audit
      - test/windows10-popos-same-disk-overlay-stage
    paths:
      - .github/workflows/windows10-gpt-readonly-guestfs-smoke.yml
      - auto_tests/tools/windows10_synthetic_gpt_guestfs_smoke.py
      - auto_tests/tools/windows10_popos_same_disk_overlay_stage.py
      - auto_tests/tools/windows10_popos_gpt_mirror_gate.py
      - auto_tests/test_windows10_popos_gpt_mirror_gate.py
      - auto_tests/test_windows10_popos_same_disk_overlay_stage.py
      - auto_tests/tools/windows_x64_installed_gpt_ro_audit.py
      - auto_tests/test_windows_x64_installed_gpt_ro_audit.py
      - auto_tests/tools/windows_x64_libguestfs_kernel.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-file-backed-gpt:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Confirm native negative tests before any synthetic QCOW2 write
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          test "$RUNNER_TEMP" = /home/runner/work/_temp
          python3 -m py_compile auto_tests/tools/windows10_synthetic_gpt_guestfs_smoke.py
          python3 -m py_compile auto_tests/tools/windows_x64_installed_gpt_ro_audit.py
          python3 -m py_compile auto_tests/tools/windows10_popos_same_disk_overlay_stage.py
          python3 -m py_compile auto_tests/tools/windows10_popos_gpt_mirror_gate.py
          python3 -m unittest discover -s auto_tests -p 'test_windows10_popos_same_disk_overlay_stage.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_windows10_popos_gpt_mirror_gate.py' -v
          bash -n auto_tests/tools/windows_x64_libguestfs_kernel.sh
          python3 -m unittest discover -s auto_tests -p 'test_windows_x64_installed_gpt_ro_audit.py' -v
      - name: Install disposable guestfs appliance and complete generic kernel
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-utils python3-guestfs libguestfs-tools linux-image-generic
          # GitHub-hosted disposable VM only: accelerate guestfs appliance
          # without granting access to any host storage device.
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -c /dev/kvm && test ! -L /dev/kvm
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          source auto_tests/tools/windows_x64_libguestfs_kernel.sh
      - name: Prove GPT/EFI/BCD and Windows-like NTFS checks on synthetic QCOW2
        shell: bash
        env:
          GASLUX_RUN_SYNTHETIC_POP_OVERLAY_STAGE: '1'
          GASLUX_SYNTHETIC_OVERSIZED_WINDOWS_PMBR: '1'
          GASLUX_WIN10_POP_OVERLAY_CONSENT: I_ACCEPT_GITHUB_ONLY_QCOW2_COPY_ON_WRITE_LINUX_ROOT_STAGE
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_TEMP" = /home/runner/work/_temp
          mkdir -p "$GITHUB_WORKSPACE/windows-x64-tcg-evidence"
          timeout --kill-after=10s 480s python3 \
            auto_tests/tools/windows10_synthetic_gpt_guestfs_smoke.py
          echo 'PASS: guestfs API inspected a self-created synthetic GPT/NTFS QCOW2 and staged unformatted Pop root in a disposable COW overlay.' >> "$GITHUB_STEP_SUMMARY"
          echo 'NO Windows OS, installed Pop, boot after staging, working dual boot or WinRE recovery was executed.' >> "$GITHUB_STEP_SUMMARY"
