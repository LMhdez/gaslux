name: Bootstrap Libertix and CachyOS preflight
# One-time import. This workflow does not install Linux or touch any real disks.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-libertix.yml
      - bootstrap/libertix-cachyos-preflight.patch
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gaslux-bootstrap
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'LMhdez/gaslux'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out destination
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Import source, test CachyOS preflight and publish branches
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch main
          if git ls-remote --exit-code --heads origin refs/heads/feature/cachyos-preflight >/dev/null 2>&1; then
            echo "Feature branch already exists; refusing to overwrite it."
            exit 1
          fi
          if [ -e README.md ] || [ -e assets/live/libertix-install-main.sh ]; then
            echo "Destination is no longer in bootstrap-only state; refusing to overwrite existing work."
            exit 1
          fi
          git remote add upstream https://github.com/ekimiateam/libertix.git
          git fetch --no-tags upstream main
          # GitHub Actions tokens cannot import upstream workflow files. Import a
          # pinned source snapshot, excluding release workflows and bootstrap files.
          git restore --source=upstream/main --staged --worktree -- . ':(exclude).github/workflows/**' ':(exclude)bootstrap/**'
          upstream_sha="$(git rev-parse upstream/main)"
          printf 'Imported from ekimiateam/libertix at commit %s.\\nOriginal source: https://github.com/ekimiateam/libertix\\nUpstream release workflows were intentionally not copied.\\n' "$upstream_sha" > UPSTREAM-SOURCE.md
          git add UPSTREAM-SOURCE.md
          git commit -sm "Import upstream Libertix source snapshot without release workflows"
          git switch -c feature/cachyos-preflight
          git apply --check bootstrap/libertix-cachyos-preflight.patch
          git apply bootstrap/libertix-cachyos-preflight.patch
          python3 -m unittest discover -s auto_tests -p 'test_cachyos_preflight.py' -v
          git add assets/live/libertix-cachyos-preflight.py auto_tests/test_cachyos_preflight.py docs/CACHYOS_BACKEND.md
          git commit -sm "Add read-only CachyOS Archiso preflight and regression tests"
          git switch main
          git push origin HEAD:refs/heads/main
          git push origin feature/cachyos-preflight:refs/heads/feature/cachyos-preflight
          echo "Published Libertix baseline to main and CachyOS preflight to feature/cachyos-preflight."