name: Linux Mint 22.3 genuine ISO and SquashFS read-only proof

on:
  push:
    branches: [fix/mint-squashfs-exact-capabilities]
    paths:
      - '.github/workflows/mint-223-real-squashfs-proof.yml'
      - 'assets/live/libertix-distribution-common.sh'
      - 'assets/live/libertix-install-runtime-common.sh'
      - 'release-config.json'
  pull_request:
    paths:
      - '.github/workflows/mint-223-real-squashfs-proof.yml'
      - 'assets/live/libertix-distribution-common.sh'
      - 'assets/live/libertix-install-runtime-common.sh'
      - 'release-config.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-squashfs-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install actual SquashFS tooling
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends squashfs-tools
      - name: Execute production validation on real Mint/Zorin SquashFS fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          source assets/live/libertix-distribution-common.sh
          dir="$(mktemp -d)"
          trap 'rm -rf -- "$dir"' EXIT
          for distro in mint zorin; do
            case "$distro" in mint) os_id=linuxmint ;; zorin) os_id=zorin ;; esac
            base="$dir/$distro"
            mkdir -p "$base/tree/etc" "$base/tree/var/lib/dpkg" \
              "$base/tree/usr/sbin" "$base/tree/usr/bin"
            printf 'ID=%s\nID_LIKE="ubuntu debian"\n' "$os_id" > "$base/tree/etc/os-release"
            printf 'Package: base-files\n' > "$base/tree/var/lib/dpkg/status"
            for name in update-grub update-initramfs; do
              printf '#!/bin/sh\nexit 0\n' > "$base/tree/usr/sbin/$name"
            done
            printf '#!/bin/sh\nexit 0\n' > "$base/tree/usr/bin/lsinitramfs"
            chmod +x "$base/tree/usr/sbin/"* "$base/tree/usr/bin/lsinitramfs"
            mksquashfs "$base/tree" "$base/valid.squashfs" \
              -noappend -processors 2 -comp gzip >/dev/null
            assert_distribution_rootfs_compatible_or_die "$base/valid.squashfs" "$os_id"
            if assert_distribution_rootfs_compatible_or_die "$base/valid.squashfs" wrong-id; then
              echo "::error::Accepted wrong OS identity"
              exit 1
            fi
            rm "$base/tree/usr/sbin/update-grub"
            mksquashfs "$base/tree" "$base/missing.squashfs" \
              -noappend -processors 2 -comp gzip >/dev/null
            if assert_distribution_rootfs_compatible_or_die "$base/missing.squashfs" "$os_id"; then
              echo "::error::Accepted missing target capability"
              exit 1
            fi
          done
          echo 'PASS: actual SquashFS tools accept Mint/Zorin fixtures and reject mismatches'

  official-mint-iso-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      MINT_SHA: a081ab202cfda17f6924128dbd2de8b63518ac0531bcfe3f1a1b88097c459bd4
      MINT_BYTES: '3091660800'
      MINT_SOURCE: https://pub.linuxmint.io/stable/22.3/linuxmint-22.3-cinnamon-64bit.iso
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require exact stable catalog Mint identity and enough scratch space
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          catalog = json.loads(Path("release-config.json").read_text())
          matches = [entry for entry in catalog["distributions"] if entry["id"] == "mint"]
          assert len(matches) == 1, "Mint catalog ID ambiguous"
          mint = matches[0]
          assert mint["name"] == "Linux Mint 22.3 Cinnamon"
          assert mint["osReleaseId"] == "linuxmint"
          assert mint["isoInstaller"] == os.environ["MINT_SOURCE"]
          assert mint["isoInstallerSha256"] == os.environ["MINT_SHA"]
          assert mint["isoInstallerSizeBytes"] == int(os.environ["MINT_BYTES"])
          assert shutil.disk_usage("/tmp").free > 5 * 1024**3
          print("Mint pinned release identity and free scratch space verified")
          PY
      - name: Install read-only inspection dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends aria2 squashfs-tools util-linux
      - name: Download full official Mint ISO and verify pinned SHA-256 and bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/mint223/evidence
          aria2c --file-allocation=none --split=4 --max-connection-per-server=4 \
            --max-tries=4 --retry-wait=10 --connect-timeout=30 --timeout=90 \
            --check-integrity=true --checksum="sha-256=$MINT_SHA" \
            --dir=/tmp/mint223 --out=mint.iso "$MINT_SOURCE"
          test -f /tmp/mint223/mint.iso
          test ! -L /tmp/mint223/mint.iso
          test "$(stat -c %s /tmp/mint223/mint.iso)" = "$MINT_BYTES"
          printf '%s  %s\n' "$MINT_SHA" /tmp/mint223/mint.iso | sha256sum -c -
          printf 'source=%s\nbytes=%s\nsha256=%s\n' \
            "$MINT_SOURCE" "$MINT_BYTES" "$MINT_SHA" > /tmp/mint223/evidence/source.txt
      - name: Verify actual Mint filesystem.squashfs without installing or writing to targets
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n assets/live/libertix-distribution-common.sh assets/live/libertix-install-runtime-common.sh
          sudo env MINT_SHA="$MINT_SHA" bash -s <<'CHECK_REAL_MINT'
          set -Eeuo pipefail
          source assets/live/libertix-distribution-common.sh
          source assets/live/libertix-install-runtime-common.sh
          verify_file_sha256 /tmp/mint223/mint.iso "$MINT_SHA"
          mkdir -p /tmp/mint223/iso
          cleanup() {
            if findmnt -rn -M /tmp/mint223/iso >/dev/null 2>&1; then
              umount /tmp/mint223/iso
            fi
          }
          trap cleanup EXIT
          mount -t iso9660 -o ro,loop,nosuid,nodev,noexec /tmp/mint223/mint.iso /tmp/mint223/iso
          rootfs="$(resolve_distribution_rootfs_or_die /tmp/mint223/iso)"
          assert_distribution_rootfs_compatible_or_die "$rootfs" linuxmint
          if assert_distribution_rootfs_compatible_or_die "$rootfs" zorin; then
            echo "::error::Accepted Mint ISO payload as Zorin"
            exit 1
          fi
          printf '%s\n' \
            'PASS: genuine pinned Linux Mint 22.3 ISO accepted by production SquashFS capability guard' \
            'NOT TESTED: installation, Linux/Windows boot, updates, uninstall or rollback' \
            > /tmp/mint223/evidence/result.txt
          CHECK_REAL_MINT
          if findmnt -rn -M /tmp/mint223/iso >/dev/null 2>&1; then
            echo "::error::Read-only Mint ISO mount was not released"
            exit 1
          fi
      - name: Rehearse PR 167 legacy prewrite guard with hardened Mint capabilities
        shell: bash
        run: |
          set -Eeuo pipefail
          # Pin the upstream draft prewrite function; do not merge its code into this PR.
          zorin_head=1696e44ee87a67105750ca797d630cdfc6c61dd2
          git fetch --no-tags --depth=1 origin "$zorin_head"
          test "$(git rev-parse FETCH_HEAD)" = "$zorin_head"
          git show FETCH_HEAD:assets/live/libertix-distribution-common.sh \
            > /tmp/mint223/pr167-distribution-common.sh
          grep -q '^preflight_legacy_installer_iso_or_die() {' \
            /tmp/mint223/pr167-distribution-common.sh
          sudo env MINT_SHA="$MINT_SHA" bash -s <<'PREWRITE'
          set -Eeuo pipefail
          # First load the pinned prewrite gate from PR #167, then the stronger
          # capability validator from PR #169. Verify the actual two-PR runtime.
          source /tmp/mint223/pr167-distribution-common.sh
          source assets/live/libertix-distribution-common.sh
          source assets/live/libertix-install-runtime-common.sh
          cleanup() {
            if findmnt -rn -M /mnt/libertix-iso-preflight >/dev/null 2>&1; then
              umount /mnt/libertix-iso-preflight
            fi
          }
          trap cleanup EXIT
          if preflight_legacy_installer_iso_or_die /tmp/mint223/mint.iso "$MINT_SHA" zorin zorin; then
            echo "::error::Mint media was permitted for the wrong distribution"
            exit 1
          fi
          preflight_legacy_installer_iso_or_die /tmp/mint223/mint.iso "$MINT_SHA" mint linuxmint
          if findmnt -rn -M /mnt/libertix-iso-preflight >/dev/null 2>&1; then
            echo "::error::Prewrite guard leaked a mount"
            exit 1
          fi
          printf '%s\n' \
            'PASS: PR167 prewrite guard plus PR169 hardened capability validator on genuine Mint ISO' \
            >> /tmp/mint223/evidence/result.txt
          PREWRITE
      - name: Publish only small text evidence, never ISO or disk images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mint-223-actual-iso-readonly-proof
          path: /tmp/mint223/evidence/
          if-no-files-found: warn
          retention-days: 14
