name: CachyOS backend safety tests
on:
  push:
    branches:
      - feature/cachyos-target-backend
      - feature/cachyos-uefi-lab
      - feature/cachyos-efi-hardening
      - feature/cachyos-archiso-handoff
  pull_request:
    branches:
      - main
      - feature/cachyos-preflight
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cachyos:
    name: Read-only preflight and target verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Shell syntax check
        run: bash -n assets/live/cachyos-stage-target.sh
      - name: Python syntax check
        run: |
          python3 -m py_compile \
            assets/live/cachyos-target-verify.py \
            assets/live/cachyos-uefi-config.py \
            assets/live/cachyos-archiso-handoff.py \
            assets/live/cachyos-uefi-lab.py \
            assets/live/libertix-cachyos-preflight.py
      - name: CachyOS regression suite
        run: python3 -m unittest discover -s auto_tests -p 'test_cachyos_*.py' -v
      - name: Verify dry-run interface does not install
        shell: bash
        run: |
          set -Eeuo pipefail
          bash assets/live/cachyos-stage-target.sh --help | grep -F -- '--install'
          if bash assets/live/cachyos-stage-target.sh --install 2>/dev/null; then
            echo 'Installer accepted missing arguments' >&2
            exit 1
          fi

  ovmf:
    name: Actual OVMF / GRUB UEFI smoke (no Windows)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install UEFI smoke dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ovmf qemu-system-x86 grub-efi-amd64-bin mtools dosfstools
      - name: Boot GRUB executable inside OVMF software-emulated guest
        run: bash auto_tests/tools/cachyos_ovmf_smoke.sh

  archiso-loopback:
    name: Synthetic Archiso ISO loopback on real OVMF/GRUB
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install QEMU, GRUB, ISO/SquashFS tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ovmf qemu-system-x86 grub-efi-amd64-bin mtools dosfstools \
            xorriso squashfs-tools e2fsprogs
      - name: GRUB loopback-boot synthetic CachyOS ISO payload
        shell: bash
        run: bash auto_tests/tools/cachyos_archiso_loopback_smoke.sh

  archiso-ntfs-loopback:
    name: Synthetic Archiso ISO loopback from NTFS on OVMF/GRUB
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install QEMU, GRUB and NTFS/SquashFS tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ovmf qemu-system-x86 grub-efi-amd64-bin mtools dosfstools \
            xorriso squashfs-tools ntfs-3g
      - name: Test CachyOS ISO loopback on virtual NTFS disk
        shell: bash
        run: bash auto_tests/tools/cachyos_archiso_ntfs_loopback_smoke.sh
