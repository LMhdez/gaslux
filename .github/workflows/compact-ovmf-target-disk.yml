name: Compact Windows plus Mint target disk - real sparse QEMU allocation

on:
  pull_request:
    paths:
      - .github/workflows/compact-ovmf-target-disk.yml
      - auto_tests/tools/compact_ovmf_target.py
      - auto_tests/tests/test_compact_ovmf_target.py
      - docs/COMPACT_VM_INSTALL_LAB.md
  push:
    branches: [dev]
    paths:
      - .github/workflows/compact-ovmf-target-disk.yml
      - auto_tests/tools/compact_ovmf_target.py
      - auto_tests/tests/test_compact_ovmf_target.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compact-ovmf-target-${{ github.ref }}
  cancel-in-progress: true

jobs:
  allocate-verified-disposable-qcow2:
    if: github.repository == 'LMhdez/gaslux'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact code without saved token
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Adversarial budget and disk ownership unit tests
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s auto_tests/tests \
            -p test_compact_ovmf_target.py -v
      - name: Install real qcow2 creation and inspection binary
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-utils ovmf
          command -v qemu-img
      - name: Measure runner and create one private disposable 60-GiB qcow2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -B auto_tests/tools/compact_ovmf_target.py \
            --workspace "$RUNNER_TEMP" --create \
            --report evidence/compact-ovmf-target.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("evidence/compact-ovmf-target.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## Compact QEMU lab preparation\n\n")
              for key in ("status", "planned_peak_bytes", "measured_available_bytes",
                          "virtual_disk_bytes", "deficit_bytes", "lab_writer_admitted",
                          "windows_guest_booted", "mint_guest_installed"):
                  out.write(f"- {key}: {data[key]}\n")
              out.write("Actual QEMU disk image is not uploaded. No Windows/Mint install was run.\n")
          if data["lab_writer_admitted"] or data["mint_guest_installed"]:
              raise SystemExit("Unreviewed VM writer or installer assertion")
          if data.get("disk_created"):
              import subprocess
              disk = Path(data["disk_path"])
              if not disk.is_file() or disk.is_symlink():
                  raise SystemExit("Missing or unsafe disposable image")
              actual = json.loads(subprocess.check_output(
                  ["qemu-img", "info", "--output=json", str(disk)], text=True))
              if actual["format"] != "qcow2" or actual["virtual-size"] != 60 * 1024**3:
                  raise SystemExit("QCOW2 identity changed")
          PY
      - name: Measure QCOW2 fully allocated upper bound on same runner
        shell: bash
        run: |
          set -euo pipefail
          qemu-img measure --output=json -O qcow2 --size 60G > evidence/compact-qcow2-measure.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          import os
          target = json.loads(Path("evidence/compact-ovmf-target.json").read_text())
          measure = json.loads(Path("evidence/compact-qcow2-measure.json").read_text())
          bound = measure.get("fully-allocated")
          if type(bound) is not int or bound <= 60 * 1024**3:
              raise SystemExit("QEMU upper bound unavailable or invalid")
          extra = (4 + 8 + 8) * 1024**3
          report = {
              "schema": "gaslux-compact-physical-bound-v1",
              "source_sha": os.environ.get("GITHUB_SHA"),
              "runner_available_bytes": target["measured_available_bytes"],
              "qcow2_fully_allocated_bytes": bound,
              "other_planned_reserves_bytes": extra,
              "upper_bound_with_reserves_bytes": bound + extra,
              "deficit_bytes": max(0, bound + extra - target["measured_available_bytes"]),
              # A pinned Windows backing plus a growing COW overlay coexist.
              # Never misrepresent the one-image estimate as that phase's peak.
              "baseline_plus_overlay_unbounded_peak_bytes": 2 * bound + extra,
              "baseline_plus_overlay_unbounded_deficit_bytes": max(
                  0, 2 * bound + extra - target["measured_available_bytes"]
              ),
              "actual_frozen_windows_baseline_bytes": None,
              "overlay_growth_limit_verified": False,
              "quota_verified": False,
              "lab_writer_admitted": False,
              "windows_guest_booted": False,
          }
          Path("evidence/compact-physical-bound.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n")
          print(json.dumps(report, sort_keys=True))
          PY
      - name: Prove real private QCOW2 and OVMF restore and negative cases (NO GUEST)
        shell: bash
        run: |
          set -euo pipefail
          vars="$(find -L /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_VARS*.fd' -print -quit)"
          test -n "$vars"
          python3 -B auto_tests/tools/compact_ovmf_target.py \
            --workspace "$RUNNER_TEMP" --verify-restoration \
            --ovmf-vars "$vars" --report evidence/compact-ovmf-restore.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          obj = json.loads(Path("evidence/compact-ovmf-restore.json").read_text())
          for key in (
              "backing_chain_verified",
              "overlay_changed_without_baseline_mutation",
              "overlay_reset_restored_initial_bytes",
              "ovmf_vars_reset_verified",
              "corrupt_overlay_rejected",
              "foreign_backing_rejected",
              "symlink_swap_rejected",
              "interrupted_overlay_rejected",
              "insufficient_capacity_rejected",
          ):
              if obj.get(key) is not True:
                  raise SystemExit(f"Private restore fixture failed: {key}")
          if obj["quota_verified"] or obj["lab_writer_admitted"]:
              raise SystemExit("Fixture must not admit Windows/Mint guest writes")
          print("RESTORE_FIXTURE_VERIFIED: QCOW2 + OVMF only; no Windows recovery")
          PY
      - name: Erase only owned, private temporary guest image
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          report = Path("evidence/compact-ovmf-target.json")
          if report.is_file():
              data = json.loads(report.read_text())
              name = data.get("exclusive_lab_directory")
              if name:
                  parent = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
                  candidate = Path(name)
                  if (candidate.parent == parent and
                      candidate.name.startswith("gaslux-compact-ovmf-") and
                      not candidate.is_symlink() and candidate.is_dir()):
                      shutil.rmtree(candidate)
                  else:
                      raise SystemExit("Refuse to delete an unrelated directory")
          PY
      - name: Publish small capacity and qcow2 metadata report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compact-ovmf-target-evidence
          path: |
            evidence/compact-ovmf-target.json
            evidence/compact-qcow2-measure.json
            evidence/compact-physical-bound.json
            evidence/compact-ovmf-restore.json
          if-no-files-found: warn
          retention-days: 14
