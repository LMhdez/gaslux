name: Compact Windows plus Mint target disk - real sparse QEMU allocation

on:
  pull_request:
    paths:
      - .github/workflows/compact-ovmf-target-disk.yml
      - auto_tests/tools/compact_ovmf_target.py
      - auto_tests/tests/test_compact_ovmf_target.py
      - auto_tests/tools/compact_qcow2_quota_lab.py
      - auto_tests/tests/test_compact_qcow2_quota_lab.py
      - auto_tests/tools/compact_fullscale_quota_lab.py
      - auto_tests/tests/test_compact_fullscale_quota_lab.py
      - auto_tests/tools/windows_media_intake.py
      - auto_tests/tests/test_windows_media_intake.py
      - docs/COMPACT_VM_INSTALL_LAB.md
  push:
    branches: [dev]
    paths:
      - .github/workflows/compact-ovmf-target-disk.yml
      - auto_tests/tools/compact_ovmf_target.py
      - auto_tests/tests/test_compact_ovmf_target.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compact-ovmf-target-${{ github.ref }}
  cancel-in-progress: true

jobs:
  allocate-verified-disposable-qcow2:
    if: github.repository == 'LMhdez/gaslux'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact code without saved token
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Adversarial budget and disk ownership unit tests
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s auto_tests/tests \
            -p test_compact_ovmf_target.py -v
      - name: Install real qcow2 creation and inspection binary
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-utils
          command -v qemu-img
      - name: Measure runner and create one private disposable 60-GiB qcow2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -B auto_tests/tools/compact_ovmf_target.py \
            --workspace "$RUNNER_TEMP" --create \
            --report evidence/compact-ovmf-target.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("evidence/compact-ovmf-target.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## Compact QEMU lab preparation\n\n")
              for key in ("status", "planned_peak_bytes", "measured_available_bytes",
                          "virtual_disk_bytes", "deficit_bytes", "lab_writer_admitted",
                          "windows_guest_booted", "mint_guest_installed"):
                  out.write(f"- {key}: {data[key]}\n")
              out.write("Actual QEMU disk image is not uploaded. No Windows/Mint install was run.\n")
          if data["lab_writer_admitted"] or data["mint_guest_installed"]:
              raise SystemExit("Unreviewed VM writer or installer assertion")
          if data.get("disk_created"):
              import subprocess
              disk = Path(data["disk_path"])
              if not disk.is_file() or disk.is_symlink():
                  raise SystemExit("Missing or unsafe disposable image")
              actual = json.loads(subprocess.check_output(
                  ["qemu-img", "info", "--output=json", str(disk)], text=True))
              if actual["format"] != "qcow2" or actual["virtual-size"] != 60 * 1024**3:
                  raise SystemExit("QCOW2 identity changed")
          PY
      - name: Offline adversarial tests for hard bounded ext4/QCOW2 lab quota
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s auto_tests/tests \
            -p test_compact_qcow2_quota_lab.py -v
      - name: Real QEMU ENOSPC in owned loopback ext4, restore immutable baseline
        shell: bash
        run: |
          set -euo pipefail
          command -v mkfs.ext4
          command -v qemu-io
          python3 -B auto_tests/tools/compact_qcow2_quota_lab.py \
            --workspace "$RUNNER_TEMP" \
            --report evidence/compact-qcow2-quota-fixture.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("evidence/compact-qcow2-quota-fixture.json").read_text())
          for field in ("loop_source_exact_verified", "ext4_capacity_bound_tested",
                        "qemu_io_enospc_observed", "baseline_unchanged_after_enospc",
                        "overlay_recreated_and_canary_restored"):
              assert data[field] is True, field
          for field in ("real_60gib_quota_verified", "lab_writer_admitted",
                        "windows_guest_booted", "mint_guest_installed",
                        "dual_boot_verified", "windows_recovery_verified"):
              assert data[field] is False, field
          assert data["disk_writes_to_host_devices"] == 0
          print("QUOTA_FIXTURE_VERIFIED: only 384-MiB private image, not guest admission")
          PY
      - name: Unit tests for full-size preallocated quota and independent host reserve
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s auto_tests/tests -p test_compact_fullscale_quota_lab.py -v
      - name: Attempt real 60-GiB physically reserved quota (no guest)
        shell: bash
        run: |
          set -euo pipefail
          python3 -B auto_tests/tools/compact_fullscale_quota_lab.py \
            --workspace "$RUNNER_TEMP" --preflight-only \
            --report evidence/compact-fullscale-readiness.json || status=$?
          if [[ "${status:-0}" == 2 ]]; then
            echo '::warning::60-GiB physical quota blocked by independent host storage reserve'
            exit 0
          fi
          test "${status:-0}" = 0
          timeout --kill-after=20s 480s python3 -B auto_tests/tools/compact_fullscale_quota_lab.py \
            --workspace "$RUNNER_TEMP" --report evidence/compact-fullscale-quota.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          obj = json.loads(Path('evidence/compact-fullscale-quota.json').read_text())
          assert obj['status'] == 'PRIVATE_60GIB_QUOTA_AND_QCOW2_VERIFIED'
          for field in ('exact_private_loop_mount_verified',
                        'same_size_60gib_backing_overlay_chain_verified',
                        'qemu_io_actual_overlay_write_verified',
                        'baseline_integrity_and_reset_verified'):
              assert obj[field] is True, field
          assert obj['private_quota_exact_file_bytes'] == 60 * 1024**3
          assert obj['physical_preallocation_proven_bytes'] >= 60 * 1024**3 * 99 // 100
          for denied in ('real_windows_media_verified', 'windows_guest_booted',
                         'mint_guest_installed', 'dual_boot_verified',
                         'guest_writer_admitted', 'windows_recovery_verified'):
              assert obj[denied] is False, denied
          print('FULLSIZE_QUOTA_FILE_VERIFIED: 60-GiB physical reservation, no guest')
          PY

      - name: Windows 10 media intake adversarial checks (official SHA pins)
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s auto_tests/tests -p test_windows_media_intake.py -v
          python3 -B auto_tests/tools/windows_media_intake.py \
            --product windows10-22h2-pt-pt-x64 \
            --report evidence/windows10-media-intake.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('evidence/windows10-media-intake.json').read_text())
          assert r['status'] == 'BLOCKED_MEDIA'
          assert r['file_verified'] is False
          assert r['guest_writer_admitted'] is False
          print('BLOCKED_MEDIA: official Windows 10 SHA pinned; ISO not supplied')
          PY

      - name: Erase only owned, private temporary guest image
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          report = Path("evidence/compact-ovmf-target.json")
          if report.is_file():
              data = json.loads(report.read_text())
              name = data.get("exclusive_lab_directory")
              if name:
                  parent = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
                  candidate = Path(name)
                  if (candidate.parent == parent and
                      candidate.name.startswith("gaslux-compact-ovmf-") and
                      not candidate.is_symlink() and candidate.is_dir()):
                      shutil.rmtree(candidate)
                  else:
                      raise SystemExit("Refuse to delete an unrelated directory")
          PY
      - name: Publish small capacity and qcow2 metadata report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compact-ovmf-target-evidence
          path: |
            evidence/compact-ovmf-target.json
            evidence/compact-qcow2-quota-fixture.json
            evidence/compact-fullscale-readiness.json
            evidence/compact-fullscale-quota.json
            evidence/windows10-media-intake.json
          if-no-files-found: warn
          retention-days: 14
