name: Observer rebased full-file contracts (no guest input)
on:
  push:
    branches:
      - integration/observer-268-rebased-dev-20261120
  pull_request:
    paths:
      - 'auto_tests/installer_observer/**'
      - 'auto_tests/tests/test_observer_*.py'
      - 'docs/distro-backends/SHARED_CONTRACTS.md'
      - '.github/workflows/observer-268-rebased-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observer-full-file-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: python -m pip install 'pytest>=8,<10' 'pillow>=11,<13' 'ruff>=0.8,<1' 'jsonschema>=4,<5'
      - name: Compile every incorporated Observer module
        run: python -m compileall -q auto_tests/installer_observer auto_tests/tests/test_observer_controller_lease.py auto_tests/tests/test_observer_lab_identity.py
      - name: Normalize imported sources for explicit review (temporary)
        run: |
          python -m ruff check --fix --config auto_tests/pyproject.toml auto_tests/installer_observer auto_tests/tests/test_observer_controller_lease.py auto_tests/tests/test_observer_lab_identity.py || true
          python -m ruff format --config auto_tests/pyproject.toml auto_tests/installer_observer auto_tests/tests/test_observer_controller_lease.py auto_tests/tests/test_observer_lab_identity.py
          python - <<'PY'
          import base64
          from pathlib import Path
          import subprocess
          for path in subprocess.check_output(['git','diff','--name-only'], text=True).splitlines():
              print('FORMATTED_SOURCE|'+path+'|'+base64.b64encode(Path(path).read_bytes()).decode())
          PY
      - name: Ruff lint ALL incorporated Observer modules and tests
        run: python -m ruff check --config auto_tests/pyproject.toml auto_tests/installer_observer auto_tests/tests/test_observer_controller_lease.py auto_tests/tests/test_observer_lab_identity.py
      - name: Ruff formatting ALL incorporated Observer modules and tests
        run: python -m ruff format --check --diff --config auto_tests/pyproject.toml auto_tests/installer_observer auto_tests/tests/test_observer_controller_lease.py auto_tests/tests/test_observer_lab_identity.py
      - name: Adversarial controller and QEMU identity contracts
        run: python -m pytest -q auto_tests/tests/test_observer_controller_lease.py auto_tests/tests/test_observer_lab_identity.py
      - name: Q4OS native preflight and related read-only contract regression
        run: python -m pytest -q auto_tests/tests/test_q4os_native_preflight.py
      - name: JSON Schema validity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          for path in sorted(Path("schemas").glob("*.schema.json")):
              Draft202012Validator.check_schema(json.loads(path.read_text(encoding="utf-8")))
          PY
      - name: Check importability of all integrated modules
        run: |
          python - <<'PY'
          import importlib
          for name in ("evidence", "screenshot", "locators", "models", "state_machine", "lab_identity", "controller_lease"):
              importlib.import_module("auto_tests.installer_observer." + name)
          PY
      - name: Fail closed if any production writer or release surface changed
        env:
          INTEGRATION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          base = "6101bfebf88b43d3c1bad1e4ec19ea4a0f0761b8"
          head = os.environ["INTEGRATION_HEAD"]
          changed = subprocess.check_output(["git", "diff", "--name-only", base, head], text=True).splitlines()
          print("Integration-only paths:", changed)
          forbidden = ("release-config.json", "Installation/", "Scripts/", "assets/live/", "Pages/", "release-config/")
          if any(p == forbidden[0] or any(p.startswith(prefix) for prefix in forbidden[1:]) for p in changed):
              raise SystemExit("Unreviewed production writer or release changes")
          lease = Path("auto_tests/installer_observer/controller_lease.py").read_text()
          for marker in ("LOCK_EX | fcntl.LOCK_NB", "os.O_NOFOLLOW", "process_seal(self.expected.pid)", "raise Refusal"):
              if marker not in lease:
                  raise SystemExit("ControllerLease gate missing: " + marker)
          print("Experimental observer only: no release or disk writer modifications")
          PY
