name: QEMU hardware acceleration availability (disposable VM probe)

on:
  push:
    branches:
      - feature/cachyos-gh-actions-real-pacstrap-firstboot
    paths:
      - .github/workflows/cachyos-qemu-kvm-capability.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Inspect hosted x64 runner virtualization capabilities
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'Read-only inspection; no partition writes or guest launch.'
          uname -m
          if [[ -c /dev/kvm ]]; then
            stat -c 'KVM_CHARACTER_DEVICE=%F; permissions=%a; group=%G' /dev/kvm
            if sudo test -r /dev/kvm && sudo test -w /dev/kvm; then
              echo 'GASLUX_HOSTED_KVM_ACCESSIBLE=true'
              echo 'GASLUX_HOSTED_KVM_ACCESSIBLE=true' >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'GASLUX_HOSTED_KVM_ACCESSIBLE=false (permissions)'
              echo 'GASLUX_HOSTED_KVM_ACCESSIBLE=false' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo 'GASLUX_HOSTED_KVM_ACCESSIBLE=false (missing /dev/kvm)'
            echo 'GASLUX_HOSTED_KVM_ACCESSIBLE=false' >> "$GITHUB_STEP_SUMMARY"
          fi
          if grep -Eq '(vmx|svm)' /proc/cpuinfo; then
            echo 'GASLUX_NESTED_CPU_VIRTUALIZATION_FEATURE=true'
          else
            echo 'GASLUX_NESTED_CPU_VIRTUALIZATION_FEATURE=false'
          fi
          echo 'No claim of actual guest KVM boot or Linux installation.'
      - name: Verify QEMU can actually initialize KVM acceleration
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo 'GASLUX_QEMU_KVM_BOOTSTRAP=false: unavailable device'
            exit 0
          fi
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86 acl
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          # Never use -S: the prior paused probe incorrectly claimed KVM
          # supported even though actual vCPU execution failed with EPERM.
          # This launches a diskless machine without any block, host device,
          # network or guest image; CPU must run for the timeout duration.
          set +e
          timeout --kill-after=2s 5s qemu-system-x86_64 \
            -machine q35,accel=kvm,smm=on -cpu host -smp 2 -m 256 \
            -nodefaults -display none -monitor none -serial none \
            > "$RUNNER_TEMP/kvm-only-probe.log" 2>&1
          rc=$?
          set -e
          if [[ "$rc" == 124 ]] &&
             ! grep -Eiq 'permission denied|failed to initialize kvm|could not access kvm' "$RUNNER_TEMP/kvm-only-probe.log"; then
            echo 'GASLUX_QEMU_KVM_VCPU_EXECUTES=true'
            echo 'GASLUX_QEMU_KVM_VCPU_EXECUTES=true' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "GASLUX_QEMU_KVM_VCPU_EXECUTES=false (QEMU=$rc)"
            echo 'GASLUX_QEMU_KVM_VCPU_EXECUTES=false' >> "$GITHUB_STEP_SUMMARY"
            tail -c 2000 "$RUNNER_TEMP/kvm-only-probe.log"
          fi
      - name: Probe exact OVMF Secure Boot firmware as runner and root (diskless)
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86 ovmf acl
          code=/usr/share/OVMF/OVMF_CODE_4M.secboot.fd
          vars=/usr/share/OVMF/OVMF_VARS_4M.fd
          [[ -f "$code" && -f "$vars" ]] || exit 2
          if [[ ! -c /dev/kvm ]]; then
            echo 'GASLUX_OVMF_KVM_RUNNER=false (no KVM device)'
            echo 'GASLUX_OVMF_KVM_ROOT=false (no KVM device)'
            exit 0
          fi
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          for mode in runner root; do
            cp "$vars" "$RUNNER_TEMP/nvram-$mode.fd"
            args=(
              qemu-system-x86_64
              -machine q35,accel=kvm,smm=on -cpu host
              -global driver=cfi.pflash01,property=secure,value=on
              -smp 2 -m 6144 -nodefaults -display none -monitor none -serial none -no-reboot
              -drive "if=pflash,format=raw,readonly=on,file=$code"
              -drive "if=pflash,format=raw,file=$RUNNER_TEMP/nvram-$mode.fd"
            )
            set +e
            if [[ "$mode" == root ]]; then
              sudo timeout --kill-after=2s 5s ${args[@]} > "$RUNNER_TEMP/ovmf-$mode.log" 2>&1
            else
              timeout --kill-after=2s 5s ${args[@]} > "$RUNNER_TEMP/ovmf-$mode.log" 2>&1
            fi
            rc=$?
            set -e
            result=false
            if (( rc == 124 )) &&
               ! grep -Eiq 'permission denied|failed to initialize kvm|could not access kvm' "$RUNNER_TEMP/ovmf-$mode.log"; then
              result=true
            fi
            mode_upper="$(printf %s "$mode" | tr '[:lower:]' '[:upper:]')"
            echo "GASLUX_OVMF_KVM_$mode_upper=$result (status $rc)"
            echo "GASLUX_OVMF_KVM_$mode_upper=$result" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$result" == false ]]; then
              tail -c 1000 "$RUNNER_TEMP/ovmf-$mode.log" || true
            fi
          done
          echo 'Diskless VM probing only. This does not prove pacstrap or installed Linux.'
      - name: Probe KVM with the full disk image topology (never host disks)
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86 ovmf acl
          work="$(mktemp -d -p "$RUNNER_TEMP" gaslux-kvm-exact-XXXXXXXX)"
          trap 'rm -rf -- "$work"' EXIT
          code=/usr/share/OVMF/OVMF_CODE_4M.secboot.fd
          vars=/usr/share/OVMF/OVMF_VARS_4M.fd
          [[ -f "$code" && -f "$vars" ]] || exit 2
          # Only new sparse image files. No /dev/sdX, NVMe, block-device
          # passthrough, Windows volume, actual ESP, NVRAM or partition write.
          truncate -s 96M "$work/liveboot.raw"
          truncate -s 64M "$work/iso.raw"
          truncate -s 64M "$work/root.raw"
          truncate -s 64M "$work/esp.raw"
          truncate -s 64M "$work/control.raw"
          if [[ ! -c /dev/kvm ]]; then
            echo 'GASLUX_FULL_TOPOLOGY_KVM=false: missing /dev/kvm'
            exit 0
          fi
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          for mode in runner root; do
            cp "$vars" "$work/nvram-$mode.fd"
            args=(
              qemu-system-x86_64
              -machine q35,accel=kvm,smm=on -cpu host
              -global driver=cfi.pflash01,property=secure,value=on
              -smp 2 -m 6144 -display none -monitor none -no-reboot -boot order=c
              -drive "if=pflash,format=raw,readonly=on,file=$code"
              -drive "if=pflash,format=raw,file=$work/nvram-$mode.fd"
              -device qemu-xhci
              -drive "if=none,id=liveefi,format=raw,file=$work/liveboot.raw,readonly=on"
              -device usb-storage,drive=liveefi
              -drive "if=none,id=source,format=raw,file=$work/iso.raw,readonly=on"
              -device virtio-blk-pci,drive=source
              -drive "if=none,id=target,format=raw,file=$work/root.raw"
              -device virtio-blk-pci,drive=target
              -drive "if=none,id=esp,format=raw,file=$work/esp.raw"
              -device virtio-blk-pci,drive=esp
              -drive "if=none,id=control,format=raw,file=$work/control.raw,readonly=on"
              -device virtio-blk-pci,drive=control
              -netdev user,id=n0 -device virtio-net-pci,netdev=n0
              -serial "file:$work/serial-$mode.log"
            )
            set +e
            if [[ "$mode" == root ]]; then
              sudo timeout --kill-after=2s 5s "${args[@]}" > "$work/qemu-$mode.stderr" 2>&1
            else
              timeout --kill-after=2s 5s "${args[@]}" > "$work/qemu-$mode.stderr" 2>&1
            fi
            rc=$?
            set -e
            ok=false
            if (( rc == 124 )) &&
               ! grep -Eiq 'permission denied|failed to initialize kvm|could not access kvm' "$work/qemu-$mode.stderr"; then
              ok=true
            fi
            upper="$(printf %s "$mode" | tr '[:lower:]' '[:upper:]')"
            echo "GASLUX_FULL_TOPOLOGY_KVM_$upper=$ok (status $rc)"
            echo "GASLUX_FULL_TOPOLOGY_KVM_$upper=$ok" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$ok" == false ]]; then
              tail -c 1200 "$work/qemu-$mode.stderr" || true
            fi
          done
          echo 'No Linux, Windows, pacstrap or installed root was booted in this probe.'
