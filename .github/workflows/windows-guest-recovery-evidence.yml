name: Windows 10/11 VM recovery evidence tests
on:
  push:
    branches:
      - feature/windows-guest-recovery-proof
      - feature/windows-x64-uefi-dvd-visual-diagnostics
    paths:
      - .github/workflows/windows-guest-recovery-evidence.yml
      - auto_tests/tools/verify_windows_guest_recovery.py
      - auto_tests/test_windows_guest_recovery_proof.py
      - auto_tests/app/scripts/windows-guest-recovery-evidence.ps1
      - PowerShell.Tests/WindowsGuestRecoveryEvidence.Tests.ps1
  pull_request:
    branches:
      - feature/cachyos-real-iso-contract
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Ruff
        run: python3 -m pip install --break-system-packages ruff==0.13.3
      - name: Compile the offline Windows recovery evidence verifier
        run: python3 -m py_compile auto_tests/tools/verify_windows_guest_recovery.py auto_tests/test_windows_guest_recovery_proof.py
      - name: Ruff checks
        run: |
          python3 -m ruff check --config auto_tests/pyproject.toml auto_tests/tools/verify_windows_guest_recovery.py auto_tests/test_windows_guest_recovery_proof.py
          python3 -m ruff format --check --config auto_tests/pyproject.toml auto_tests/tools/verify_windows_guest_recovery.py auto_tests/test_windows_guest_recovery_proof.py
      - name: Offline evidence-negative tests (synthetic fixtures only)
        run: python3 -m unittest auto_tests.test_windows_guest_recovery_proof -v

  evidence-powershell:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Pester 5
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -ErrorAction Stop
      - name: Parse collector and test read-only helpers; do not probe CI machine
        shell: pwsh
        run: |
          $scriptPath = 'auto_tests/app/scripts/windows-guest-recovery-evidence.ps1'
          $tokens = $null
          $issues = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $scriptPath), [ref]$tokens, [ref]$issues
          ) | Out-Null
          if ($issues.Count -gt 0) { throw ($issues | Out-String) }
          $result = Invoke-Pester -Path 'PowerShell.Tests/WindowsGuestRecoveryEvidence.Tests.ps1' -PassThru
          if ($result.FailedCount -ne 0) { exit 1 }
