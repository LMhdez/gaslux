                  'third Windows serial not archived')
          require(hashlib.sha256(serial.read_bytes()).hexdigest()==
                  proof['thirdBootGuestSerialSha256'],'third Windows COM1 hash mismatch')
          print('PASS: independently booted genuine Windows 10 on COW fifth GPT')
          print('NO installed CachyOS, Linux firstboot or rollback has been proved')
