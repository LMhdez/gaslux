name: GASLUX main bootstrap evidence audit
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Bounded bootstrap PR number
        required: true
        type: choice
        options: ['436','437','438']
permissions: {}
concurrency:
  group: gaslux-main-bootstrap-audit-v1
  cancel-in-progress: false
jobs:
  evidence_only:
    if: github.repository == 'LMhdez/gaslux' && github.ref == 'refs/heads/infra/main-bootstrap-verifier-v1' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 -B -m unittest discover -s .github/main-bootstrap -p 'test_*.py' -v
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          PAUSE: ${{ vars.GASLUX_AUTONOMY_PAUSED }}
          PROD_MERGE: ${{ vars.GASLUX_PRODUCTION_MERGE_ENABLED }}
          LEGACY: ${{ vars.GASLUX_APP_STATUS_GATES_ENABLED }}
          V3: ${{ vars.GASLUX_V3_AUTHORITY_ENABLED }}
          V4: ${{ vars.GASLUX_V4_MERGE_ENABLED }}
        run: python3 -I .github/main-bootstrap/main_bootstrap.py
