name: Zorin Ubiquity PRECOMMIT route-B DENY-only
on:
  push:
    branches:
      - test/zorin-ubiquity-precommit-deny-20261122

permissions:
  contents: read

jobs:
  precommit-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout read-only precommit experiment
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Checkout canonical Safety GPT FD reader without modification
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: LMhdez/gaslux
          ref: d5eb20114df34a778ada1af1f6f4f6bff0c49845
          path: canonical-safety
          persist-credentials: false
          sparse-checkout: |
            assets/live/libertix_disk_identity_gate.py
            auto_tests/tests/test_disk_identity_gate.py
          sparse-checkout-cone-mode: false
      - name: Python compile, Ruff lint and format, schema check
        shell: bash
        env:
          PYTHONPATH: canonical-safety/assets/live:auto_tests/tools
        run: |
          set -Eeuo pipefail
          test "$(git -C canonical-safety rev-parse HEAD)" = d5eb20114df34a778ada1af1f6f4f6bff0c49845
          python3 -m pip install --break-system-packages --no-input 'jsonschema>=4.20,<5' 'ruff>=0.10,<0.18' 'pytest>=8,<9'
          python3 -m compileall -q auto_tests/tools/zorin_ubiquity_precommit_boundary.py auto_tests/test_zorin_ubiquity_precommit_boundary.py
          ruff check --select E4,E7,E9,F auto_tests/tools/zorin_ubiquity_precommit_boundary.py auto_tests/test_zorin_ubiquity_precommit_boundary.py
          ruff format --check auto_tests/tools/zorin_ubiquity_precommit_boundary.py auto_tests/test_zorin_ubiquity_precommit_boundary.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          for name in ("schemas/installation-plan.schema.json",
                       "schemas/zorin-ubiquity-handoff-readonly.schema.json",
                       "schemas/zorin-native-ubiquity-capabilities.schema.json"):
              schema = json.loads(Path(name).read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
          print("PASS: reused schemas valid")
          PY
      - name: Adversarial precommit and relevant original contracts
        shell: bash
        env:
          PYTHONPATH: canonical-safety/assets/live:auto_tests/tools
        run: |
          set -Eeuo pipefail
          for suite in \
              test_zorin_ubiquity_precommit_boundary.py \
              test_zorin_ubiquity_handoff_readonly.py \
              test_zorin_native_ubiquity_map.py \
              test_zorin_fd_toctou_repro.py \
              test_zorin_synthetic_writeset.py \
              test_windows_zorin_cow_boot_evidence.py \
              test_windows_mint_cow_boot_evidence.py; do
            python3 -m unittest discover -s auto_tests -p "$suite" -v
          done
          python3 -m pytest -q canonical-safety/auto_tests/tests/test_disk_identity_gate.py
          echo 'ROUTE_B UBIQUITY_PRECOMMIT_PLAN_UNAVAILABLE: no installer, real Windows boot, native update, disk/firmware writer, or rollback test.' >> "$GITHUB_STEP_SUMMARY"
