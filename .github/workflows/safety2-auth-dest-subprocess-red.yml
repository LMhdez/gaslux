name: Safety-2 independent 346 subprocess RED (no writer)
on:
  push:
    branches:
      - safety2/auth-dest-128g-subprocess-red-20261122
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-subprocess-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GASLUX_QEMU_NO_GUEST: '1'
    steps:
      - name: Checkout test-only audit branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact audited source matches PR 346 HEAD
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          base=9306d0fff8cc89794b83fe002ae133c110e641ae
          git merge-base --is-ancestor "$base" HEAD
          for path in auto_tests/installer_observer/large_sparse_destination.py auto_tests/installer_observer/authenticated_destination.py; do
            test "$(git hash-object "$path")" = "$(git rev-parse "$base:$path")"
          done
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install limited test runner only
        run: python -m pip install --disable-pip-version-check 'pytest==9.0.2'
      - name: Compile independent test without modifying producer
        run: python -m compileall -q auto_tests/tests/test_safety2_auth_dest_subprocess_independent.py
      - name: Checkout exact safety 267 and GPT FD 286 dependencies
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: LMhdez/gaslux
          ref: 0be04192acd542646a5b6cd952e01620379edf5d
          path: safety267-pinned
          persist-credentials: false
      - name: Checkout exact GPT FD 286 parser fixture
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: LMhdez/gaslux
          ref: 9aed36cfdb8c09a461dc38811c326c54180273de
          path: gpt286-pinned
          persist-credentials: false
      - name: Install original QEMU paused and GPT tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils gdisk
          test -x /usr/bin/qemu-system-x86_64
          test -x /usr/bin/qemu-img
      - name: Replay unchanged inherited 337 and original 346 QEMU adversarial tests
        env:
          GASLUX_QEMU_PIN267_ROOT: ${{ github.workspace }}/safety267-pinned
          GASLUX_QEMU_PIN286_ROOT: ${{ github.workspace }}/gpt286-pinned
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C safety267-pinned rev-parse HEAD)" = 0be04192acd542646a5b6cd952e01620379edf5d
          test "$(git -C gpt286-pinned rev-parse HEAD)" = 9aed36cfdb8c09a461dc38811c326c54180273de
          python -m pytest -q auto_tests/tests/test_authenticated_destination_readonly.py auto_tests/tests/test_auth_dest_128g_readonly.py
      - name: GREEN negative cases using actual subprocess pipes
        run: python -m pytest -q auto_tests/tests/test_safety2_auth_dest_subprocess_independent.py -k 'not test_red'
      - name: RED confirm orphan cleanup failure reproducibly
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          python -m pytest -q -s auto_tests/tests/test_safety2_auth_dest_subprocess_independent.py -k test_red 2>&1 | tee "$RUNNER_TEMP/safety2-red.log"
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 1
          grep -q 'SAFETY2-346-01 RED: descendant is still alive' "$RUNNER_TEMP/safety2-red.log"
          printf '%s\n' 'Expected RED independently reproduced at immutable PR #346 source HEAD; NOT a successful cleanup.' >> "$GITHUB_STEP_SUMMARY"
