name: Safety-2 independent 346 subprocess RED (no writer)
on:
  push:
    branches:
      - safety2/auth-dest-128g-subprocess-red-20261122
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-subprocess-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout test-only audit branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact audited source matches PR 346 HEAD
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          base=9306d0fff8cc89794b83fe002ae133c110e641ae
          git merge-base --is-ancestor "$base" HEAD
          for path in auto_tests/installer_observer/large_sparse_destination.py auto_tests/installer_observer/authenticated_destination.py; do
            test "$(git hash-object "$path")" = "$(git rev-parse "$base:$path")"
          done
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install limited test runner only
        run: python -m pip install --disable-pip-version-check 'pytest==9.0.2'
      - name: Compile independent test without modifying producer
        run: python -m compileall -q auto_tests/tests/test_safety2_auth_dest_subprocess_independent.py
      - name: GREEN negative cases using actual subprocess pipes
        run: python -m pytest -q auto_tests/tests/test_safety2_auth_dest_subprocess_independent.py -k 'not test_red'
      - name: RED confirm orphan cleanup failure reproducibly
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          python -m pytest -q -s auto_tests/tests/test_safety2_auth_dest_subprocess_independent.py -k test_red 2>&1 | tee "$RUNNER_TEMP/safety2-red.log"
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 1
          grep -q 'SAFETY2-346-01 RED: descendant is still alive' "$RUNNER_TEMP/safety2-red.log"
          printf '%s\n' 'Expected RED independently reproduced at immutable PR #346 source HEAD; NOT a successful cleanup.' >> "$GITHUB_STEP_SUMMARY"
