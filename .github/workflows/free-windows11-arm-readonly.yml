name: Free Windows 11 ARM client read-only compatibility probe

on:
  push:
    branches:
      - feature/free-windows11-arm-readonly-smoke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows11-arm-storage-api-readonly:
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Classify actual Windows guest and inspect storage API (read-only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $os = Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ([int]$os.ProductType -ne 1 -or [int]$os.BuildNumber -lt 22000 -or
              $arch -ne 'Arm64') {
              throw 'This runner is not a Windows 11 ARM64 client; no compatibility claim is permitted.'
          }

          # Do not mount, assign, format, resize, unlock or modify any volume.
          $disks = @(Get-Disk -ErrorAction Stop)
          if ($disks.Count -lt 1) { throw 'Get-Disk returned no observable disks.' }
          $parts = @()
          $partitionApiAvailable = $true
          foreach ($disk in $disks) {
              try {
                  $parts += @(Get-Partition -DiskNumber $disk.Number -ErrorAction Stop)
              } catch {
                  # The hosted ARM image may expose an OS disk through a
                  # provider that does not publish MSFT_Partition objects.
                  # Report that limitation, never substitute fake topology.
                  $partitionApiAvailable = $false
                  $parts = @()
                  break
              }
          }
          $efi = @($parts | Where-Object {
              ([string]$_.GptType) -eq '{c12a7328-f81f-11d2-ba4b-00a0c93ec93b}'
          })

          # These commands are observational. Missing recovery/BCD access
          # is reported as unavailable; it is never treated as verified.
          $winReAccessible = $false
          $reagentc = Join-Path $env:SystemRoot 'System32/reagentc.exe'
          if (Test-Path -LiteralPath $reagentc -PathType Leaf) {
              $null = & $reagentc /info 2>&1
              $winReAccessible = $LASTEXITCODE -eq 0
          }
          $bcdAccessible = $false
          $bcdedit = Join-Path $env:SystemRoot 'System32/bcdedit.exe'
          if (Test-Path -LiteralPath $bcdedit -PathType Leaf) {
              $null = & $bcdedit /enum '{current}' 2>&1
              $bcdAccessible = $LASTEXITCODE -eq 0
          }

          # No disk identifiers, BCD entries, machine IDs or recovery
          # paths are uploaded from an infrastructure-owned runner.
          $report = [ordered]@{
              schemaVersion = 1
              source = 'github-hosted-windows11-arm-readonly'
              windowsClient11ArmObserved = $true
              windowsClientX64Observed = $false
              windows10Observed = $false
              osBuild = [int]$os.BuildNumber
              architecture = $arch
              diskCount = $disks.Count
              partitionCount = $parts.Count
              efiPartitionCount = $efi.Count
              partitionApiEnumerated = [bool]$partitionApiAvailable
              fullDiskGeometryVerified = $false
              reagentcReadAccessible = [bool]$winReAccessible
              bcdReadAccessible = [bool]$bcdAccessible
              actualGasluxInstallExecuted = $false
              linuxBootVerified = $false
              windowsDualBootVerified = $false
              windowsRecoveryRollbackVerified = $false
              productionStable = $false
          }
          $report | ConvertTo-Json -Depth 3 | Out-File -LiteralPath 'windows11-arm-readonly.json' -Encoding utf8NoBOM
          Write-Output 'Windows 11 ARM64 client: verified. Windows x64 dual boot: NOT TESTED.'
          Write-Output ('Disk count: ' + $disks.Count + ', partition API available: ' + $partitionApiAvailable)
          Write-Output ('WinRE/BCD command accessibility: ' + $winReAccessible + '/' + $bcdAccessible)
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value (
              'Windows 11 **ARM64 client** and Get-Disk observed; partition API may be unavailable. ' +
              'Not Windows 10/11 x64, not Gaslux-installed, no Linux boot or rollback tested.'
          )
      - name: Install Pester for compatibility regression tests
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -ErrorAction Stop
      - name: Parse Windows evidence collector and run safe helper tests
        shell: pwsh
        run: |
          $source = 'auto_tests/app/scripts/windows-guest-recovery-evidence.ps1'
          $tokens = $null
          $errorsFound = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $source), [ref]$tokens, [ref]$errorsFound
          ) | Out-Null
          if ($errorsFound.Count -gt 0) { throw ($errorsFound | Out-String) }
          $result = Invoke-Pester -Path 'PowerShell.Tests/WindowsGuestRecoveryEvidence.Tests.ps1' -PassThru
          if ($result.FailedCount -ne 0) { exit 1 }
      - name: Publish redacted Windows 11 ARM compatibility report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows11-arm-readonly-compatibility
          path: windows11-arm-readonly.json
          if-no-files-found: warn
          retention-days: 14
