name: Bazzite ISO45 guest inspection contract - offline refusal only

on:
  push:
    branches:
      - test/bazzite-iso45-guest-inspection-contract-20261121
    paths:
      - '.github/workflows/bazzite-iso45-guest-inspection-contract.yml'
      - 'auto_tests/bazzite_iso45_guest_inspection_contract.py'
      - 'auto_tests/tests/test_bazzite_iso45_guest_inspection_contract.py'
      - 'schemas/bazzite_iso45_guest_inspection_contract_v1.schema.json'
      - 'docs/BAZZITE_ISO45_READONLY_INSPECTION_CONTRACT.md'
  pull_request:
    paths:
      - '.github/workflows/bazzite-iso45-guest-inspection-contract.yml'
      - 'auto_tests/bazzite_iso45_guest_inspection_contract.py'
      - 'auto_tests/tests/test_bazzite_iso45_guest_inspection_contract.py'
      - 'schemas/bazzite_iso45_guest_inspection_contract_v1.schema.json'
      - 'docs/BAZZITE_ISO45_READONLY_INSPECTION_CONTRACT.md'

permissions:
  contents: read

jobs:
  contract-refusal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install static contract tools only
        run: python -m pip install --disable-pip-version-check pytest ruff jsonschema
      - name: Run offline Safety/Observer boundary regressions
        run: |
          set -Eeuo pipefail
          python -m pytest -q auto_tests/tests/test_bazzite_iso45_guest_inspection_contract.py auto_tests/tests/test_bazzite_anaconda_readonly_capture.py auto_tests/tests/test_bazzite_live_channel_boundary.py auto_tests/tests/test_bazzite_anaconda_write_set_gate.py auto_tests/tests/test_bazzite_official_iso_candidate.py
          python -m ruff check --config auto_tests/pyproject.toml auto_tests/bazzite_iso45_guest_inspection_contract.py auto_tests/tests/test_bazzite_iso45_guest_inspection_contract.py
          python -m ruff format --check --config auto_tests/pyproject.toml auto_tests/bazzite_iso45_guest_inspection_contract.py auto_tests/tests/test_bazzite_iso45_guest_inspection_contract.py
          python -m compileall -q auto_tests/bazzite_iso45_guest_inspection_contract.py auto_tests/tests/test_bazzite_iso45_guest_inspection_contract.py
      - name: Assert schema and mandatory REFUSED no-channel status
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          path = Path('schemas/bazzite_iso45_guest_inspection_contract_v1.schema.json')
          schema = json.loads(path.read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          assert schema['properties']['permissions']['properties']['installationAuthorized']['const'] is False
          assert schema['properties']['permissions']['properties']['guestCommandChannelAuthorized']['const'] is False
          print('PASS: contract-only, no guest execution, no ISO download, no QEMU')
          PY
