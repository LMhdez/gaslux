name: CachyOS read-only transaction proposal safety (no disk mutation)
on:
  push:
    branches:
      - feature/cachyos-readonly-transaction-plan-issue3
    paths:
      - .github/workflows/cachyos-partition-transaction-simulation.yml
      - auto_tests/tools/cachyos_partition_transaction_simulation.py
      - auto_tests/test_cachyos_partition_transaction_simulation.py
      - auto_tests/tools/windows_cachyos_qcow2_gpt_readonly.py
      - auto_tests/test_windows_cachyos_qcow2_gpt_readonly.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulated-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fail-closed simulation and GPT geometry regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS}" = true
          test "${RUNNER_ENVIRONMENT}" = github-hosted
          test "${GITHUB_REPOSITORY}" = LMhdez/gaslux
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-utils
          python3 -m py_compile auto_tests/tools/cachyos_partition_transaction_simulation.py auto_tests/test_cachyos_partition_transaction_simulation.py
          python3 -m unittest discover -s auto_tests -p test_cachyos_partition_transaction_simulation.py -v
          python3 -m unittest discover -s auto_tests -p test_windows_cachyos_qcow2_gpt_readonly.py -v
          python3 -m unittest discover -s auto_tests -p test_windows_cachyos_readonly_baseline_gate.py -v
          printf '%s\n' 'Simulation only: no disk mutation, recovery snapshot, Linux installation or dual boot. All write-authority flags must remain false.' >> "$GITHUB_STEP_SUMMARY"
