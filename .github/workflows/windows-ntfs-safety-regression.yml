name: Windows NTFS pre-mounted safety (offline, no loopback)

on:
  push:
    branches:
      - integration/ntfs-existing-mount-deny-only-dev-20261122
      - dev
    paths:
      - 'assets/live/libertix_windows_sharing.py'
      - 'auto_tests/tests/test_windows_sharing_inventory.py'
      - '.github/workflows/windows-ntfs-safety-regression.yml'
  pull_request:
    branches:
      - dev
    paths:
      - 'assets/live/libertix_windows_sharing.py'
      - 'auto_tests/tests/test_windows_sharing_inventory.py'
      - '.github/workflows/windows-ntfs-safety-regression.yml'

permissions:
  contents: read

jobs:
  ntfs-sharing-static-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install offline test requirements
        run: python3 -m pip install 'pytest==9.0.2' 'jsonschema==4.25.1' 'ruff==0.13.3'
      - name: Compile and lint static-only sharing gate
        run: |
          python3 -m compileall -q assets/live/libertix_windows_sharing.py auto_tests/tests/test_windows_sharing_inventory.py
          python3 -m ruff check --config auto_tests/pyproject.toml assets/live/libertix_windows_sharing.py auto_tests/tests/test_windows_sharing_inventory.py
          python3 -m ruff format --check --config auto_tests/pyproject.toml assets/live/libertix_windows_sharing.py auto_tests/tests/test_windows_sharing_inventory.py
          python3 - <<'PY'
          from pathlib import Path
          raw = Path('.github/workflows/windows-ntfs-safety-regression.yml').read_text()
          for forbidden in ('workflow_dispatch:', 'losetup ', 'mkfs.ntfs ', 'sudo ', 'qemu-system-'):
              assert forbidden not in raw, forbidden
          print('OFFLINE_ONLY: no privileged loopback or QEMU operations')
          PY
      - name: Actual NTFS sharing and plan-contract unit tests
        run: python3 -m pytest -q auto_tests/tests/test_windows_sharing_inventory.py auto_tests/tests/test_installation_contracts.py
