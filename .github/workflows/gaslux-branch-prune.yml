name: Gaslux exact Q4OS CI source ref prune
on:
  push:
    branches:
      - automation/gaslux-branch-prune-20261119

permissions:
  contents: write

concurrency:
  group: gaslux-conservative-branch-prune
  cancel-in-progress: false

jobs:
  exact-source-prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Check contracts and 110-source archive first
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 -m py_compile auto_tests/tools/gaslux_branch_prune.py
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_exact_prune.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_absorbed_prune.py' -v
          python3 auto_tests/tools/gaslux_archive_history_verifier.py --output "$RUNNER_TEMP/verify-archive110.json"
      - name: Prune only fully incorporated exact Q4OS CI branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GASLUX_PRUNE_APPROVED: LEASE_GUARDED_30
          GASLUX_PRUNE_EXACT: '{"ci/q4os-evidence-manifest-coverage-20261119":{"sha":"429c59a2b8bb2a4b35a7c6ecc9665326a806a1b2","preserved_in":"fix/q4os-evidence-dirfd-20261119"}}'
        run: |
          set -Eeuo pipefail
          python3 auto_tests/tools/gaslux_branch_prune.py prune --output "$RUNNER_TEMP/prune-exact-q4os-ci.json"
      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gaslux-exact-q4os-ci-ancestry
          path: |
            ${{ runner.temp }}/verify-archive110.json
            ${{ runner.temp }}/prune-exact-q4os-ci.json
          retention-days: 30
          if-no-files-found: warn
