name: Gaslux prune exact legacy 15-minute audit branch
on:
  push:
    branches:
      - automation/gaslux-branch-prune-20261119

permissions:
  contents: write

concurrency:
  group: gaslux-conservative-branch-prune
  cancel-in-progress: false

jobs:
  legacy-audit-prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify archived source history and fixed-SHA policy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 -m py_compile auto_tests/tools/gaslux_branch_prune.py
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_legacy_audit_absorption.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_absorbed_prune.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_branch_archive.py' -v
          python3 auto_tests/tools/gaslux_archive_history_verifier.py --output "$RUNNER_TEMP/gaslux-archive-before.json"
      - name: Delete only exact legacy audit ref already in maintenance history
        env:
          GH_TOKEN: ${{ github.token }}
          GASLUX_ABSORBED_APPROVED: EXACT_FOUR_PINNED_LEASE
          GASLUX_ABSORBED_EXACT: '{"automation/gaslux-15m-integration-audit":{"sha":"65ade7efb2232171c1d67f6e1ad006606a3ec5d8","keeper":"automation/gaslux-branch-prune-20261119","keeper_sha":"2c91ba0d908fef43b35f68f07c91abe8faaafff3"}}'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 auto_tests/tools/gaslux_branch_prune.py prune-absorbed --output "$RUNNER_TEMP/gaslux-legacy-audit-prune.json"
      - name: Upload branch-ref deletion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gaslux-legacy-audit-branch-evidence
          path: |
            ${{ runner.temp }}/gaslux-archive-before.json
            ${{ runner.temp }}/gaslux-legacy-audit-prune.json
          retention-days: 30
          if-no-files-found: warn
