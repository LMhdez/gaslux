name: Gaslux archived-branch integrity audit (read-only)
on:
  push:
    branches:
      - automation/gaslux-branch-prune-20261119

permissions:
  contents: read

concurrency:
  group: gaslux-conservative-branch-prune
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify 112 archived histories and current branch safety without writing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 -m py_compile auto_tests/tools/gaslux_branch_prune.py auto_tests/tools/gaslux_archive_history_verifier.py
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_exact_prune.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_exact_archive.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_absorbed_prune.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_branch_archive.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_archive_verify.py' -v
          python3 auto_tests/tools/gaslux_branch_prune.py audit --output "$RUNNER_TEMP/gaslux-prune-readonly.json"
          python3 auto_tests/tools/gaslux_archive_history_verifier.py --output "$RUNNER_TEMP/gaslux-archive-112-readonly.json"
      - name: Upload independently verified read-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gaslux-archive-112-readonly-final-evidence
          path: |
            ${{ runner.temp }}/gaslux-prune-readonly.json
            ${{ runner.temp }}/gaslux-archive-112-readonly.json
          retention-days: 30
          if-no-files-found: warn
