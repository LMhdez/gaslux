name: Gaslux branch ancestry audit (read-only)
on:
  push:
    branches:
      - automation/gaslux-branch-prune-20261119

permissions:
  contents: read

concurrency:
  group: gaslux-conservative-branch-prune
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect branch ancestry and protect live PRs (no deletions)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile auto_tests/tools/gaslux_branch_prune.py
          python3 auto_tests/tools/gaslux_branch_prune.py audit --output "$RUNNER_TEMP/gaslux-prune.json"
      - name: Upload audited candidate SHAs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gaslux-branch-prune-final-audit
          path: ${{ runner.temp }}/gaslux-prune.json
          retention-days: 30
          if-no-files-found: warn
