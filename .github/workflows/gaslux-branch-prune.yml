name: Gaslux final stale-branch pruning with 102 archived proofs
on:
  push:
    branches:
      - automation/gaslux-branch-prune-20261119

permissions:
  contents: write

concurrency:
  group: gaslux-conservative-branch-prune
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Prune only exact ancestral branches and reverify 102 archives
        env:
          GH_TOKEN: ${{ github.token }}
          GASLUX_PRUNE_APPROVED: LEASE_GUARDED_30
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile auto_tests/tools/gaslux_branch_prune.py
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_branch_archive.py' -v
          python3 auto_tests/tools/gaslux_branch_prune.py prune --output "$RUNNER_TEMP/gaslux-prune.json"
          python3 -m py_compile auto_tests/tools/gaslux_archive_history_verifier.py
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_archive_verify.py' -v
          python3 auto_tests/tools/gaslux_archive_history_verifier.py --output "$RUNNER_TEMP/gaslux-archive-verified.json"
      - name: Upload audited candidate SHAs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gaslux-final-67-branch-prune-evidence
          path: |
            ${{ runner.temp }}/gaslux-prune.json
            ${{ runner.temp }}/gaslux-archive-verified.json
          retention-days: 30
          if-no-files-found: warn
