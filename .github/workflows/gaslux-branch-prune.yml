name: Gaslux archive exactly six old independent histories
on:
  push:
    branches:
      - automation/gaslux-branch-prune-20261119

permissions:
  contents: write

concurrency:
  group: gaslux-conservative-branch-prune
  cancel-in-progress: false

jobs:
  archive-exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Confirm archive integrity and local safety contracts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 -m py_compile auto_tests/tools/gaslux_branch_prune.py
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_exact_prune.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_exact_archive.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_branch_archive.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_archive_verify.py' -v
          python3 auto_tests/tools/gaslux_archive_history_verifier.py --output "$RUNNER_TEMP/gaslux-archive-before.json"
      - name: Archive exact independent SHA history then remove old refs with lease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GASLUX_ARCHIVE_APPROVED: PRESERVE_HISTORY_LEASE_25
          GASLUX_ARCHIVE_EXACT: '{"test/popos-win10-native-child-distinst-20261119":"25e9e4e57d30586853f1f37444af38691273ba08","fix/cachyos-shared-cow-iso-ext4-ownership-issue3":"f021619207c2596d220d10a5d7cd56d74fd0c6cd","debug/q4os-win10-qemu-visual-evidence":"5fc0e111424eee05b64f108ae9235fd07abfae7e","fix/q4os-ovmf-hid-key-hold-20261119":"205a80b7b7dd9c04cd2710b2968bde20afe9b4e3","fix/q4os-ovmf-dvd-format-contracts-20261119":"4f481a03c0fc68891ed57b4a022a435687483730","fix/bazzite-official-iso-ovmf-gates-20261119":"98bdfb7e257f392b3aab7cf13932fc9c382e1105"}'
        run: |
          set -Eeuo pipefail
          python3 auto_tests/tools/gaslux_branch_prune.py archive --output "$RUNNER_TEMP/gaslux-exact-archive.json"
      - name: Upload source SHA and archive proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gaslux-exact-six-archived-sources
          path: |
            ${{ runner.temp }}/gaslux-archive-before.json
            ${{ runner.temp }}/gaslux-exact-archive.json
          retention-days: 30
          if-no-files-found: warn
