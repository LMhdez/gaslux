name: Gaslux remove absorbed Q4OS Ed25519 research branch
on:
  push:
    branches:
      - automation/gaslux-branch-prune-20261119
permissions:
  contents: write
concurrency:
  group: gaslux-conservative-branch-prune
  cancel-in-progress: false
jobs:
  prune-exact-two:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Validate archive and branch protection contracts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile auto_tests/tools/gaslux_branch_prune.py
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_absorbed_prune.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_archive_verify.py' -v
          python3 auto_tests/tools/gaslux_archive_history_verifier.py --output "$RUNNER_TEMP/archived.json"
      - name: Delete only source SHA proven ancestral of exact reviewed keeper SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GASLUX_ABSORBED_APPROVED: EXACT_FOUR_PINNED_LEASE
          GASLUX_ABSORBED_EXACT: '{"feature/q4os-summary-view-lab-20261119":{"sha":"eba674b20a2d98d4d3512ba90604aeb150f9bd62","keeper":"fix/q4os-evidence-dirfd-20261119","keeper_sha":"b68fc2d7d9caf2fa492ddda1e00a89e57a7dd7a5"}}'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 auto_tests/tools/gaslux_branch_prune.py prune-absorbed --output "$RUNNER_TEMP/prune-two.json"
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gaslux-q4os-absorbed-ed25519-branch-evidence
          path: |
            ${{ runner.temp }}/archived.json
            ${{ runner.temp }}/prune-two.json
          retention-days: 30
          if-no-files-found: warn
