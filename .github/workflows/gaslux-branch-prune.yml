name: Gaslux one-shot archived Windows branch cleanup
on:
  push:
    branches:
      - automation/gaslux-branch-prune-20261119

permissions:
  contents: write

concurrency:
  group: gaslux-conservative-branch-prune
  cancel-in-progress: false

jobs:
  prune-archived-windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Reconfirm immutable original history and archived tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --prune --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          archive=refs/remotes/origin/archive/gaslux-experiments-preserved-20261119
          archive_sha=4c955ed329baf986e5e5a1d40258d7815c124dcd
          source_sha=3718b8a7951f7e9e7318cd5b7f9d89d5e8c5250f
          parent_sha=170faa0d066e5caeb67e4b87a6c34bd5271611c0
          test "$(git rev-parse "$archive")" = "$archive_sha"
          test "$(git rev-parse "$archive_sha^{tree}")" = 663396d7205b73dae73b9763cf928d6bf515bc3f
          git merge-base --is-ancestor "$source_sha" "$archive_sha"
          git merge-base --is-ancestor "$parent_sha" "$source_sha"
          test "$(git rev-parse refs/remotes/origin/fix/windows-vnc-owned-unix-consolidation-20261118)" = "$source_sha"
          test "$(git rev-parse refs/remotes/origin/fix/windows-hmp-readonly-framebuffer-complete-prompt)" = "$parent_sha"
      - name: No active PR or workflow may refer to source branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo = "LMhdez/gaslux"
          forbidden = {
              "fix/windows-vnc-owned-unix-consolidation-20261118",
              "fix/windows-hmp-readonly-framebuffer-complete-prompt",
          }
          def get(path):
              req = urllib.request.Request(
                  "https://api.github.com/repos/" + repo + "/" + path,
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          for page in range(1, 4):
              prs = get(f"pulls?state=open&per_page=100&page={page}")
              for pr in prs:
                  for side in ("head", "base"):
                      if pr[side].get("repo") and pr[side]["repo"]["full_name"] == repo:
                          if pr[side]["ref"] in forbidden:
                              raise SystemExit("source branch still referenced by open PR")
              if len(prs) < 100:
                  break
          else:
              raise SystemExit("PR list truncated")
          for status in ("queued", "in_progress", "waiting", "pending", "requested"):
              for page in range(1, 4):
                  data = get(f"actions/runs?status={status}&per_page=100&page={page}")
                  runs = data.get("workflow_runs")
                  if not isinstance(runs, list):
                      raise SystemExit("workflow inventory missing")
                  if any(run.get("head_branch") in forbidden for run in runs):
                      raise SystemExit("source still has active workflow")
                  if len(runs) < 100:
                      break
              else:
                  raise SystemExit("active workflows truncated")
          print("PASS: no open-PR or active-workflow source dependency")
          PY
      - name: Delete only the two SHA-pinned PR216 refs after rechecking leases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          remote_sha() { git ls-remote --heads origin "refs/heads/$1" | awk '{print $1}'; }
          archive=archive/gaslux-experiments-preserved-20261119
          test "$(remote_sha "$archive")" = 4c955ed329baf986e5e5a1d40258d7815c124dcd
          delete_pinned() {
            local branch="$1" sha="$2"
            test "$(remote_sha "$branch")" = "$sha"
            git merge-base --is-ancestor "$sha" 4c955ed329baf986e5e5a1d40258d7815c124dcd
            git push --porcelain "--force-with-lease=refs/heads/$branch:$sha" origin ":refs/heads/$branch"
            test -z "$(remote_sha "$branch")"
            printf 'VERIFIED_DELETED %s %s\n' "$branch" "$sha"
          }
          delete_pinned fix/windows-vnc-owned-unix-consolidation-20261118 3718b8a7951f7e9e7318cd5b7f9d89d5e8c5250f
          delete_pinned fix/windows-hmp-readonly-framebuffer-complete-prompt 170faa0d066e5caeb67e4b87a6c34bd5271611c0
