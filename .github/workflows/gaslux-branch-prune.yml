name: Gaslux preserve retired Windows11 GPT QCOW2 lab and remove two old refs
on:
  push:
    branches:
      - automation/gaslux-branch-prune-20261119

permissions:
  contents: write

concurrency:
  group: gaslux-conservative-branch-prune
  cancel-in-progress: false

jobs:
  archive-and-prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify fixed source safety and existing archived source histories
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile auto_tests/tools/gaslux_branch_prune.py auto_tests/tools/gaslux_archive_history_verifier.py
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_exact_archive.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_branch_archive.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_exact_prune.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_absorbed_prune.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_archive_verify.py' -v
          python3 auto_tests/tools/gaslux_archive_history_verifier.py --output "$RUNNER_TEMP/archive-before.json"
      - name: Preserve abandoned closed PR 160 head as a two-parent tree-preserving archive
        shell: bash
        env:
          GASLUX_ARCHIVE_APPROVED: PRESERVE_HISTORY_LEASE_25
          GASLUX_ARCHIVE_EXACT: '{"test/windows11-cachyos-cow-gpt-stage":"d2fa68de8dee9e9362b8597414885d0fe08949e4"}'
        run: |
          set -Eeuo pipefail
          python3 auto_tests/tools/gaslux_branch_prune.py archive --output "$RUNNER_TEMP/windows11-head-archive.json"
      - name: Remove exact abandoned PR 160 base only when archived head proves ancestry
        shell: bash
        env:
          GASLUX_PRUNE_APPROVED: LEASE_GUARDED_30
          GASLUX_PRUNE_EXACT: '{"test/windows11-gpt-primary-backup-readonly-gate":{"sha":"0ab4ef1f028b531b087475ae619a33f9c4c14535","preserved_in":"archive/gaslux-experiments-preserved-20261119"}}'
        run: |
          set -Eeuo pipefail
          python3 auto_tests/tools/gaslux_branch_prune.py prune --output "$RUNNER_TEMP/windows11-base-prune.json"
      - name: Upload SHA-pinned deletion proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gaslux-retired-win11-qcow2-history-archive
          path: |
            ${{ runner.temp }}/archive-before.json
            ${{ runner.temp }}/windows11-head-archive.json
            ${{ runner.temp }}/windows11-base-prune.json
          retention-days: 30
          if-no-files-found: warn
