name: Gaslux exact inherited-branch cleanup (one shot)
on:
  push:
    branches:
      - automation/gaslux-branch-prune-20261119

permissions:
  contents: write

concurrency:
  group: gaslux-conservative-branch-prune
  cancel-in-progress: false

jobs:
  audit-and-prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact deletion contracts before the mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 -m py_compile auto_tests/tools/gaslux_branch_prune.py auto_tests/tools/gaslux_archive_history_verifier.py
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_exact_prune.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_absorbed_prune.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_branch_archive.py' -v
          python3 auto_tests/tools/gaslux_branch_prune.py audit --output "$RUNNER_TEMP/gaslux-prune-before.json"
      - name: Delete only SHA-pinned obsolete branch preserved in dev
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GASLUX_PRUNE_APPROVED: LEASE_GUARDED_30
          GASLUX_PRUNE_EXACT: '{"integration/mint-zorin-bazzite-guards-20261117":{"sha":"c252aff32635b4697b8422623abd713cda2e3215","preserved_in":"dev"}}'
        run: |
          set -Eeuo pipefail
          python3 auto_tests/tools/gaslux_branch_prune.py prune --output "$RUNNER_TEMP/gaslux-prune-after.json"
      - name: Upload mutation audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gaslux-one-shot-exact-prune
          path: |
            ${{ runner.temp }}/gaslux-prune-before.json
            ${{ runner.temp }}/gaslux-prune-after.json
          retention-days: 30
          if-no-files-found: warn
