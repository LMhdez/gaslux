name: Gaslux exact-three redundant branches (lease + ancestry)
on:
  push:
    branches:
      - automation/gaslux-branch-prune-20261119

permissions:
  contents: write

concurrency:
  group: gaslux-conservative-branch-prune
  cancel-in-progress: false

jobs:
  prune-exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Validate exact-prune safety and archived DAG
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile auto_tests/tools/gaslux_branch_prune.py
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_exact_prune.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_branch_archive.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_archive_verify.py' -v
          python3 auto_tests/tools/gaslux_archive_history_verifier.py --output "$RUNNER_TEMP/gaslux-archive-verified.json"
      - name: Prune only three preauthorized fully absorbed branch SHAs
        env:
          GH_TOKEN: ${{ github.token }}
          GASLUX_PRUNE_APPROVED: LEASE_GUARDED_30
          GASLUX_PRUNE_EXACT: '{"fix/mint-shutdown-witness-line-attestation-20261119":{"sha":"1e9b9ca2854fc5b67510b21584e3c3ef2b84d0d3","preserved_in":"fix/mint-shutdown-witness-kernel-powerdown-20261119"},"fix/q4os-evidence-manifest-newline-20261119":{"sha":"951e3361b75465efde17e21e14fe1d016cc2926c","preserved_in":"fix/q4os-evidence-dirfd-20261119"},"fix/q4os-manifest-nofollow-20261119":{"sha":"13430aeb88e8e010cbe28982048d68659a552e82","preserved_in":"fix/q4os-evidence-dirfd-20261119"}}'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 auto_tests/tools/gaslux_branch_prune.py prune --output "$RUNNER_TEMP/gaslux-exact-prune.json"
      - name: Upload immutable proof report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gaslux-exact-three-redundant-branches
          path: |
            ${{ runner.temp }}/gaslux-archive-verified.json
            ${{ runner.temp }}/gaslux-exact-prune.json
          retention-days: 30
          if-no-files-found: warn
