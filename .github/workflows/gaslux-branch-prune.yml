name: Gaslux exact three already-preserved source ref pruning
on:
  push:
    branches:
      - automation/gaslux-branch-prune-20261119

permissions:
  contents: write

concurrency:
  group: gaslux-conservative-branch-prune
  cancel-in-progress: false

jobs:
  prune-three:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Validate exact source ancestry and 112 archived source histories
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 -m py_compile auto_tests/tools/gaslux_archive_history_verifier.py auto_tests/tools/gaslux_branch_prune.py
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_exact_prune.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_branch_archive.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_archive_verify.py' -v
          python3 auto_tests/tools/gaslux_archive_history_verifier.py --output "$RUNNER_TEMP/verified-archive-112.json"
      - name: Delete only SHA-pinned sources already ancestral of PR or permanent archive
        env:
          GH_TOKEN: ${{ github.token }}
          GASLUX_PRUNE_APPROVED: LEASE_GUARDED_30
          GASLUX_PRUNE_EXACT: '{"feature/bazzite-owned-qcow2-storage-discovery":{"sha":"b1a4f7dc19c5be2076f91f7df1cc37b065e1feee","preserved_in":"test/bazzite-blivet-gui-observer-cow-20261119"},"test/popos-genuine-win10-cow-live-iso-20261119":{"sha":"fb670eb411de1ef51f2501890d5c1d17d014356f","preserved_in":"archive/gaslux-experiments-preserved-20261119"},"test/windows10-fat32-usb-partitioned-mbr-setup":{"sha":"74fa459dac328094224634f20abaff082bdc4eae","preserved_in":"archive/gaslux-experiments-preserved-20261119"}}'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 auto_tests/tools/gaslux_branch_prune.py prune --output "$RUNNER_TEMP/gaslux-three-preserved-refs.json"
      - name: Upload source and keeper SHA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gaslux-three-exact-preserved-ref-deletions
          path: |
            ${{ runner.temp }}/verified-archive-112.json
            ${{ runner.temp }}/gaslux-three-preserved-refs.json
          retention-days: 30
          if-no-files-found: warn
