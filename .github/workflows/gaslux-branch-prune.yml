name: Gaslux exact branch consolidation - Bazzite GPT and Q4OS Users
on:
  push:
    branches:
      - automation/gaslux-branch-prune-20261119

permissions:
  contents: write

concurrency:
  group: gaslux-conservative-branch-prune
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Read-only exact-prune safety tests and 110-history DAG verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile auto_tests/tools/gaslux_branch_prune.py
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_exact_prune.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_branch_archive.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_gaslux_absorbed_prune.py' -v
          python3 auto_tests/tools/gaslux_archive_history_verifier.py --output "$RUNNER_TEMP/archive110-proven.json"
      - name: Delete only two source refs already merged into PR heads
        env:
          GH_TOKEN: ${{ github.token }}
          GASLUX_PRUNE_APPROVED: LEASE_GUARDED_30
          GASLUX_PRUNE_EXACT: '{"feature/bazzite-gpt-layout-fixture-20261119":{"sha":"10f231842a98870344c05d09da6dff02450b796c","preserved_in":"test/bazzite-blivet-gui-observer-cow-20261119"},"fix/q4os-require-nofollow-flag-20261119":{"sha":"faa1c08e308674ae1c5e0da41ab2151c10a10abc","preserved_in":"fix/q4os-evidence-dirfd-20261119"}}'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 auto_tests/tools/gaslux_branch_prune.py prune --output "$RUNNER_TEMP/two-integrated-branches.json"
      - name: Upload exact Git history and ref-deletion proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gaslux-pruned-bazzite-gpt-q4os-users
          path: |
            ${{ runner.temp }}/archive110-proven.json
            ${{ runner.temp }}/two-integrated-branches.json
          retention-days: 30
          if-no-files-found: warn
