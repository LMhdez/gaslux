name: Installer Observer QEMU read-only laboratory
on:
  push:
    branches:
      - feature/installer-observer-engine
    paths:
      - 'auto_tests/installer_observer/lab_identity.py'
      - 'auto_tests/installer_observer/controller_lease.py'
      - 'auto_tests/installer_observer/qemu_surface.py'
      - 'auto_tests/installer_observer/lab_probe.py'
      - 'auto_tests/installer_observer/isolation_host.py'
      - '.github/workflows/installer-observer-lab.yml'
  pull_request:
    paths:
      - 'auto_tests/installer_observer/lab_probe.py'
      - 'auto_tests/installer_observer/lab_identity.py'
      - 'auto_tests/installer_observer/controller_lease.py'
      - 'auto_tests/installer_observer/qemu_surface.py'
      - '.github/workflows/installer-observer-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qemu-read-only-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated lab requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils
          python -m pip install 'pillow>=11,<13'
      - name: Reject root and unavailable QEMU before constructing any media
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          command -v qemu-system-x86_64
          command -v qemu-img
          python -m compileall -q auto_tests/installer_observer/lab_identity.py auto_tests/installer_observer/lab_probe.py auto_tests/installer_observer/isolation_host.py
      - name: Two independent QEMU processes; scratch ISO/QCOW2; zero input
        shell: bash
        run: |
          set -Eeuo pipefail
          # Dedicated Unix UID: a runner-UID connect(2) must receive EACCES.
          # GitHub runner has sudo; privileged runner impersonation is out of scope.
          sudo useradd --system --user-group --no-create-home --shell /usr/sbin/nologin gaslux_observer_ci
          lab_private="$(sudo mktemp -d /tmp/gaslux-obs-XXXXXXXX)"
          sudo chown gaslux_observer_ci:gaslux_observer_ci "$lab_private"
          sudo chmod 0700 "$lab_private"
          # Do not open the runner's home or checkout to the service UID.
          sudo install -d -m 0700 "$lab_private/auto_tests"
          sudo cp -a -- auto_tests/installer_observer "$lab_private/auto_tests/installer_observer"
          sudo cp -- auto_tests/__init__.py "$lab_private/auto_tests/__init__.py"
          sudo chown -R gaslux_observer_ci:gaslux_observer_ci "$lab_private/auto_tests"
          cleanup() {
            sudo rm -rf -- "$lab_private"
            sudo userdel gaslux_observer_ci || true
          }
          trap cleanup EXIT
          python -m auto_tests.installer_observer.isolation_host "$lab_private" gaslux_observer_ci "$RUNNER_TEMP/observer-qemu-lab"
      - name: Publish strictly synthetic observation evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observer-qemu-synthetic-readonly
          path: ${{ runner.temp }}/observer-qemu-lab/
          if-no-files-found: warn
          retention-days: 7
