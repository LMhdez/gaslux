name: Observer GPT QEMU one-shot - DISABLED pending protected controller

# This former branch-controlled QEMU entrypoint is deliberately decommissioned.
# workflow_dispatch is not operational because this file is absent on main.
# Even if somebody copies this to main, this job remains hard-disabled.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qemu-disabled:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - name: Explicit refusal - protected controller not integrated
        run: |
          echo "BLOCKED: QEMU requires an independently controlled main workflow"
          exit 1
