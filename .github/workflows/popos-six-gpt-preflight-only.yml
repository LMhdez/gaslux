name: Pop synthetic six-GPT preflight and recovery ONLY (no QEMU)

on:
  push:
    branches:
      - test/popos-six-gpt-synthetic-contracts-20261121
    paths:
      - .github/workflows/popos-six-gpt-preflight-only.yml
      - auto_tests/tools/gaslux_popos_six_gpt_*
      - auto_tests/test_popos_six_gpt_contract.py
      - auto_tests/test_popos_six_gpt_process_boundary.py
      - auto_tests/test_popos_six_gpt_snapshot_contract.py
      - auto_tests/tools/gaslux_popos_gpt_fd_boundary.py
      - auto_tests/test_popos_gpt_fd_01.py
      - assets/live/libertix_disk_identity_gate.py
      - auto_tests/tools/gaslux_popos_six_gpt_process_boundary.py
      - schemas/popos-six-gpt-lab.schema.json
      - docs/POP_OS_SIX_GPT_SYNTHETIC_LAB.md
  pull_request:
    paths:
      - .github/workflows/popos-six-gpt-preflight-only.yml
      - auto_tests/tools/gaslux_popos_six_gpt_*
      - auto_tests/test_popos_six_gpt_contract.py
      - auto_tests/test_popos_six_gpt_process_boundary.py
      - auto_tests/test_popos_six_gpt_snapshot_contract.py
      - auto_tests/tools/gaslux_popos_gpt_fd_boundary.py
      - auto_tests/test_popos_gpt_fd_01.py
      - assets/live/libertix_disk_identity_gate.py
      - auto_tests/tools/gaslux_popos_six_gpt_process_boundary.py
      - schemas/popos-six-gpt-lab.schema.json
      - docs/POP_OS_SIX_GPT_SYNTHETIC_LAB.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pop-six-gpt-preflight-no-guest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts-no-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reproduce P-324-01 RED against audited vulnerable ownership module
        shell: bash
        run: |
          set -Eeuo pipefail
          file=auto_tests/tools/gaslux_popos_six_gpt_ownership.py
          saved="$RUNNER_TEMP/p324-green-ownership.py"
          cp "$file" "$saved"
          trap 'cp "$saved" "$file"' EXIT
          git fetch --no-tags --depth=1 origin ed299115923289f6188004a3a51a1d38df35e772
          git show ed299115923289f6188004a3a51a1d38df35e772:"$file" > "$file"
          export PYTHONPATH="auto_tests:auto_tests/tools${PYTHONPATH:+:$PYTHONPATH}"
          set +e
          python3 -m unittest \
            auto_tests.test_popos_six_gpt_snapshot_contract.SnapshotContractTests.test_red_real_old_export_must_not_publish_changed_measurement \
            -v > "$RUNNER_TEMP/p324-red.txt" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/p324-red.txt"
          test "$result" -ne 0
          grep -Fq 'AssertionError' "$RUNNER_TEMP/p324-red.txt"
          grep -Fq 'test_red_real_old_export_must_not_publish_changed_measurement' "$RUNNER_TEMP/p324-red.txt"
          echo "P-324-01 reproduced on audited vulnerable module (expected assertion)." >> "$GITHUB_STEP_SUMMARY"
      - name: Compileall, Ruff, schema, regressions, Bash and ShellCheck
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          python3 -m venv "$RUNNER_TEMP/pop-six-contract-venv"
          "$RUNNER_TEMP/pop-six-contract-venv/bin/pip" install --disable-pip-version-check \
            'ruff==0.14.4' 'jsonschema==4.25.1'
          export PATH="$RUNNER_TEMP/pop-six-contract-venv/bin:$PATH"
          python3 -m compileall -q \
            auto_tests/tools/gaslux_popos_six_gpt_fsck.py \
            auto_tests/tools/gaslux_popos_six_gpt_contract.py \
            auto_tests/tools/gaslux_popos_six_gpt_lab.py \
            auto_tests/tools/gaslux_popos_six_gpt_ownership.py \
            auto_tests/test_popos_six_gpt_contract.py \
            auto_tests/tools/gaslux_popos_six_gpt_process_boundary.py \
            auto_tests/test_popos_six_gpt_process_boundary.py \
            auto_tests/test_popos_six_gpt_snapshot_contract.py
          ruff check --diff \
            auto_tests/tools/gaslux_popos_six_gpt_fsck.py \
            auto_tests/tools/gaslux_popos_six_gpt_contract.py \
            auto_tests/tools/gaslux_popos_six_gpt_lab.py \
            auto_tests/tools/gaslux_popos_six_gpt_ownership.py \
            auto_tests/test_popos_six_gpt_contract.py \
            auto_tests/tools/gaslux_popos_six_gpt_process_boundary.py \
            auto_tests/test_popos_six_gpt_process_boundary.py \
            auto_tests/test_popos_six_gpt_snapshot_contract.py || true
          ruff check \
            auto_tests/tools/gaslux_popos_six_gpt_fsck.py \
            auto_tests/tools/gaslux_popos_six_gpt_contract.py \
            auto_tests/tools/gaslux_popos_six_gpt_lab.py \
            auto_tests/tools/gaslux_popos_six_gpt_ownership.py \
            auto_tests/test_popos_six_gpt_contract.py \
            auto_tests/tools/gaslux_popos_six_gpt_process_boundary.py \
            auto_tests/test_popos_six_gpt_process_boundary.py \
            auto_tests/test_popos_six_gpt_snapshot_contract.py
          ruff format --diff \
            auto_tests/tools/gaslux_popos_six_gpt_fsck.py \
            auto_tests/tools/gaslux_popos_six_gpt_contract.py \
            auto_tests/tools/gaslux_popos_six_gpt_lab.py \
            auto_tests/tools/gaslux_popos_six_gpt_ownership.py \
            auto_tests/test_popos_six_gpt_contract.py \
            auto_tests/tools/gaslux_popos_six_gpt_process_boundary.py \
            auto_tests/test_popos_six_gpt_process_boundary.py \
            auto_tests/test_popos_six_gpt_snapshot_contract.py
          ruff format --check \
            auto_tests/tools/gaslux_popos_six_gpt_fsck.py \
            auto_tests/tools/gaslux_popos_six_gpt_contract.py \
            auto_tests/tools/gaslux_popos_six_gpt_lab.py \
            auto_tests/tools/gaslux_popos_six_gpt_ownership.py \
            auto_tests/test_popos_six_gpt_contract.py \
            auto_tests/tools/gaslux_popos_six_gpt_process_boundary.py \
            auto_tests/test_popos_six_gpt_process_boundary.py \
            auto_tests/test_popos_six_gpt_snapshot_contract.py
          # Canonical GPT parser must remain blob-identical to dev/#307.
          test "$(git hash-object assets/live/libertix_disk_identity_gate.py)" = e82a401d5a160bfb5ca232b9a820417347dfc22a
          python3 -m compileall -q assets/live/libertix_disk_identity_gate.py             auto_tests/tools/gaslux_popos_gpt_fd_boundary.py             auto_tests/test_popos_gpt_fd_01.py
          ruff check auto_tests/tools/gaslux_popos_gpt_fd_boundary.py auto_tests/test_popos_gpt_fd_01.py
          ruff format --check auto_tests/tools/gaslux_popos_gpt_fd_boundary.py auto_tests/test_popos_gpt_fd_01.py
          # Legacy Windows/Pop fixtures use absolute test_ imports within auto_tests.
          export PYTHONPATH="auto_tests:auto_tests/tools${PYTHONPATH:+:$PYTHONPATH}"
          python3 -m unittest auto_tests.test_popos_six_gpt_contract -v
          python3 -m unittest auto_tests.test_popos_six_gpt_process_boundary -v
          python3 -m unittest auto_tests.test_popos_six_gpt_snapshot_contract -v
          python3 -m unittest auto_tests.test_popos_reuse_full_contract -v
          python3 -m unittest auto_tests.test_windows10_popos_native_write_set -v
          python3 -m unittest auto_tests.test_windows10_popos_safety_attestation_adapter -v
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema=json.loads(Path("schemas/popos-six-gpt-lab.schema.json").read_text())
          Draft202012Validator.check_schema(schema)
          for key in ("productionInstallationAuthorized", "windowsWriterAuthorized",
                      "sameDiskDualBootVerified", "windowsInPlaceRollbackProven",
                      "releaseEligible", "stable"):
              assert schema["properties"][key]["const"] is False
          print("GASLUX_POP_SIX_GPT_SCHEMA_FAIL_CLOSED=1")
          PY
          bash -n auto_tests/tools/gaslux_popos_reuse_full_install_guest.sh
          bash -n auto_tests/tools/gaslux_popos_reuse_full_firstboot_vm.sh
          shellcheck -S error auto_tests/tools/gaslux_popos_reuse_full_install_guest.sh
          shellcheck -S error auto_tests/tools/gaslux_popos_reuse_full_firstboot_vm.sh
          echo 'No modified Bash; historical Bash syntax checked. No QEMU or Windows.' >> "$GITHUB_STEP_SUMMARY"

  disposable-six-gpt-checkpoint-only:
    needs: contracts-no-media
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GASLUX_POP_SIX_GPT_CONSENT: I_ACCEPT_DISPOSABLE_SIX_GPT_PREFLIGHT_ONLY
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install only offline synthetic file and GPT tools
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gdisk util-linux dosfstools mtools e2fsprogs qemu-utils ovmf
          test -x "$(command -v sgdisk)"
          test -x "$(command -v sfdisk)"
          test -x "$(command -v qemu-img)"
          test -x "$(command -v qemu-io)"
          test -f /usr/share/OVMF/OVMF_VARS_4M.fd
      - name: POP-GPT-FD-01 real sparse GPT adversaries (read-only verifier)
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          export PYTHONPATH="auto_tests:auto_tests/tools${PYTHONPATH:+:$PYTHONPATH}"
          python3 -m unittest auto_tests.test_popos_gpt_fd_01 -v
          echo 'POP-GPT-FD-01 tests DENY ONLY; no installer execution.' >> "$GITHUB_STEP_SUMMARY"
      - name: Build synthetic six-GPT RAW, audit protected canaries, rehearse COW recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          work="$(mktemp -d "$RUNNER_TEMP/gaslux-pop-six-gpt-XXXXXXXX")"
          evidence="$GITHUB_WORKSPACE/pop-six-gpt-evidence"
          mkdir -m 700 "$evidence"
          # qemu-img and qemu-io only: offline QCOW2 map tests, never a guest.
          export PYTHONPATH="auto_tests:auto_tests/tools${PYTHONPATH:+:$PYTHONPATH}"
          python3 -m unittest auto_tests.test_popos_six_gpt_contract.SixGptNegativeTests.test_f04_real_offline_qcow2_zero_data_and_clean -v
          # Owner-pinned inventory and evidence export. Deliberately no
          # pathname-based cleanup: hosted runner reclaims ephemeral work.
          python3 auto_tests/tools/gaslux_popos_six_gpt_ownership.py run \
            --work "$work" --evidence "$evidence" \
            --ovmf-template /usr/share/OVMF/OVMF_VARS_4M.fd
          echo 'Preflight-only. No QEMU guest; Safety must authorize any later six-GPT installation.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload ONLY bounded JSON evidence; never RAW/QCOW2/OVMF
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pop-six-gpt-preflight-evidence
          path: pop-six-gpt-evidence/
          if-no-files-found: warn
          retention-days: 7
