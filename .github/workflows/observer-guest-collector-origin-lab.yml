name: Observer booted guest collector lab - NO ATTESTATION OR WRITER

on:
  push:
    branches: [test/observer-guest-collector-origin-20261122]
    paths:
      - 'auto_tests/installer_observer/guest_collector_lab_protocol.py'
      - 'auto_tests/tests/test_observer_guest_collector_origin.py'
      - 'auto_tests/tests/test_observer_qemu_real_disk_readonly.py'
      - '.github/workflows/observer-guest-collector-origin-lab.yml'
      - 'docs/OBSERVER_GUEST_COLLECTOR_ORIGIN_LAB.md'
  pull_request:
    branches: [test/observer-qemu-guest-peer-origin-deny-20261122]

permissions:
  contents: read

jobs:
  qemu-guest-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GASLUX_QEMU_NO_GUEST: '1'
      GASLUX_QEMU_GUEST_LAB_CONSENT: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout Safety #267 pinned
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: LMhdez/gaslux
          ref: 0be04192acd542646a5b6cd952e01620379edf5d
          path: safety267-pinned
          persist-credentials: false
      - name: Checkout GPT #286 pinned
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: LMhdez/gaslux
          ref: 9aed36cfdb8c09a461dc38811c326c54180273de
          path: gpt286-pinned
          persist-credentials: false
      - name: Check isolated runner, refs and existing trusted code
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$GASLUX_QEMU_GUEST_LAB_CONSENT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C safety267-pinned rev-parse HEAD)" = 0be04192acd542646a5b6cd952e01620379edf5d
          test "$(git -C gpt286-pinned rev-parse HEAD)" = 9aed36cfdb8c09a461dc38811c326c54180273de
          test "$(git hash-object auto_tests/installer_observer/host_fd_boundary.py)" = 35bc7f4a37ec8821aa32c15660f83ef80e3e29b9
          test "$(git hash-object auto_tests/installer_observer/host_qemu_fd_evidence.py)" = 6727ca454b9282079400593356516097a297b9d6
          test "$(git hash-object auto_tests/installer_observer/guest_transport_peer_boundary.py)" = e176d90f487aede071b12bced9d5d3a41d93199e
          test "$(git hash-object auto_tests/installer_observer/qemu_local_disk_witness.py)" = b7fab5ab0211904af5f43f089c54a6a72141d0ed
      - name: Install apt-signed Linux kernel and disposable guest tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils gdisk linux-image-virtual busybox-static cpio kmod zstd file
          test -x /usr/bin/qemu-system-x86_64
          test -x /usr/bin/modprobe
          test -x /bin/busybox
          dpkg-query -W linux-image-virtual busybox-static qemu-system-x86
      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install isolated Python tools
        run: python -m pip install --disable-pip-version-check 'pytest>=9,<10' 'ruff>=0.14,<0.17' 'pillow>=11,<13'
      - name: Compile and lint exact new modules and modified supervisor
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m compileall -q auto_tests/installer_observer/guest_collector_lab_protocol.py auto_tests/tests/test_observer_guest_collector_origin.py auto_tests/tests/test_observer_qemu_real_disk_readonly.py
          python -m ruff check --config auto_tests/pyproject.toml auto_tests/installer_observer/guest_collector_lab_protocol.py auto_tests/tests/test_observer_guest_collector_origin.py auto_tests/tests/test_observer_qemu_real_disk_readonly.py
          python -m ruff format --check --config auto_tests/pyproject.toml auto_tests/installer_observer/guest_collector_lab_protocol.py auto_tests/tests/test_observer_guest_collector_origin.py auto_tests/tests/test_observer_qemu_real_disk_readonly.py
      - name: Run adversarial challenge replay spoof disconnect tests first
        env:
          GASLUX_QEMU_PIN267_ROOT: '${{ github.workspace }}/safety267-pinned'
          GASLUX_QEMU_PIN286_ROOT: '${{ github.workspace }}/gpt286-pinned'
        run: python -m pytest -q auto_tests/tests/test_observer_guest_collector_origin.py -k 'not test_real_guest_boot_collector_challenge_via_virtio_serial'
      - name: Boot REAL QEMU Linux guest and read-only collector via virtio-serial
        env:
          GASLUX_QEMU_PIN267_ROOT: '${{ github.workspace }}/safety267-pinned'
          GASLUX_QEMU_PIN286_ROOT: '${{ github.workspace }}/gpt286-pinned'
        run: python -m pytest -q -s auto_tests/tests/test_observer_guest_collector_origin.py -k test_real_guest_boot_collector_challenge_via_virtio_serial
      - name: Recheck previous real QEMU, peer and provenance adversarial tests
        env:
          GASLUX_QEMU_PIN267_ROOT: '${{ github.workspace }}/safety267-pinned'
          GASLUX_QEMU_PIN286_ROOT: '${{ github.workspace }}/gpt286-pinned'
        run: |
          python -m pytest -q auto_tests/tests/test_observer_qemu_real_disk_readonly.py auto_tests/tests/test_observer_host_fd_safety_fixes.py auto_tests/tests/test_guest_transport_peer_boundary.py
      - name: Validate lab-only manifest and no writer/guest attestation
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"gaslux-observer-collector-lab"
          content=(root/"manifest.json").read_bytes()
          assert (root/"manifest.sha256").read_text().split()==[hashlib.sha256(content).hexdigest(),"manifest.json"]
          d=json.loads(content)
          assert d["status"]=="BLOCKED_TRUST_ROOT" and d["classification"]=="NOT_ATTESTED"
          assert all(d[k] is True for k in ("guestBootObserved","guestCollectorExecutedObserved","guestMessageReceived","hostQemuPeerAuthenticated","labLedgerSingleUseVerified"))
          assert all(d[k] is False for k in ("guestOriginIndependentlyAttested","guestChannelAuthenticated","replayProtectedAgainstHostCompromise","diskWriteAuthorized","productionInstallationAuthorized","rollbackProven","stable"))
          print("REAL_GUEST_LAB_NOT_INDEPENDENTLY_ATTESTED")
          PY
      - name: Upload bounded unsigned manifest only (NO kernel/QCOW2/ledger)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gaslux-guest-collector-lab-not-attested
          path: |
            ${{ runner.temp }}/gaslux-observer-collector-lab/manifest.json
            ${{ runner.temp }}/gaslux-observer-collector-lab/manifest.sha256
          retention-days: 7
          if-no-files-found: warn
      - name: Verify source pins and no tracked mutation
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C safety267-pinned rev-parse HEAD)" = 0be04192acd542646a5b6cd952e01620379edf5d
          test "$(git -C gpt286-pinned rev-parse HEAD)" = 9aed36cfdb8c09a461dc38811c326c54180273de
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "BOOTED_TEST_GUEST_NOT_INDEPENDENTLY_ATTESTED. NO INSTALLATION, GUEST COMMANDS OR WINDOWS ROLLBACK." >> "$GITHUB_STEP_SUMMARY"
