name: Observer test-only Linux guest collector origin - real QEMU (deny-only)

on:
  push:
    branches:
      - test/observer-guest-collector-origin-01-20261122
  pull_request:
    branches:
      - test/observer-qemu-guest-peer-origin-deny-20261122

permissions:
  contents: read

jobs:
  booted-lab-guest-deny-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GASLUX_GUEST_COLLECTOR_LAB: '1'
      GASLUX_QEMU_NO_GUEST: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: LMhdez/gaslux
          ref: 0be04192acd542646a5b6cd952e01620379edf5d
          path: safety267-pinned
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: LMhdez/gaslux
          ref: 9aed36cfdb8c09a461dc38811c326c54180273de
          path: gpt286-pinned
          persist-credentials: false
      - name: Enforce hosted runner and exact integrated Observer preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$(uname -m)" = x86_64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C safety267-pinned rev-parse HEAD)" = 0be04192acd542646a5b6cd952e01620379edf5d
          test "$(git -C gpt286-pinned rev-parse HEAD)" = 9aed36cfdb8c09a461dc38811c326c54180273de
          test "$(git hash-object auto_tests/installer_observer/host_fd_boundary.py)" = 35bc7f4a37ec8821aa32c15660f83ef80e3e29b9
          test "$(git hash-object auto_tests/installer_observer/host_qemu_fd_evidence.py)" = 6727ca454b9282079400593356516097a297b9d6
          test "$(git hash-object auto_tests/installer_observer/guest_transport_peer_boundary.py)" = e176d90f487aede071b12bced9d5d3a41d93199e
          test "$(git hash-object auto_tests/installer_observer/qemu_local_disk_witness.py)" = b7fab5ab0211904af5f43f089c54a6a72141d0ed
          for path in . safety267-pinned gpt286-pinned; do
            test -z "$(git -C "$path" status --porcelain --untracked-files=no)"
          done
      - name: Install signed Ubuntu kernel and static initramfs tools on disposable runner
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            linux-image-virtual busybox-static qemu-system-x86 qemu-utils gdisk cpio zstd kmod
          test -x /usr/bin/qemu-system-x86_64
          test -x /bin/busybox
          test -n "$(find /boot -maxdepth 1 -type f -name 'vmlinuz-*' -print -quit)"
          dpkg-query -W linux-image-virtual busybox-static
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pytest Ruff Pillow only on host
        run: python -m pip install --disable-pip-version-check 'pytest>=9,<10' 'ruff>=0.14,<0.17' 'pillow>=11,<13'
      - name: Syntax, Ruff lint and formatting
        run: |
          set -Eeuo pipefail
          python -m compileall -q auto_tests/tools/observer_guest_collector_lab.py auto_tests/tests/test_observer_guest_collector_origin.py
          python -m ruff check --config auto_tests/pyproject.toml auto_tests/tools/observer_guest_collector_lab.py auto_tests/tests/test_observer_guest_collector_origin.py
          python -m ruff format --check --config auto_tests/pyproject.toml auto_tests/tools/observer_guest_collector_lab.py auto_tests/tests/test_observer_guest_collector_origin.py
      - name: Boot REAL minimal Linux test guest and fixed read-only collector via virtio-serial
        env:
          GASLUX_QEMU_PIN267_ROOT: ${{ github.workspace }}/safety267-pinned
          GASLUX_QEMU_PIN286_ROOT: ${{ github.workspace }}/gpt286-pinned
        run: python -m pytest -q -s auto_tests/tests/test_observer_guest_collector_origin.py
      - name: Independently validate runner-only manifest schema and DENY flags
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out = Path(os.environ["RUNNER_TEMP"]) / "gaslux-guest-collector-origin"
          raw = (out / "manifest.json").read_bytes()
          assert 0 < len(raw) < 4096
          assert (out / "manifest.sha256").read_text().split() == [hashlib.sha256(raw).hexdigest(), "manifest.json"]
          data = json.loads(raw)
          assert data["schema"] == "gaslux-guest-collector-origin-lab-v1"
          assert data["status"] == "BLOCKED_TRUST_ROOT"
          assert data["classification"] == "NOT_INDEPENDENT"
          assert data["guestCollectorExecutedObserved"] is True
          assert data["guestMessageReceived"] is True
          assert data["hostQemuPeerAuthenticated"] is True
          assert data["labReplayConsumptionVerified"] is True
          for field in ("guestOriginIndependentlyAttested", "guestChannelAuthenticated",
                        "diskWriteAuthorized", "productionInstallationAuthorized",
                        "rollbackProven", "stable", "replayProtectedAgainstCompromisedHost"):
            assert data[field] is False, field
          print("BOOTED_LAB_GUEST_COLLECTOR_BUT_NOT_INDEPENDENTLY_ATTESTED")
          PY
      - name: Retain real stopped QEMU, F01-F03 and local peer regressions
        env:
          GASLUX_QEMU_PIN267_ROOT: ${{ github.workspace }}/safety267-pinned
          GASLUX_QEMU_PIN286_ROOT: ${{ github.workspace }}/gpt286-pinned
        run: |
          set -Eeuo pipefail
          python -m pytest -q \
            auto_tests/tests/test_observer_qemu_real_disk_readonly.py \
            auto_tests/tests/test_observer_host_fd_safety_fixes.py \
            auto_tests/tests/test_observer_host_fd_dev_integration.py \
            auto_tests/tests/test_guest_transport_peer_boundary.py
      - name: Upload unsigned test-host-only manifest and SHA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gaslux-booted-lab-guest-not-attested
          path: |
            ${{ runner.temp }}/gaslux-guest-collector-origin/manifest.json
            ${{ runner.temp }}/gaslux-guest-collector-origin/manifest.sha256
          retention-days: 7
          if-no-files-found: warn
      - name: Validate no changes to trusted checkout after disposable test
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C safety267-pinned rev-parse HEAD)" = 0be04192acd542646a5b6cd952e01620379edf5d
          test "$(git -C gpt286-pinned rev-parse HEAD)" = 9aed36cfdb8c09a461dc38811c326c54180273de
          for path in . safety267-pinned gpt286-pinned; do
            test -z "$(git -C "$path" status --porcelain --untracked-files=no)"
          done
