name: Diagnose bounded QCOW2 GPT extraction (no OS)
on:
  push:
    branches: [fix/windows-gpt-qcow2-window-extraction-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qcow2-bounds:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Probe qemu-img dd with 128 GiB disposable blank QCOW2
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS}" = true
          test "${RUNNER_ENVIRONMENT}" = github-hosted
          test "${GITHUB_REPOSITORY}" = LMhdez/gaslux
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-utils
          p="$(mktemp -d -p "$RUNNER_TEMP" gaslux-gpt-bounded-XXXXXX)"
          chmod 700 "$p"
          trap 'rm -rf -- "$p"' EXIT
          qemu-img create -f qcow2 "$p/blank.qcow2" 128G
          qemu-img info --output=json "$p/blank.qcow2"
          qemu-img --version
          qemu-img dd -f qcow2 -O raw bs=512 count=2048 skip=0 "if=$p/blank.qcow2" "of=$p/front.raw"
          qemu-img dd -f qcow2 -O raw bs=512 skip=268433408 "if=$p/blank.qcow2" "of=$p/back-nocount.raw"
          qemu-img dd -f qcow2 -O raw bs=512 count=268435456 skip=268433408 "if=$p/blank.qcow2" "of=$p/back-fullcount.raw"
          python3 - "$p" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          expected = 1048576
          for n in ("front", "back-nocount", "back-fullcount"):
              f = p / (n + ".raw")
              size = f.stat().st_size if f.is_file() else -1
              print(f"{n}: {size} bytes", flush=True)
              if n in ("front", "back-fullcount"):
                  assert size == expected, (n, size)
              if size == expected:
                  assert f.read_bytes() == bytes(expected), n
          print("Only bounded blank QCOW2 extraction verified. No Windows, Linux, boot or disk writes.")
          PY
