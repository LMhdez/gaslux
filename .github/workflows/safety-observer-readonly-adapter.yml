name: Safety Observer signed read-only GPT contract

on:
  pull_request:
    paths:
      - 'assets/live/libertix_safety_observer_adapter.py'
      - 'auto_tests/tests/test_safety_observer_adapter.py'
      - 'assets/live/libertix_gpt_provenance.py'
      - 'auto_tests/tests/test_safety_gpt_provenance.py'
      - 'schemas/safety-gpt-provenance-v1.schema.json'
      - '.github/workflows/safety-observer-readonly-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-observer-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Safety
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout exact Observer remote verifier and schemas (PR 259)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: LMhdez/gaslux
          ref: 244070463382931d57a066bcd050a91a8df104b0
          path: observer-pinned
          persist-credentials: false
      - name: Check source pin and no-write test boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git -C observer-pinned rev-parse HEAD)" = 244070463382931d57a066bcd050a91a8df104b0
          test -f observer-pinned/auto_tests/installer_observer/remote_verifier.py
          test -f observer-pinned/schemas/observer-readonly-request.schema.json
          test -f observer-pinned/schemas/observer-readonly-response.schema.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install Observer contract dependencies and validators
        run: |
          python -m pip install 'pytest>=9,<10' 'cryptography>=45,<47' 'jsonschema>=4,<5' 'rfc8785>=0.1,<1' 'ruff>=0.14,<0.17'
      - name: Compile and execute genuine signed Observer protocol tests
        shell: bash
        env:
          GASLUX_OBSERVER_ROOT: ${{ github.workspace }}/observer-pinned
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="$GASLUX_OBSERVER_ROOT:$GITHUB_WORKSPACE/assets/live"
          python -m py_compile "$GITHUB_WORKSPACE/assets/live/libertix_safety_observer_adapter.py" "$GITHUB_WORKSPACE/assets/live/libertix_gpt_provenance.py" "$GITHUB_WORKSPACE/auto_tests/tests/test_safety_observer_adapter.py" "$GITHUB_WORKSPACE/auto_tests/tests/test_safety_gpt_provenance.py"
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          with open("schemas/safety-gpt-provenance-v1.schema.json", encoding="utf-8") as source:
              Draft202012Validator.check_schema(json.load(source))
          PY
          cd "$GITHUB_WORKSPACE"
          python -m pytest -q --import-mode=importlib \
            "$GITHUB_WORKSPACE/auto_tests/tests/test_safety_observer_adapter.py" \
            "$GITHUB_WORKSPACE/auto_tests/tests/test_safety_gpt_provenance.py" \
            "$GITHUB_WORKSPACE/auto_tests/tests/test_disk_identity_gate.py" \
            "$GITHUB_WORKSPACE/auto_tests/tests/test_prewrite_no_writer.py"
          cd "$GASLUX_OBSERVER_ROOT"
          python -m pytest -q --import-mode=importlib auto_tests/tests/test_observer_remote_verifier.py
          python -m ruff check --select F,E4,E7,E9 \
            "$GITHUB_WORKSPACE/assets/live/libertix_safety_observer_adapter.py" \
            "$GITHUB_WORKSPACE/assets/live/libertix_gpt_provenance.py" \
            "$GITHUB_WORKSPACE/auto_tests/tests/test_safety_observer_adapter.py" \
            "$GITHUB_WORKSPACE/auto_tests/tests/test_safety_gpt_provenance.py"
