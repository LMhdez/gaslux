name: Mint protected ESP Recovery offset RCA (NO BOOTS)

on:
  push:
    branches:
      - audit/mint-protected-offset-rca-20261122
    paths:
      - auto_tests/tools/windows_mint_ab_offset_rca.py
      - auto_tests/test_windows_mint_ab_offset_rca.py
      - auto_tests/test_windows_mint_ab_checkpoint.py
      - .github/workflows/mint-ab-protected-offset-rca.yml
  workflow_dispatch:

concurrency:
  group: mint-protected-offset-no-boots-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pure-readonly:
    name: Private synthetic ESP Recovery offsets and A/B contracts (NO GUESTS)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require restricted hosted-runner identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          test "$GITHUB_REF" = refs/heads/audit/mint-protected-offset-rca-20261122
          test "$RUNNER_TEMP" = /home/runner/work/_temp
      - name: Python compileall and all related safety regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q auto_tests/tools/windows_mint_ab_offset_rca.py auto_tests/test_windows_mint_ab_offset_rca.py
          for suite in \
            test_windows_mint_ab_offset_rca.py \
            test_windows_mint_ab_forensic.py \
            test_windows_mint_ab_checkpoint.py \
            test_windows_mint_ab_capacity.py \
            test_windows_mint_ab_synthetic.py \
            test_windows_mint_ab_infrastructure.py \
            test_windows_mint_overlay_root.py \
            test_windows_x64_two_stage_boot.py; do
            python3 -m unittest discover -s auto_tests -p "$suite" -v
          done
      - name: Ruff 0.15.20 check and format
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --target "$RUNNER_TEMP/gaslux-ruff-0.15.20" --no-deps "ruff==0.15.20"
          export PYTHONPATH="$RUNNER_TEMP/gaslux-ruff-0.15.20"
          python3 -m ruff check auto_tests/tools/windows_mint_ab_offset_rca.py auto_tests/test_windows_mint_ab_offset_rca.py
          python3 -m ruff format --check auto_tests/tools/windows_mint_ab_offset_rca.py auto_tests/test_windows_mint_ab_offset_rca.py
