name: Q4OS historical archive verifier (offline only)

on:
  push:
    branches:
      - integration/q4os-historical-archive-verifier-offline-20261122
      - dev
    paths:
      - 'auto_tests/tools/verify_q4os_action_archives_offline.py'
      - 'auto_tests/tests/test_q4os_historical_archive_verifier_offline.py'
      - 'docs/distro-backends/evidence/q4os-manifest.json'
      - '.github/workflows/q4os-archive-offline.yml'
  pull_request:
    branches:
      - dev
    paths:
      - 'auto_tests/tools/verify_q4os_action_archives_offline.py'
      - 'auto_tests/tests/test_q4os_historical_archive_verifier_offline.py'
      - 'docs/distro-backends/evidence/q4os-manifest.json'
      - '.github/workflows/q4os-archive-offline.yml'

permissions:
  contents: read

jobs:
  offline-archives:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install offline-only dependencies
        run: python -m pip install --disable-pip-version-check 'pytest>=9,<10' 'ruff>=0.8,<1' 'jsonschema>=4,<5' 'pyyaml>=6,<7' 'pillow>=11,<13'
      - name: Validate manifest, syntax and lint
        run: |
          set -Eeuo pipefail
          python -m compileall -q auto_tests/tools/verify_q4os_action_archives_offline.py auto_tests/tests/test_q4os_historical_archive_verifier_offline.py
          python -m ruff check --config auto_tests/pyproject.toml auto_tests/tools/verify_q4os_action_archives_offline.py auto_tests/tests/test_q4os_historical_archive_verifier_offline.py
          python -m ruff format --check --config auto_tests/pyproject.toml auto_tests/tools/verify_q4os_action_archives_offline.py auto_tests/tests/test_q4os_historical_archive_verifier_offline.py
          python - <<'PY'
          import ast, json, pathlib, yaml
          from auto_tests.installer_observer.evidence import canonical, digest
          m = json.loads(pathlib.Path('docs/distro-backends/evidence/q4os-manifest.json').read_text())
          assert digest(canonical(m)) == 'e28485fc2e2ce8536c5e8f4dab30c4f0b44de74a70dece9b4897155e43598956'
          yaml.safe_load(pathlib.Path('.github/workflows/q4os-archive-offline.yml').read_text())
          print('PINNED_MANIFEST_OK')
          PY
      - name: Adversarial archives and existing offline regressions
        run: |
          set -Eeuo pipefail
          python -m pytest -q \
            auto_tests/tests/test_q4os_historical_archive_verifier_offline.py \
            auto_tests/tests/test_observer_boundary_model.py \
            auto_tests/tests/test_observer_boundary_dev_integration.py \
            auto_tests/tests/test_observer_screenshot_dev_integration.py \
            auto_tests/tests/test_installation_contracts.py \
            auto_tests/tests/test_live_storage_preflight.py
