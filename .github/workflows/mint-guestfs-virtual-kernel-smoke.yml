name: Mint isolated libguestfs virtual-kernel dependency smoke

on:
  push:
    branches:
      - test/mint-guestfs-virtual-kernel-20261118
    paths:
      - .github/workflows/mint-guestfs-virtual-kernel-smoke.yml
      - auto_tests/tools/windows_mint_synthetic_tar_guestfs.py
      - auto_tests/tools/windows_mint_overlay_root.py
      - auto_tests/tools/windows_x64_libguestfs_kernel.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-isolated-virtual-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: '1'
      GASLUX_SYNTHETIC_EXT4_CONSENT: I_ACCEPT_SYNTHETIC_RAW_FILE_FIFTH_EXT4_ONLY
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify apt dependency graph excludes bulk linux-firmware
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_TEMP" = /home/runner/work/_temp
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          test "$(id -u)" -ne 0
          sudo timeout --signal=TERM --kill-after=15s 480s \
            apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 update -qq
          apt-get -s install --no-install-recommends \
            gdisk qemu-utils python3-guestfs libguestfs-tools linux-image-virtual \
            | tee "$RUNNER_TEMP/gaslux-virtual-kernel-apt-sim.txt"
          if grep -Eq '^Inst linux-firmware([ -]|$)' "$RUNNER_TEMP/gaslux-virtual-kernel-apt-sim.txt"; then
            echo 'FAIL: virtual kernel unexpectedly requires bulk linux-firmware' >&2
            exit 1
          fi
          echo 'PASS: apt dependency plan does not install bulk linux-firmware'
      - name: Install signed Ubuntu virtualization kernel and guestfs tools with bounded network
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo timeout --signal=TERM --kill-after=15s 720s \
            env DEBIAN_FRONTEND=noninteractive \
            apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 \
            install -y --no-install-recommends \
            gdisk qemu-utils python3-guestfs libguestfs-tools linux-image-virtual
          source auto_tests/tools/windows_x64_libguestfs_kernel.sh
          echo "PASS: private Ubuntu signed virtual kernel version $SUPERMIN_KERNEL_VERSION"
      - name: Test same runner synthetic fifth-ext4 real tar import and COW discard
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GASLUX_SYNTHETIC_EXT4_CONSENT" = I_ACCEPT_SYNTHETIC_RAW_FILE_FIFTH_EXT4_ONLY
          python3 auto_tests/tools/windows_mint_synthetic_tar_guestfs.py
          echo 'PASS: actual libguestfs imported only synthetic fifth ext4 and verified COW discard; no Windows/Mint install or boot.' >> "$GITHUB_STEP_SUMMARY"
