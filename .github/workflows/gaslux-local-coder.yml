name: Gaslux Local Coder - bounded regression proposals

on:
  pull_request:
    paths:
      - .github/workflows/gaslux-local-coder.yml
      - auto_tests/tools/local_coder_logging_repair.py
      - auto_tests/tools/local_coder_publish.py
  push:
    branches: [dev]
    paths:
      - auto_tests/app/logging_config.py
      - auto_tests/tests/test_logging_config.py
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gaslux-local-coder-autofix
  cancel-in-progress: false

jobs:
  read-only-worker:
    if: >-
      github.repository == 'LMhdez/gaslux' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == 'LMhdez/gaslux')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      proposed: ${{ steps.worker.outputs.proposed }}
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      GASLUX_AGENT_MODEL: qwen2.5-coder:7b
      GASLUX_AGENT_SIMULATE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    steps:
      - name: Checkout only the intended disposable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'dev' }}
          persist-credentials: false
      - name: Install isolated focused-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/gaslux-agent-venv
          /tmp/gaslux-agent-venv/bin/python -m pip install --disable-pip-version-check 'pytest>=9,<10' 'python-json-logger>=2,<4'
      - name: Skip model download if existing focused test is already green
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GASLUX_AGENT_SIMULATE" == "1" ]]; then
            echo needs_model=true >> "$GITHUB_OUTPUT"
          elif (cd auto_tests && /tmp/gaslux-agent-venv/bin/python -m pytest tests/test_logging_config.py -q); then
            echo needs_model=false >> "$GITHUB_OUTPUT"
          else
            echo needs_model=true >> "$GITHUB_OUTPUT"
          fi
      - name: Install verified Ollama release script (worker has no write token)
        if: steps.baseline.outputs.needs_model == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/ollama/ollama/releases/download/v0.40.17/install.sh \
            -o /tmp/ollama-install.sh
          echo 'eb510679f45de4a914d99953cd3deaada5dc73f9d585014df99d704449dd7dcc  /tmp/ollama-install.sh' | sha256sum -c -
          OLLAMA_VERSION=0.40.17 timeout 360 sh /tmp/ollama-install.sh
          ollama --version
          (ollama serve > /tmp/ollama-serve.log 2>&1 &)
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/version >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/ollama-serve.log
          exit 1
      - name: Pull and inspect 7B model digest (not yet pinned)
        if: steps.baseline.outputs.needs_model == 'true'
        shell: bash
        run: |
          set -euo pipefail
          timeout 600 ollama pull "$GASLUX_AGENT_MODEL"
          ollama list
          python3 - <<'PY'
          import json
          import urllib.request
          response = json.load(urllib.request.urlopen("http://127.0.0.1:11434/api/tags", timeout=15))
          model = next((m for m in response["models"] if m["name"] == "qwen2.5-coder:7b"), None)
          if model is None or len(model.get("digest", "")) != 64:
              raise SystemExit("Missing valid model digest; no repair permitted")
          print("Verified local model digest:", model["digest"])
          PY
      - name: RED test then bounded model repair and GREEN test
        id: worker
        shell: bash
        run: |
          set -euo pipefail
          timeout 480 /tmp/gaslux-agent-venv/bin/python auto_tests/tools/local_coder_logging_repair.py
          if [[ -f evidence/candidate-logging_config.py ]]; then
            echo proposed=true >> "$GITHUB_OUTPUT"
          else
            echo proposed=false >> "$GITHUB_OUTPUT"
          fi
      - name: Upload proposed patch and independent test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gaslux-local-coder-proposal
          path: evidence/
          if-no-files-found: warn
          retention-days: 7

  draft-pr-publisher:
    if: >-
      github.repository == 'LMhdez/gaslux' &&
      github.event_name != 'pull_request' &&
      needs.read-only-worker.outputs.proposed == 'true'
    needs: read-only-worker
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout controlled publisher code (never execute proposed module)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dev
          persist-credentials: false
      - name: Download completed worker evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gaslux-local-coder-proposal
          path: evidence/
      - name: Exact-current-dev check and create at most one Draft PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 -I auto_tests/tools/local_coder_publish.py
