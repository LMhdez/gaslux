name: Microsoft evaluation Windows 10 UEFI no-prompt boot probe (lab only)

on:
  push:
    branches:
      - feature/windows-eval-uefi-usb-keyboard-proof
    paths:
      - .github/workflows/windows-x64-eval-noprompt-boot-probe.yml
      - auto_tests/tools/windows_x64_tcg_firstboot.py
      - auto_tests/test_windows_x64_derived_noprompt.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny-unsafe-media-and-boot-proofs:
    name: Original Microsoft SHA-256 identity and fail-closed synthetic guards
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Source compile and safe boot regression tests (no Windows)
        run: |
          set -Eeuo pipefail
          python3 -m py_compile auto_tests/tools/windows_x64_tcg_firstboot.py
          python3 -m unittest discover -v -s auto_tests -p 'test_windows_x64_derived_noprompt.py'
          python3 -m unittest discover -v -s auto_tests -p 'test_windows_x64_kvm_opt_in.py'
          python3 -m unittest discover -v -s auto_tests -p 'test_windows_x64_clean_poweroff_gate.py'
          python3 -m unittest discover -v -s auto_tests -p 'test_windows_x64_winre_baseline_contract.py'
          python3 -m unittest discover -v -s auto_tests -p 'test_windows_x64_tcg_unattend_contract.py'

  genuine-sha-pinned-original-iso-lab-boot:
    name: Original verified Microsoft Eval ISO, derived UDF EFI boot only
    needs: deny-unsafe-media-and-boot-proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GASLUX_WINDOWS_KVM_CONSENT: I_ACCEPT_DISPOSABLE_GITHUB_KVM_ONLY
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Refuse non-hosted runners and install only ephemeral ISO and KVM tools
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          test "$(uname -m)" = x86_64
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf swtpm dosfstools mtools \
            p7zip-full genisoimage
          test -c /dev/kvm && test ! -L /dev/kvm
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          mkdir -p "$GITHUB_WORKSPACE/windows-x64-tcg-evidence"
      - name: Verify official Windows 10 ISO, build ephemeral UDF no-prompt EFI and probe QEMU
        shell: bash
        run: |
          set -Eeuo pipefail
          export GASLUX_WINDOWS_EVIDENCE="$GITHUB_WORKSPACE/windows-x64-tcg-evidence"
          python3 auto_tests/tools/windows_x64_tcg_firstboot.py \
            --profile win10_22h2_en_us_x64 \
            --accel kvm --derived-no-prompt --boot-probe-only --boot-timeout 300
          echo 'UEFI DVD boot probe only, with separate derivative SHA256. NO installed Windows firstboot or dualboot.' >> "$GITHUB_STEP_SUMMARY"
      - name: Archive serial logs and negative boot report only (never ISO, QCOW2 or WIM)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-evaluation-derived-noprompt-boot-diagnostics
          path: windows-x64-tcg-evidence/
          retention-days: 7
          if-no-files-found: warn
