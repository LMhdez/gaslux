name: Q4OS Summary-only no-install UI contracts
on:
  push:
    branches:
      - docs/distro-one-shot-playbooks-20261119
    paths:
      - '.github/workflows/q4os-summary-contracts.yml'
      - '.github/workflows/q4os-summary-repro-2vm.yml'
      - 'auto_tests/tools/gaslux_q4os_summary_visual_gate.py'
      - 'auto_tests/tools/gaslux_q4os_summary_readonly_hook.sh'
      - 'auto_tests/tools/gaslux_q4os_patch_summary_lab.py'
      - 'auto_tests/tests/test_q4os_summary_gate.py'
permissions:
  contents: read
jobs:
  readonly-guard-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bash syntax, Ruff lint/format, pytest negative tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install pytest pillow ruff
          bash -n auto_tests/tools/gaslux_q4os_summary_readonly_hook.sh
          python -m compileall -q auto_tests/tools/gaslux_q4os_summary_visual_gate.py auto_tests/tools/gaslux_q4os_patch_summary_lab.py auto_tests/tests/test_q4os_summary_gate.py
          python -m ruff check --config auto_tests/pyproject.toml auto_tests/tools/gaslux_q4os_summary_visual_gate.py auto_tests/tools/gaslux_q4os_patch_summary_lab.py auto_tests/tests/test_q4os_summary_gate.py
          python -m ruff format --diff --check --config auto_tests/pyproject.toml auto_tests/tools/gaslux_q4os_summary_visual_gate.py auto_tests/tools/gaslux_q4os_patch_summary_lab.py auto_tests/tests/test_q4os_summary_gate.py
          python -m pytest -q auto_tests/tests/test_q4os_summary_gate.py
