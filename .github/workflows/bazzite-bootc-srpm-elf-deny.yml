name: Bazzite Fedora bootc SRPM ELF source binding (DENY only)

on:
  push:
    branches:
      - test/bazzite-bootc-srpm-elf-binding-deny-20261122
  pull_request:
    paths:
      - auto_tests/bazzite_bootc_srpm_elf_gate.py
      - auto_tests/tests/test_bazzite_bootc_srpm_elf_gate.py
      - .github/workflows/bazzite-bootc-srpm-elf-deny.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-no-writer:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run real Bazzite prewrite gate negatives, lint and compile
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install pytest ruff
          python -m pytest -q auto_tests/tests/test_bazzite_bootc_srpm_elf_gate.py auto_tests/tests/test_bazzite_bootc_prewrite_source.py
          python -m ruff check --config auto_tests/pyproject.toml auto_tests/bazzite_bootc_srpm_elf_gate.py auto_tests/tests/test_bazzite_bootc_srpm_elf_gate.py
          python -m ruff format --check --config auto_tests/pyproject.toml auto_tests/bazzite_bootc_srpm_elf_gate.py auto_tests/tests/test_bazzite_bootc_srpm_elf_gate.py
          python -m compileall -q auto_tests/bazzite_bootc_srpm_elf_gate.py auto_tests/tests/test_bazzite_bootc_srpm_elf_gate.py
          python auto_tests/bazzite_bootc_srpm_elf_gate.py > source-elf-decision.json || rc=$?
          test "${rc:-0}" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("source-elf-decision.json").read_text())
          assert d["decision"]=="SOURCE_ELF_UNPROVEN"
          assert d["authorization"]=="DENY_NO_WRITER"
          assert d["srpmSha256Verified"] is False
          assert not d["windowsEspWriteAuthorized"]
          PY
          sha256sum source-elf-decision.json > source-elf-decision-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bazzite-srpm-elf-deny-only
          path: |
            source-elf-decision.json
            source-elf-decision-sha256.txt
          if-no-files-found: warn
          retention-days: 14

  fedora-official-srpm-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout pinned upstream 1.17.1 for identity comparison only
        uses: actions/checkout@v4
        with:
          repository: bootc-dev/bootc
          ref: d01e723ae9480fa53aa9db09a7eff0439548e9f6
          path: pinned-bootc
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch source RPM and validate Fedora 45 official OpenPGP signature (no install)
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq rpm cpio zstd
          mkdir -p source-evidence
          curl --fail --show-error --silent --location --retry 2 --max-time 120 --max-filesize 67108864 \
            'https://kojipkgs.fedoraproject.org/packages/bootc/1.17.1/1.fc45/src/bootc-1.17.1-1.fc45.src.rpm' \
            --output source-evidence/bootc-1.17.1-1.fc45.src.rpm
          curl --fail --show-error --silent --location --retry 2 --max-time 45 --max-filesize 2097152 \
            'https://fedoraproject.org/fedora.gpg' --output source-evidence/fedora.gpg
          mkdir -m 700 source-evidence/gnupg
          gpg --batch --homedir source-evidence/gnupg --import source-evidence/fedora.gpg >/dev/null 2>&1
          export EXPECTED_FPR=4F50A6114CD5C6976A7F1179655A4B02F577861E
          gpg --batch --homedir source-evidence/gnupg --with-colons --fingerprint \
            | grep -Fx "fpr:::::::::${EXPECTED_FPR}:"
          gpg --batch --homedir source-evidence/gnupg --armor --export "$EXPECTED_FPR" \
            > source-evidence/fedora45-only.gpg
          mkdir source-evidence/rpmdb
          rpm --dbpath "$PWD/source-evidence/rpmdb" --initdb
          rpm --dbpath "$PWD/source-evidence/rpmdb" --import source-evidence/fedora45-only.gpg
          signature_status=0
          rpmkeys --dbpath "$PWD/source-evidence/rpmdb" -Kv \
            source-evidence/bootc-1.17.1-1.fc45.src.rpm \
            | tee source-evidence/signature.txt || signature_status=$?
          # The published Fedora 45 SRPM may have valid payload digests but
          # no publisher signature. Do not call digests a signature.
          if [ "$signature_status" -eq 0 ] \
            && grep -Eq 'Signature.*OK|[Ss]ignature.*[Pp]gp.*OK' source-evidence/signature.txt; then
            echo VERIFIED_FEDORA45_SRPM_SIGNATURE > source-evidence/signature-state.txt
          else
            echo SRPM_SIGNATURE_ABSENT_OR_UNVERIFIED > source-evidence/signature-state.txt
          fi
          rpm -qp --qf '%{NAME} %{VERSION} %{RELEASE} %{ARCH}\n' \
            source-evidence/bootc-1.17.1-1.fc45.src.rpm \
            | tee source-evidence/nevra.txt
          python - <<'PY'
          from pathlib import Path
          fields=Path("source-evidence/nevra.txt").read_text().strip().split()
          assert fields[:3]==["bootc","1.17.1","1.fc45"], f"FOREIGN_SRPM_NVR:{fields!r}"
          assert len(fields)==4, f"INVALID_SRPM_METADATA:{fields!r}"
          # RPM source-package 'arch' headers vary by RPM format. NEVER infer
          # trust from this field; the key signature is assessed separately.
          assert fields[3] in ("x86_64", "src"), f"FOREIGN_SRPM_ARCH:{fields!r}"
          print("FEDORA_45_SOURCE_NVR_OBSERVED_NOT_ELF_BOUND", fields)
          PY
          # A signed filename/extension does not prove the source-package bit.
          # Require RPM's own RPMTAG_SOURCEPACKAGE instead of inferring from ARCH.
          rpm -qp --qf '%{SOURCEPACKAGE}\n' \
            source-evidence/bootc-1.17.1-1.fc45.src.rpm \
            | tee source-evidence/sourcepackage-marker.txt
          grep -Fx '1' source-evidence/sourcepackage-marker.txt
          cat source-evidence/signature-state.txt
          sha256sum source-evidence/bootc-1.17.1-1.fc45.src.rpm \
            > source-evidence/srpm-sha256.txt
          rpm2cpio source-evidence/bootc-1.17.1-1.fc45.src.rpm \
            | cpio --quiet -it > source-evidence/members.txt
          python - <<'PY'
          from pathlib import Path
          members=Path("source-evidence/members.txt").read_text().splitlines()
          for suffix, key in [("/bootc.spec","spec"), ("/bootc-1.17.1.tar.zstd","source")]:
              matches=[p for p in members if p.lstrip("./")==suffix.lstrip("/")]
              if len(matches)!=1:
                  raise SystemExit(f"SRPM_MEMBER_AMBIGUOUS:{key}:{matches}")
              Path(f"source-evidence/{key}-member.txt").write_text(matches[0])
          Path("source-evidence/patch-members.txt").write_text(
              "\n".join(p for p in members if p.endswith((".patch", ".diff"))) + "\n"
          )
          PY
          spec="$(cat source-evidence/spec-member.txt)"
          source="$(cat source-evidence/source-member.txt)"
          rpm2cpio source-evidence/bootc-1.17.1-1.fc45.src.rpm \
            | cpio --quiet -i --to-stdout "$spec" > source-evidence/bootc.spec
          rpm2cpio source-evidence/bootc-1.17.1-1.fc45.src.rpm \
            | cpio --quiet -i --to-stdout "$source" > source-evidence/bootc-1.17.1.tar.zstd
          sha256sum source-evidence/bootc-1.17.1.tar.zstd > source-evidence/source-tar-sha256.txt
          # Effective Fedora SPEC fields come from extracted SRPM; do not guess macros.
          grep -Ei '^(Name|Version|Release|Source[0-9]*|Patch[0-9]*):' source-evidence/bootc.spec \
            | tee source-evidence/srpm-spec-fields.txt
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,"auto_tests")
          from bazzite_bootc_srpm_elf_gate import analyze_spec
          spec=Path("source-evidence/bootc.spec").read_text()
          d=analyze_spec(spec)
          assert not d["requiresPatchReview"], d
          assert Path("source-evidence/patch-members.txt").read_text().strip()==""
          print("SRPM_SPEC_NO_DECLARED_PATCH_FILES_ELF_UNPROVEN")
          PY
          # Compare actual packaged source Rust paths against Git commit; no extraction to disk.
          for src in crates/lib/src/install.rs crates/lib/src/bootloader.rs; do
            expected="$(git -C pinned-bootc hash-object "$src")"
            packaged="$(tar -I zstd -xOf source-evidence/bootc-1.17.1.tar.zstd "bootc-1.17.1/$src" | git hash-object --stdin)"
            test "$expected" = "$packaged"
            printf '%s %s\n' "$src" "$packaged" >> source-evidence/compared-rust-git-blobs.txt
          done
          echo SOURCE_ELF_UNPROVEN_DENY_NO_WRITER > source-evidence/verdict.txt
          sha256sum source-evidence/bootc.spec source-evidence/members.txt source-evidence/compared-rust-git-blobs.txt \
            > source-evidence/probe-sha256.txt
      - name: Publish read-only metadata and source hashes; never binary/SRPM bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazzite-official-srpm-source-readback
          path: |
            source-evidence/nevra.txt
            source-evidence/sourcepackage-marker.txt
            source-evidence/srpm-sha256.txt
            source-evidence/signature.txt
            source-evidence/signature-state.txt
            source-evidence/members.txt
            source-evidence/patch-members.txt
            source-evidence/srpm-spec-fields.txt
            source-evidence/source-tar-sha256.txt
            source-evidence/compared-rust-git-blobs.txt
            source-evidence/probe-sha256.txt
            source-evidence/verdict.txt
          if-no-files-found: warn
          retention-days: 14
