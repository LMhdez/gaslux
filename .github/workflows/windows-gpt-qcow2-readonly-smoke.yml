name: Windows/CachyOS QCOW2 bounded GPT read-only extract smoke (no Windows)
on:
  push:
    branches: [test/windows10-gpt-primary-backup-readonly-evidence]
    paths:
      - .github/workflows/windows-gpt-qcow2-readonly-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-windows-qcow2-dd:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Real qemu-img dd input boundaries on empty 128GiB disposable QCOW2
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-utils
          temp="$(mktemp -d -p "$RUNNER_TEMP" gaslux-qcow2-gpt-smoke-XXXXXX)"
          chmod 700 "$temp"
          trap 'rm -rf -- "$temp"' EXIT
          qemu-img create -f qcow2 "$temp/empty.qcow2" 128G
          qemu-img dd -f qcow2 -O raw bs=512 count=2048 skip=0 \
            "if=$temp/empty.qcow2" "of=$temp/front.raw"
          # QEMU 8.2 applies count before skip. Read exactly 1 MiB to EOF.
          qemu-img dd -f qcow2 -O raw bs=512 skip=268433408 \
            "if=$temp/empty.qcow2" "of=$temp/back.raw"
          python3 - "$temp" <<'PY'
          from pathlib import Path
          import sys
          temp=Path(sys.argv[1])
          for region in ('front','back'):
              path=temp/(region+'.raw')
              assert path.is_file() and not path.is_symlink()
              assert path.stat().st_size == 1048576, (region,path.stat().st_size)
              assert not any(path.read_bytes()), 'blank QCOW2 should yield zeros'
          print('PASS: qemu-img dd reads bounded primary + final GPT windows')
          print('NO Microsoft ISO, guest, disk layout, Linux boot or recovery proved')
          PY
