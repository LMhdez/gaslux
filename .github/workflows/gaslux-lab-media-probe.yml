name: Gaslux candidate media probes (read-only)

on:
  push:
    branches:
      - feature/multidistro-lab-media-probe
      - feature/popos-native-preflight
      - feature/bazzite-atomic-preflight
      - feature/q4os-native-preflight
  pull_request:
    paths:
      - 'assets/live/gaslux_*probe.py'
      - 'assets/live/gaslux_*preflight.py'
      - 'auto_tests/tests/test_*preflight.py'
      - 'auto_tests/tests/test_lab_media_probe.py'
      - '.github/workflows/gaslux-lab-media-probe.yml'

permissions:
  contents: read

jobs:
  read-only-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test and lint dependencies
        run: python -m pip install pytest ruff
      - name: Python syntax
        run: python -m compileall -q assets/live/gaslux_*probe.py assets/live/gaslux_*preflight.py auto_tests/tests/test_lab_media_probe.py auto_tests/tests/test_*preflight.py
      - name: Lint
        run: |
          python -m ruff check --config auto_tests/pyproject.toml assets/live/gaslux_lab_media_probe.py assets/live/gaslux_*preflight.py auto_tests/tests/test_lab_media_probe.py auto_tests/tests/test_*preflight.py
          python -m ruff format --check --config auto_tests/pyproject.toml assets/live/gaslux_lab_media_probe.py assets/live/gaslux_*preflight.py auto_tests/tests/test_lab_media_probe.py auto_tests/tests/test_*preflight.py
      - name: Purely synthetic safety tests
        run: python -m pytest -q auto_tests/tests/test_lab_media_probe.py auto_tests/tests/test_*preflight.py
