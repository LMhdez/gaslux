name: Gaslux candidate media probes (read-only)

on:
  push:
    branches:
      - feature/multidistro-lab-media-probe
      - feature/popos-native-preflight
      - feature/popos-ovmf-optical-media-proof
      - feature/popos-signed-distinst-agent-audit
      - feature/popos-native-distinst-guest-cli-proof
      - feature/bazzite-atomic-preflight
      - feature/q4os-native-preflight
  pull_request:
    paths:
      - 'assets/live/gaslux_*probe.py'
      - 'assets/live/gaslux_*preflight.py'
      - 'auto_tests/tests/test_*preflight.py'
      - 'auto_tests/tests/test_lab_media_probe.py'
      - '.github/workflows/gaslux-lab-media-probe.yml'

permissions:
  contents: read

jobs:
  read-only-contracts:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test and lint dependencies
        run: python -m pip install pytest ruff cryptography
      - name: Read-only probe syntax, lint and negative tests
        run: |
          bash -n assets/live/configure-target-main.sh
          bash -n auto_tests/tools/gaslux_candidate_live_boot.sh
          bash -n auto_tests/tools/gaslux_popos_vm_guest_probe.sh
          shopt -s nullglob
          sources=(assets/live/gaslux_lab_media_probe.py assets/live/gaslux_candidate_handoff.py assets/live/gaslux_candidate_target_audit.py assets/live/gaslux_*preflight.py)
          tests=(auto_tests/tests/test_lab_media_probe.py auto_tests/tests/test_candidate_handoff.py auto_tests/tests/test_candidate_target_audit.py auto_tests/tests/test_*preflight.py auto_tests/tests/test_popos_ovmf_optical_isolation.py auto_tests/tests/test_popos_native_agent_contract.py auto_tests/tests/test_popos_guest_cli_contract.py)
          python -m compileall -q "${sources[@]}" "${tests[@]}"
          python -m ruff check --config auto_tests/pyproject.toml "${sources[@]}" "${tests[@]}"
          python -m ruff format --check --config auto_tests/pyproject.toml "${sources[@]}" "${tests[@]}"
          python -m pytest -q "${tests[@]}"
