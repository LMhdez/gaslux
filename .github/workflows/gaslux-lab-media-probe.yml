name: Gaslux candidate media probes (read-only)

on:
  push:
    branches:
      - feature/multidistro-lab-media-probe
      - feature/popos-native-preflight
      - feature/bazzite-atomic-preflight
      - feature/q4os-native-preflight
      - feature/q4os-ovmf-verified-virtio-live
      - feature/q4os-verified-calamares-target-lab
  pull_request:
    paths:
      - 'assets/live/gaslux_*probe.py'
      - 'assets/live/gaslux_*preflight.py'
      - 'auto_tests/tests/test_*preflight.py'
      - 'auto_tests/tests/test_candidate_live_boot_transport.py'
      - 'auto_tests/tests/test_lab_media_probe.py'
      - '.github/workflows/gaslux-lab-media-probe.yml'
      - 'auto_tests/tests/test_q4os_calamares_probe.py'
      - 'assets/live/gaslux_q4os_calamares_policy.py'
      - 'auto_tests/tests/test_q4os_calamares_policy.py'

permissions:
  contents: read

jobs:
  read-only-contracts:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test and lint dependencies
        run: python -m pip install pytest ruff cryptography pyyaml
      - name: Read-only probe syntax, lint and negative tests
        run: |
          shopt -s nullglob
          sources=(assets/live/gaslux_lab_media_probe.py assets/live/gaslux_candidate_handoff.py assets/live/gaslux_candidate_target_audit.py assets/live/gaslux_q4os_calamares_policy.py assets/live/gaslux_*preflight.py)
          tests=(auto_tests/tests/test_lab_media_probe.py auto_tests/tests/test_candidate_handoff.py auto_tests/tests/test_candidate_target_audit.py auto_tests/tests/test_*preflight.py auto_tests/tests/test_candidate_live_boot_transport.py auto_tests/tests/test_q4os_calamares_probe.py auto_tests/tests/test_q4os_calamares_policy.py)
          python -m compileall -q "${sources[@]}" "${tests[@]}"
          python -m ruff check --config auto_tests/pyproject.toml "${sources[@]}" "${tests[@]}"
          python -m ruff format --check --config auto_tests/pyproject.toml "${sources[@]}" "${tests[@]}"
          python -m pytest -q "${tests[@]}"
