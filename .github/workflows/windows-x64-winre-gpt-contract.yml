name: Windows 10/11 x64 GPT/WinRE recovery baseline contracts (not installation)

on:
  push:
    branches:
      - feature/windows-x64-tcg-winre-recovery-baseline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-uefi-gpt-winre-contract:
    name: Microsoft 4-partition GPT and WinRE Enabled negative guards
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify genuine WinRE partition layout metadata and no false stability
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile auto_tests/tools/windows_x64_tcg_firstboot.py
          python3 -m unittest discover -v -s auto_tests -p 'test_windows_x64_qemu_host_gate.py'
          python3 -m unittest discover -v -s auto_tests -p 'test_windows_x64_tcg_unattend_contract.py'
          python3 -m unittest discover -v -s auto_tests -p 'test_windows_x64_winre_baseline_contract.py'
          python3 -m unittest discover -v -s auto_tests -p 'test_windows_x64_clean_poweroff_gate.py'
          python3 -m unittest discover -v -s auto_tests -p 'test_windows_x64_kvm_opt_in.py'
          echo 'PASS: unsigned/synthetic WinRE evidence cannot certify Windows recovery.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Windows client VM installed or booted in this workflow.' >> "$GITHUB_STEP_SUMMARY"

  windows-ps-witness-syntax:
    name: Validate WinRE read-only guest script with real Windows PowerShell parser
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Parse real guest witness for Windows 10 and Windows 11 without executing it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import sys;sys.path.insert(0,'auto_tests/tools');from windows_x64_tcg_firstboot import witness_powershell;from pathlib import Path;Path('win10-witness.ps1').write_text(witness_powershell('win10_22h2_en_us_x64','19045'),encoding='utf-8');Path('win11-witness.ps1').write_text(witness_powershell('win11_26h2_en_us_x64','26300'),encoding='utf-8')"
          if ($LASTEXITCODE -ne 0) { throw 'Python script generation failed' }
          foreach ($file in @('win10-witness.ps1','win11-witness.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              throw ("{0}: parser failed: {1}" -f $file, ($errors | Out-String))
            }
            $source = Get-Content -LiteralPath $file -Raw
            foreach ($expected in @(
              'Win32_OperatingSystem', 'Get-Disk','Get-Partition',
              'reagentc /info', 'Windows RE status:', 'bcdedit /enum',
              'GASLUX_WINDOWS_X64_WINRE_ENABLED=1',
              'GASLUX_WINDOWS_X64_RECOVERY_GPT_COUNT=1'
            )) {
              if (-not $source.Contains($expected)) {
                throw "$file missing required WinRE/BCD audit: $expected"
              }
            }
            foreach ($danger in @('reagentc /enable','bcdedit /set',
              'Remove-Partition','Clear-Disk','Format-Volume','diskpart')) {
              if ($source.Contains($danger)) {
                throw "$file includes forbidden host/guest recovery mutation: $danger"
              }
            }
          }
          echo 'PASS: Windows PowerShell AST syntax and read-only WinRE witness; NOT a Windows guest boot.' |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
