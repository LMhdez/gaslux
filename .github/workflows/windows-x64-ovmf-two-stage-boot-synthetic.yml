name: QEMU OVMF two-stage DVD then disk-only EFI boot (synthetic)

on:
  push:
    branches:
      - feature/windows-eval-noprompt-disposable-firstboot
    paths:
      - .github/workflows/windows-x64-ovmf-two-stage-boot-synthetic.yml
      - auto_tests/tools/windows_x64_two_stage_ovmf_smoke.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genuine-kvm-grub-two-stage:
    name: Firmware DVD reboot -> terminate VM -> disk-only installed EFI guest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prove runner isolation, install synthetic GRUB, GPT and QEMU tools
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          test "$(uname -m)" = x86_64
          bash -n auto_tests/tools/windows_x64_two_stage_ovmf_smoke.sh
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf grub-efi-amd64-bin grub-common grub-pc-bin \
            xorriso dosfstools mtools gdisk shellcheck
          shellcheck -S warning auto_tests/tools/windows_x64_two_stage_ovmf_smoke.sh
          test -c /dev/kvm && test ! -L /dev/kvm
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
      - name: Require DVD EFI marker and disk-only EFI marker across separate QEMU instances
        shell: bash
        run: |
          set -Eeuo pipefail
          bash auto_tests/tools/windows_x64_two_stage_ovmf_smoke.sh
          echo 'Two actual OVMF QEMU guest boots: synthetic GRUB DVD followed by GPT/ESP SATA disk without attached DVD.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Does not install Windows or verify BCD/WinRE or dual boot.' >> "$GITHUB_STEP_SUMMARY"
