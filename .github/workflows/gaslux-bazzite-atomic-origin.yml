name: Bazzite official Atomic OCI provenance (no ISO or installer)

on:
  push:
    branches:
      - feature/bazzite-atomic-preflight
    paths:
      - '.github/workflows/gaslux-bazzite-atomic-origin.yml'
      - 'assets/keys/bazzite-upstream-cosign.pub'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-oci-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install upstream cosign verifier
        uses: sigstore/cosign-installer@v3.8.2
      - name: Verify upstream Bazzite image signature and build attestation
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/bazzite-evidence"
          # Project-published key is vendored unmodified from upstream:
          # https://github.com/ublue-os/bazzite/blob/main/cosign.pub
          cosign verify --key assets/keys/bazzite-upstream-cosign.pub \
            ghcr.io/ublue-os/bazzite:stable \
            > "$RUNNER_TEMP/bazzite-evidence/cosign-verify.json"
          gh attestation verify oci://ghcr.io/ublue-os/bazzite:stable \
            --repo ublue-os/bazzite \
            > "$RUNNER_TEMP/bazzite-evidence/attestation-verify.txt"
          python3 - "$RUNNER_TEMP/bazzite-evidence/cosign-verify.json" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if not isinstance(data, list) or not data:
              raise SystemExit("No signed upstream Bazzite OCI manifest found")
          print("Signature verification produced", len(data), "signed upstream entries")
          PY
          (cd "$RUNNER_TEMP/bazzite-evidence" &&
            sha256sum *.json *.txt > evidence.sha256)
          echo "PASS: upstream signed Bazzite Atomic OCI image provenance checked."
          echo "NOT TESTED: Bazzite ISO authenticity, installer capabilities, Windows dual boot, kernel update or rollback."
      - name: Retain OCI verification evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazzite-atomic-oci-source-evidence
          path: ${{ runner.temp }}/bazzite-evidence/
          if-no-files-found: warn
          retention-days: 14
