name: Observer bounded evidence read-only subset (NO QEMU)

on:
  push:
    branches:
      - integration/observer-evidence-readonly-subset-20261122
      - dev
    paths:
      - 'auto_tests/installer_observer/__init__.py'
      - 'auto_tests/installer_observer/evidence.py'
      - 'auto_tests/tests/test_observer_readonly_evidence_subset.py'
      - 'docs/OBSERVER_READONLY_EVIDENCE_SUBSET.md'
      - '.github/workflows/observer-evidence-readonly-subset.yml'
  pull_request:
    paths:
      - 'auto_tests/installer_observer/__init__.py'
      - 'auto_tests/installer_observer/evidence.py'
      - 'auto_tests/tests/test_observer_readonly_evidence_subset.py'
      - 'docs/OBSERVER_READONLY_EVIDENCE_SUBSET.md'
      - '.github/workflows/observer-evidence-readonly-subset.yml'

permissions:
  contents: read

jobs:
  static-observer-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact proposed HEAD without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install offline linter only
        run: python3 -m pip install 'ruff==0.13.3'
      - name: Validate, compile and run direct adversarial tests
        run: |
          python3 -m ruff check --config auto_tests/pyproject.toml auto_tests/installer_observer/__init__.py auto_tests/installer_observer/evidence.py auto_tests/tests/test_observer_readonly_evidence_subset.py
          python3 -m ruff format --diff --check --config auto_tests/pyproject.toml auto_tests/installer_observer/__init__.py auto_tests/installer_observer/evidence.py auto_tests/tests/test_observer_readonly_evidence_subset.py
          python3 -m compileall -q auto_tests/installer_observer auto_tests/tests/test_observer_readonly_evidence_subset.py
          python3 -m unittest discover -s auto_tests/tests -p test_observer_readonly_evidence_subset.py -v
      - name: Confirm tracked checkout unchanged after tests
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --exit-code
          git diff --cached --exit-code
