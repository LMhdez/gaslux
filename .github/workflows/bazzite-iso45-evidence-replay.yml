name: Bazzite ISO45 original evidence replay (no ISO download or QEMU)

on:
  workflow_dispatch:
  push:
    branches:
      - test/bazzite-atomic-write-set-readonly-20261120
    paths:
      - '.github/workflows/bazzite-iso45-evidence-replay.yml'
      - 'auto_tests/bazzite_iso45_evidence_replay.py'
      - 'auto_tests/tests/test_bazzite_iso45_evidence_replay.py'
      - 'auto_tests/bazzite_iso45_passive_gate.py'
      - 'auto_tests/tests/test_bazzite_iso45_passive_gate.py'
      - 'docs/BAZZITE_ISO45_PASSIVE_REPLAY.md'

permissions:
  contents: read
  actions: read

jobs:
  evidence-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: python -m pip install --disable-pip-version-check pytest ruff pillow
      - name: Fetch exact 2.5 MB historical Actions artifact only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api "repos/LMhdez/gaslux/actions/artifacts/14672623998/zip" > "$RUNNER_TEMP/bazzite-iso45-original.zip"
          echo "BAZZITE_ISO45_REPLAY_ZIP=$RUNNER_TEMP/bazzite-iso45-original.zip" >> "$GITHUB_ENV"
          echo 'ba434ddf46e892c80325608b87cf6933da88bda716e144cfd63df0a49904a00c  ' > "$RUNNER_TEMP/sha-prefix"
          printf '%s\n' "$RUNNER_TEMP/bazzite-iso45-original.zip" > "$RUNNER_TEMP/zip-path"
          echo "ba434ddf46e892c80325608b87cf6933da88bda716e144cfd63df0a49904a00c  $RUNNER_TEMP/bazzite-iso45-original.zip" | sha256sum --check --status
      - name: Test provenance, replay, Atomic preflight and adversarial inputs
        run: |
          set -Eeuo pipefail
          python -m pytest -q auto_tests/tests/test_bazzite_iso45_evidence_replay.py auto_tests/tests/test_bazzite_iso45_passive_gate.py auto_tests/tests/test_bazzite_official_iso_candidate.py auto_tests/tests/test_bazzite_anaconda_write_set_gate.py auto_tests/tests/test_bazzite_atomic_destination_plan.py -k 'not test_real_gpt_readonly_proposal_and_immutable_backing'
          python -m ruff check --config auto_tests/pyproject.toml auto_tests/bazzite_iso45_evidence_replay.py auto_tests/tests/test_bazzite_iso45_evidence_replay.py auto_tests/bazzite_iso45_passive_gate.py auto_tests/tests/test_bazzite_iso45_passive_gate.py
          python -m ruff format --check --config auto_tests/pyproject.toml auto_tests/bazzite_iso45_evidence_replay.py auto_tests/tests/test_bazzite_iso45_evidence_replay.py auto_tests/bazzite_iso45_passive_gate.py auto_tests/tests/test_bazzite_iso45_passive_gate.py
          python -m compileall -q auto_tests/bazzite_iso45_evidence_replay.py auto_tests/bazzite_iso45_passive_gate.py auto_tests/tests/test_bazzite_iso45_evidence_replay.py
      - name: Emit bounded replay result B
        run: |
          set -Eeuo pipefail
          python auto_tests/bazzite_iso45_evidence_replay.py --archive "$BAZZITE_ISO45_REPLAY_ZIP" --candidate auto_tests/bazzite_official_iso_candidate_20261117.json --output "$RUNNER_TEMP/iso45-replay-result.json"
          python - "$RUNNER_TEMP/iso45-replay-result.json" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1], encoding="utf-8"))
          assert result["result"] == "B" and result["visualLiveDesktopObserved"] is True
          for key in ("installerDestinationObserved", "anacondaProcessVerified", "getActionsObserved", "writeSetVerified", "installationAuthorized", "partitionWriteAuthorized", "windowsEspWriteAuthorized", "nvramWriteAuthorized"):
              assert result[key] is False
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bazzite-iso45-original-evidence-replay
          path: ${{ runner.temp }}/iso45-replay-result.json
          if-no-files-found: error
          retention-days: 21
