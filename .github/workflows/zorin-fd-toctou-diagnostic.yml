name: Zorin RAW GPT descriptor TOCTOU diagnostic (synthetic only)
on:
  push:
    branches:
      - audit/zorin-fd-toctou-20261121
    paths:
      - '.github/workflows/zorin-fd-toctou-diagnostic.yml'
      - 'auto_tests/test_zorin_fd_toctou_repro.py'
      - 'auto_tests/tools/zorin_synthetic_writeset.py'
      - 'docs/ZORIN_FD_TOCTOU_AUDIT.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zorin-fd-toctou-diagnostic-20261121
  cancel-in-progress: false
jobs:
  synthetic-race-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout test-only Zorin audit branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Import the unchanged and pinned Safety GPT reader
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: LMhdez/gaslux
          ref: 8ed912c6934c33354b0a814201c7217043bd0197
          path: safety265
          persist-credentials: false
          sparse-checkout: |
            assets/live/libertix_disk_identity_gate.py
          sparse-checkout-cone-mode: false
      - name: Verify pinned reader, Python, Ruff, reproduce interleavings
        shell: bash
        env:
          PYTHONPATH: safety265/assets/live
        run: |
          set -Eeuo pipefail
          test "$(git -C safety265 rev-parse HEAD)" = 8ed912c6934c33354b0a814201c7217043bd0197
          test -f safety265/assets/live/libertix_disk_identity_gate.py
          python3 -m pip install --break-system-packages --no-input 'jsonschema>=4.20,<5' 'ruff>=0.10,<0.18'
          python3 -m compileall -q auto_tests/test_zorin_fd_toctou_repro.py auto_tests/tools/zorin_synthetic_writeset.py
          ruff check --select E4,E7,E9,F auto_tests/test_zorin_fd_toctou_repro.py auto_tests/tools/zorin_synthetic_writeset.py
          python3 -m unittest discover -s auto_tests -p test_zorin_fd_toctou_repro.py -v
          echo 'RACE REPRODUCTION ONLY. An unsafe synthetic classification is evidence of a defect, NEVER write approval.' >> "$GITHUB_STEP_SUMMARY"
