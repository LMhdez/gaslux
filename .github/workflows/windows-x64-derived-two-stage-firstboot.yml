name: Windows 10 eval derived DVD, two-stage QEMU installed firstboot (lab only)

on:
  push:
    branches:
      - feature/windows-eval-derived-two-stage-firstboot
    paths:
      - .github/workflows/windows-x64-derived-two-stage-firstboot.yml
      - auto_tests/tools/windows_x64_tcg_firstboot.py
      - auto_tests/test_windows_x64_two_stage_lab.py
      - auto_tests/test_windows_x64_tcg_unattend_contract.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-write-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile, refusal cases and existing Windows host/firstboot regressions
        run: |
          set -Eeuo pipefail
          python3 -m py_compile auto_tests/tools/windows_x64_tcg_firstboot.py \
            auto_tests/test_windows_x64_two_stage_lab.py
          for target in \
            test_windows_x64_two_stage_lab.py \
            test_windows_x64_derived_noprompt.py \
            test_windows_x64_kvm_opt_in.py \
            test_windows_x64_clean_poweroff_gate.py \
            test_windows_x64_winre_baseline_contract.py \
            test_windows_x64_tcg_unattend_contract.py; do
            python3 -m unittest discover -v -s auto_tests -p "$target"
          done

  native-kvm-windows-setup-then-installed-only-guest:
    needs: no-write-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GASLUX_WINDOWS_KVM_CONSENT: I_ACCEPT_DISPOSABLE_GITHUB_KVM_ONLY
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require hosted isolated KVM and only file-backed guest artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          test "$(uname -m)" = x86_64
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf swtpm dosfstools mtools \
            p7zip-full genisoimage
          test -c /dev/kvm && test ! -L /dev/kvm
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          mkdir -p "$GITHUB_WORKSPACE/windows-x64-tcg-evidence"
      - name: Install Windows 10 in disposable QCOW2, resume with ISO physically absent
        shell: bash
        run: |
          set -Eeuo pipefail
          export GASLUX_WINDOWS_EVIDENCE="$GITHUB_WORKSPACE/windows-x64-tcg-evidence"
          python3 auto_tests/tools/windows_x64_tcg_firstboot.py \
            --profile win10_22h2_en_us_x64 --accel kvm \
            --derived-no-prompt --lab-install-derived --boot-timeout 6300
          echo 'Only native guest Windows client ProductType/build + GPT, WinRE, BCD and clean QEMU exit constitute firstboot evidence.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Not Windows+CachyOS dual boot, release or host-disk evidence.' >> "$GITHUB_STEP_SUMMARY"
      - name: Archive only serial, SHA256 and JSON (never Microsoft media or disk)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-eval-derived-two-stage-firstboot-diagnostics
          path: windows-x64-tcg-evidence/
          retention-days: 7
          if-no-files-found: warn
