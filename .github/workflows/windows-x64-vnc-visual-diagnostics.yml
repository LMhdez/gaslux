name: Experimental Windows 11 official ISO GUI diagnosis (no firstboot claim)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/windows-vnc-boot-diagnostics-issue71
    paths:
      - .github/workflows/windows-x64-vnc-visual-diagnostics.yml
      - auto_tests/tools/windows_x64_tcg_firstboot.py
      - auto_tests/test_windows_x64_vnc_screen_diagnostics.py

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read-only diagnostic and original boot-gate unit tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -v -s auto_tests -p 'test_windows_x64_vnc_screen_diagnostics.py'
          python3 -m unittest discover -v -s auto_tests -p 'test_windows_x64_iso_boot_key.py'
          python3 -m unittest discover -v -s auto_tests -p 'test_windows_x64_clean_poweroff_gate.py'
          python3 -m py_compile auto_tests/tools/windows_x64_tcg_firstboot.py
  disposable-guest-screen:
    needs: safety
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GASLUX_WINDOWS_KVM_CONSENT: I_ACCEPT_DISPOSABLE_GITHUB_KVM_ONLY
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify hosted-only KVM and install QEMU tools
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          test "$RUNNER_OS" = Linux
          test -c /dev/kvm
          test ! -L /dev/kvm
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf swtpm dosfstools mtools
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          mkdir -p "$GITHUB_WORKSPACE/windows-x64-tcg-evidence"
      - name: Boot SHA256-verified official ISO; inspect guest display without copying images
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -Eeuo pipefail
          export GASLUX_WINDOWS_EVIDENCE="$GITHUB_WORKSPACE/windows-x64-tcg-evidence"
          set +e
          python3 auto_tests/tools/windows_x64_tcg_firstboot.py \
            --profile win11_26h2_en_us_x64 --accel kvm --vnc-dvd-enter \
            --diagnostic-screens --boot-timeout 240 \
            > "$RUNNER_TEMP/windows-dvd-diagnostic.log" 2>&1
          code=$?
          set -e
          # This is explicitly a 4-minute diagnostic, not a Windows
          # installation test. A timed-out Windows firstboot is expected.
          export GASLUX_DIAGNOSTIC_EXIT="$code"
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          log = Path(os.environ["RUNNER_TEMP"], "windows-dvd-diagnostic.log").read_text()
          result = json.loads(Path(os.environ["GASLUX_WINDOWS_EVIDENCE"],
                                   "win11_26h2_en_us_x64-result.json").read_text())
          if not result.get("isoHashVerified"):
              raise SystemExit("Official ISO integrity not verified")
          if "GASLUX_VM_INITIAL_OFFICIAL_WIN11_DVD_KEY_SENT=1" not in log:
              raise SystemExit("No boot input witness; diagnostic incomplete")
          for seconds in (90, 180):
              values = re.findall(
                  rf"GASLUX_VM_READONLY_SCREEN_{seconds}S_SHA256=([0-9a-f]{{64}})", log)
              if len(values) != 1:
                  raise SystemExit(f"Missing real QEMU display digest at {seconds}s")
              print(f"QEMU framebuffer digest at {seconds}s: {values[0]}")
          print(f"VM-firstboot attempt exit: {os.environ['GASLUX_DIAGNOSTIC_EXIT']}")
          print(f"Windows client firstboot verified: {result['windowsClientBootVerified']}")
          print("DIAGNOSTIC ONLY: framebuffer evidence is not Windows or dual-boot proof")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("Read-only official Windows 11 boot framebuffer captured at 90s and 180s.\n")
              summary.write("**Diagnostic only: no installed Windows / WinRE / dual boot acceptance.**\n")
          PY
      - name: Retain only serial and JSON (never screen pixels, ISO, QCOW2 or TPM)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64-win11-vnc-diagnostic-serial
          path: windows-x64-tcg-evidence/
          retention-days: 3
          if-no-files-found: warn
