name: Zorin FD-bound synthetic evidence — isolated dev (DENY NO WRITER)

on:
  push:
    branches:
      - integration/zorin-277-281-fd-nowriter-dev-20261122
    paths:
      - '.github/workflows/zorin-fd-nowriter-dev.yml'
      - 'auto_tests/tools/zorin_synthetic_writeset.py'
      - 'auto_tests/test_zorin_synthetic_writeset.py'
      - 'auto_tests/test_zorin_fd_toctou_repro.py'
      - 'schemas/zorin-synthetic-writeset-v1.schema.json'
      - 'docs/ZORIN_*.md'
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/zorin-fd-nowriter-dev.yml'
      - 'auto_tests/tools/zorin_synthetic_writeset.py'
      - 'auto_tests/test_zorin_synthetic_writeset.py'
      - 'auto_tests/test_zorin_fd_toctou_repro.py'
      - 'schemas/zorin-synthetic-writeset-v1.schema.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zorin-fd-nowriter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-fd-deny-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact commit without token persistence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Assert isolated GitHub-hosted Linux runner and local canonical Safety reader
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          test -f assets/live/libertix_disk_identity_gate.py
          test -f auto_tests/tests/test_disk_identity_gate.py
          test -f auto_tests/tools/zorin_synthetic_writeset.py
          test -f schemas/zorin-synthetic-writeset-v1.schema.json
          python3 - <<'PY'
          import ast
          from pathlib import Path
          module = ast.parse(Path("assets/live/libertix_disk_identity_gate.py").read_text())
          found = {node.name for node in module.body if isinstance(node, ast.FunctionDef)}
          assert {"inspect_gpt_fd", "assert_snapshot_matches"}.issubset(found)
          PY
      - name: Python 3.11 environment
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install bounded offline test dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input 'jsonschema>=4.20,<5' 'ruff>=0.10,<0.18' 'pytest>=8,<9'
      - name: Compile and lint isolated synthetic verifier and regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m compileall -q auto_tests/tools/zorin_synthetic_writeset.py auto_tests/test_zorin_synthetic_writeset.py auto_tests/test_zorin_fd_toctou_repro.py
          python -m ruff check --select E4,E7,E9,F auto_tests/tools/zorin_synthetic_writeset.py auto_tests/test_zorin_synthetic_writeset.py auto_tests/test_zorin_fd_toctou_repro.py
          python -m ruff format --check auto_tests/tools/zorin_synthetic_writeset.py auto_tests/test_zorin_synthetic_writeset.py auto_tests/test_zorin_fd_toctou_repro.py
      - name: Real canonical GPT/FD and Zorin byte/race synthetic regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="$PWD/assets/live"
          python -m unittest discover -s auto_tests -p test_zorin_synthetic_writeset.py -v
          python -m unittest discover -s auto_tests -p test_zorin_fd_toctou_repro.py -v
          python -m pytest -q auto_tests/tests/test_disk_identity_gate.py
      - name: Validate non-authorizing schema and publish evidence limitation
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("schemas/zorin-synthetic-writeset-v1.schema.json").read_text())
          Draft202012Validator.check_schema(schema)
          source = Path("auto_tests/tools/zorin_synthetic_writeset.py").read_text()
          for token in ("DENY_NO_WRITER", "productionWriteAuthorized"):
              assert token in source
          PY
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo 'Zorin synthetic FD/read-only checks only: no QEMU, guest installer, Windows disk, production writer, stable promotion, or rollback proof.' >> "$GITHUB_STEP_SUMMARY"
