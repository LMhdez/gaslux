name: CachyOS real Windows shared-root pacstrap (disposable QCOW2 only)

on:
  push:
    branches:
      - feature/cachyos-shared-cow-pacstrap-archiso-issue3
      - feature/cachyos-shared-cow-pacstrap-integrated-issue3
      - fix/cachyos-shared-cow-iso-ext4-ownership-issue3
      - fix/cachyos-ovmf-iso-usb-uuid-20261118
      - feature/cachyos-shared-cow-installed-readonly-boot-issue3
      - feature/cachyos-writable-child-cow-firstboot-issue3
      - fix/cachyos-configured-root-grant-binding-issue3
      - test/cachyos-postpacstrap-win10-same-cow-issue3
    paths:
      - .github/workflows/cachyos-windows10-shared-root-pacstrap.yml
      - auto_tests/tools/windows_x64_tcg_firstboot.py
      - auto_tests/tools/cachyos_windows_shared_root_pacstrap.py
      - auto_tests/tools/cachyos_configure_installed.py
      - auto_tests/test_cachyos_configure_installed.py
      - auto_tests/tools/cachyos_windows_shared_cow_grant.py
      - auto_tests/tools/cachyos_windows_shared_root_pacstrap_host.py
      - auto_tests/tools/cachyos_windows_shared_cow_firstboot.py
      - auto_tests/tools/cachyos_windows_shared_cow_rw_child.py
      - auto_tests/tools/windows_cachyos_postpacstrap_windows.py
      - auto_tests/tools/windows_cachyos_bcd_ab_control.py
      - auto_tests/test_windows_cachyos_postpacstrap_windows.py
      - auto_tests/test_windows_cachyos_bcd_ab_control.py
      - auto_tests/tools/cachyos_windows_archiso_signed_plan_lab.py
      - auto_tests/tools/cachyos_windows_shared_archiso_handoff.py
      - auto_tests/tools/cachyos_windows_shared_archiso_guest_probe.py
      - auto_tests/tools/cachyos_windows_shared_gpt_raw_audit.py
      - auto_tests/tools/cachyos_generated_boot_config.py
      - assets/live/cachyos-archiso-handoff.py
      - auto_tests/test_cachyos_archiso_handoff.py
      - auto_tests/tools/windows_cachyos_postext4_cow_rollback.py
      - auto_tests/tools/windows_cachyos_overlay_reboot.py
      - auto_tests/test_windows_cachyos_overlay_reboot.py
      - auto_tests/tools/gaslux-cachyos-shared-root-install.sh
      - auto_tests/tools/gaslux-cachyos-shared-root-launch.sh
      - auto_tests/test_cachyos_windows_shared_root_pacstrap.py
      - auto_tests/test_cachyos_windows_shared_cow_grant.py
      - auto_tests/test_cachyos_shared_root_pacstrap_host_contract.py
      - auto_tests/test_cachyos_windows_shared_cow_firstboot.py
      - auto_tests/test_cachyos_windows_shared_cow_rw_child.py
      - auto_tests/test_windows_cachyos_postext4_cow_rollback.py
      - assets/live/cachyos-strict-pacman.py
      - assets/live/cachyos-pacman-trust.py
  pull_request:
    paths:
      - .github/workflows/cachyos-windows10-shared-root-pacstrap.yml
      - auto_tests/tools/windows_x64_tcg_firstboot.py
      - auto_tests/tools/cachyos_windows_shared_root_pacstrap.py
      - auto_tests/tools/cachyos_configure_installed.py
      - auto_tests/test_cachyos_configure_installed.py
      - auto_tests/tools/cachyos_windows_shared_cow_grant.py
      - auto_tests/tools/cachyos_windows_shared_root_pacstrap_host.py
      - auto_tests/tools/cachyos_windows_shared_cow_firstboot.py
      - auto_tests/tools/cachyos_windows_shared_cow_rw_child.py
      - auto_tests/tools/windows_cachyos_postpacstrap_windows.py
      - auto_tests/tools/windows_cachyos_bcd_ab_control.py
      - auto_tests/test_windows_cachyos_postpacstrap_windows.py
      - auto_tests/test_windows_cachyos_bcd_ab_control.py
      - auto_tests/tools/cachyos_windows_archiso_signed_plan_lab.py
      - auto_tests/tools/cachyos_windows_shared_archiso_handoff.py
      - auto_tests/tools/cachyos_windows_shared_archiso_guest_probe.py
      - auto_tests/tools/cachyos_generated_boot_config.py
      - assets/live/cachyos-archiso-handoff.py
      - auto_tests/test_cachyos_archiso_handoff.py
      - auto_tests/tools/windows_cachyos_postext4_cow_rollback.py
      - auto_tests/test_cachyos_windows_shared_root_pacstrap.py
      - auto_tests/test_cachyos_windows_shared_cow_grant.py
      - auto_tests/test_cachyos_shared_root_pacstrap_host_contract.py
      - auto_tests/test_cachyos_windows_shared_cow_firstboot.py
      - auto_tests/test_cachyos_windows_shared_cow_rw_child.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Separate bounded-apt retry from an earlier unbounded setup job; never
  # cancel a guest run while it may be writing its own disposable COW.
  group: cachyos-shared-root-pacstrap-verified-official-mirror-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-and-synthetic-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile source and install isolated test utilities
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-utils
          python3 -m py_compile \
            auto_tests/tools/windows_x64_tcg_firstboot.py \
            auto_tests/tools/cachyos_windows_shared_root_pacstrap.py \
            auto_tests/tools/cachyos_configure_installed.py \
            auto_tests/test_cachyos_configure_installed.py \
            auto_tests/tools/cachyos_windows_shared_cow_grant.py \
            auto_tests/tools/cachyos_windows_shared_root_pacstrap_host.py \
            auto_tests/tools/cachyos_windows_shared_cow_firstboot.py \
            auto_tests/tools/cachyos_windows_shared_cow_rw_child.py \
            auto_tests/tools/windows_cachyos_postpacstrap_windows.py \
            auto_tests/tools/windows_cachyos_bcd_ab_control.py \
            auto_tests/test_windows_cachyos_bcd_ab_control.py \
            auto_tests/test_windows_cachyos_postpacstrap_windows.py \
            auto_tests/tools/cachyos_windows_archiso_signed_plan_lab.py \
            auto_tests/tools/cachyos_windows_shared_archiso_handoff.py \
            auto_tests/tools/cachyos_windows_shared_archiso_guest_probe.py \
            auto_tests/tools/cachyos_windows_shared_gpt_raw_audit.py \
            auto_tests/tools/cachyos_generated_boot_config.py \
            auto_tests/tools/windows_cachyos_postext4_cow_rollback.py \
            auto_tests/test_cachyos_windows_shared_root_pacstrap.py \
            auto_tests/test_cachyos_windows_shared_cow_grant.py \
            auto_tests/test_cachyos_shared_root_pacstrap_host_contract.py \
            auto_tests/test_cachyos_windows_shared_cow_firstboot.py \
            auto_tests/test_cachyos_windows_shared_cow_rw_child.py \
            auto_tests/test_windows_cachyos_postext4_cow_rollback.py \
            assets/live/cachyos-strict-pacman.py \
            assets/live/cachyos-pacman-trust.py
          bash -n auto_tests/tools/gaslux-cachyos-shared-root-install.sh
          bash -n auto_tests/tools/gaslux-cachyos-shared-root-launch.sh
      - name: Run signed grant, GPT, pacman and rollback regression suites
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s auto_tests -p 'test_cachyos_windows_shared_root_pacstrap.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_cachyos_configure_installed.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_cachyos_windows_shared_cow_grant.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_cachyos_shared_root_pacstrap_host_contract.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_cachyos_windows_shared_cow_firstboot.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_cachyos_windows_shared_cow_rw_child.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_windows_cachyos_postpacstrap_windows.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_windows_cachyos_bcd_ab_control.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_windows_cachyos_postext4_cow_rollback.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_windows_cachyos_postext4_windows.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_windows_cachyos_overlay_ext4_only.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_windows_cachyos_overlay_reboot.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_windows_cachyos_overlay_gpt_stage.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_windows_cachyos_cow_checkpoint.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_cachyos_windows_shared_archiso_handoff.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_cachyos_archiso_handoff.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_cachyos_windows_shared_archiso_guest_probe.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_cachyos_strict_pacman.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_cachyos_pacman_trust.py' -v
          python3 -m unittest discover -s auto_tests -p 'test_windows_cachyos_qcow2_gpt_readonly.py' -v
          if grep -En '(^|[[:space:]])(sgdisk[[:space:]]+--clear|mkfs\\.|grub-install|efibootmgr[[:space:]]+-c)' auto_tests/tools/cachyos_windows_shared_root_pacstrap.py; then
            echo 'Unsafe whole-disk, filesystem-format or ESP bootloader mutation in shared-root backend' >&2
            exit 1
          fi
          echo 'PASS: signed grant and synthetic contracts only; the real guest job below is the only pacstrap writer.' >> "$GITHUB_STEP_SUMMARY"

  real-windows10-archiso-pacstrap-and-discard:
    # Run the expensive guest proof on push as before, and on this exact same-repository
    # experimental PR only. No secrets are exposed; all writable storage is disposable QCOW2.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'fix/cachyos-configured-root-grant-binding-issue3' &&
       github.event.pull_request.base.ref == 'feature/cachyos-shared-cow-installed-readonly-boot-issue3')
    needs: static-and-synthetic-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 220
    env:
      PYTHONUNBUFFERED: '1'
      GASLUX_WINDOWS_KVM_CONSENT: I_ACCEPT_DISPOSABLE_GITHUB_KVM_ONLY
      GASLUX_WINDOWS_TWO_STAGE_INSTALL_CONSENT: I_ACCEPT_DISPOSABLE_GITHUB_KVM_DVD_THEN_DISK_ONLY
      GASLUX_WINDOWS_COW_CHECKPOINT_CONSENT: I_ACCEPT_GITHUB_HOSTED_POSTBOOT_OVERLAY_ONLY
      GASLUX_CACHYOS_OVERLAY_GPT_CONSENT: I_ACCEPT_DISPOSABLE_QCOW2_OVERLAY_GPT_ONLY
      GASLUX_WINDOWS_OVERLAY_REBOOT_CONSENT: I_ACCEPT_WINDOWS_GUEST_REBOOT_ON_PRIVATE_GPT_OVERLAY_ONLY
      GASLUX_CACHYOS_OVERLAY_EXT4_CONSENT: I_ACCEPT_EXT4_ONLY_FIFTH_PARTITION_ON_HOSTED_WIN10_COW
      GASLUX_WINDOWS_POST_EXT4_REBOOT_CONSENT: I_ACCEPT_WINDOWS_FOURTH_GUEST_ON_EXT4_ONLY_QCOW2_COW
      GASLUX_WINDOWS_POST_EXT4_COW_DISCARD_CONSENT: I_ACCEPT_COW_EXT4_DISCARD_AND_INDEPENDENT_WINDOWS_BASELINE_REBOOT
      GASLUX_CACHYOS_ARCHISO_READONLY_CONSENT: I_ACCEPT_PINNED_ARCHISO_READONLY_WINDOWS10_QCOW2_COW
      GASLUX_CACHYOS_SHARED_ROOT_PACSTRAP_CONSENT: I_ACCEPT_CACHYOS_SHARED_ROOT_PACSTRAP_ON_DISPOSABLE_WINDOWS_COW
      GASLUX_CACHYOS_INSTALLED_RO_BOOT_CONSENT: I_ACCEPT_READONLY_CACHYOS_INSTALLED_ROOT_POWER_OFF_VM_ONLY
      GASLUX_CACHYOS_RW_CHILD_CONSENT: I_ACCEPT_CHILD_QCOW2_WRITABLE_CACHYOS_FIRSTBOOT_VM_ONLY
      GASLUX_CACHYOS_POST_PACSTRAP_WINDOWS_CONSENT: I_ACCEPT_WIN10_BOOT_WITH_INSTALLED_CACHYOS_FIFTH_ROOT_ON_DISPOSABLE_COW
      GASLUX_CACHYOS_BCD_AB_CONTROL_CONSENT: I_ACCEPT_WINDOWS_ONLY_BCD_AB_CONTROL_ON_DISPOSABLE_COW
      GASLUX_CACHYOS_VERIFIED_ISO_SHA256: '959f6577f45e25ee9fd8c220fd221b08e4ea79412c7315c0f922dd6d86d5e33c'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare genuine Windows KVM and CachyOS Archiso dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$GITHUB_REPOSITORY" = LMhdez/gaslux
          test "$(uname -m)" = x86_64
          # GitHub hosted Ubuntu mirrors currently point at the slow EC2
          # regional archive. Switch ONLY the runner's root-owned mirrorlist
          # to Canonical's official HTTPS archive. Keep the existing deb822
          # Signed-By key and all APT Release/Packages signature/hash checks.
          # Never rewrite a foreign or unverified source configuration.
          mirrorlist=/etc/apt/apt-mirrors.txt
          sources=/etc/apt/sources.list.d/ubuntu.sources
          [[ -f "$mirrorlist" && ! -L "$mirrorlist" &&
             -f "$sources" && ! -L "$sources" &&
             -f /usr/share/keyrings/ubuntu-archive-keyring.gpg ]] || {
            echo 'Refusing untrusted GitHub runner Ubuntu sources' >&2; exit 1;
          }
          grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' "$sources"
          grep -Fq 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' "$sources"
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' |
            sudo tee "$mirrorlist" >/dev/null
          [[ "$(wc -l < "$mirrorlist")" == 1 ]]
          grep -Fxq 'https://archive.ubuntu.com/ubuntu/' "$mirrorlist"
          # APT still validates the Ubuntu archive signatures; never allow
          # insecure repos or unauthenticated packages on this disposable VM.
          # Bound hosted apt mirror stalls before ANY guest disk writes.
          timeout --kill-after=10s 300s sudo apt-get \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=60 \
            -o Acquire::https::Timeout=60 update -qq
          # ubuntu-24.04 runners require a complete generic kernel for
          # libguestfs/supermin. The generic *meta* package additionally pulls
          # huge linux-firmware archives that the isolated virtio appliance
          # neither boots nor needs. Resolve the exact signed kernel via apt's
          # currently authenticated Noble metadata, with matching extra modules.
          generic_kernel="$(apt-cache depends linux-image-generic |
            awk '$1 == "Depends:" && $2 ~ /^linux-image-[0-9]+[.][0-9]+[.][0-9]+-[0-9]+-generic$/ { print $2; exit }')"
          [[ "$generic_kernel" =~ ^linux-image-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-generic$ ]] || {
            echo 'Refusing unresolvable signed Ubuntu generic kernel' >&2; exit 1;
          }
          extra_modules="linux-modules-extra-${generic_kernel#linux-image-}"
          apt-cache show "$generic_kernel" "$extra_modules" >/dev/null
          if apt-cache depends "$generic_kernel" "$extra_modules" |
              grep -Eq '^[[:space:]]*Depends: linux-firmware([[:space:]]|$)'; then
            echo 'Kernel packaging unexpectedly requires firmware; fail closed' >&2
            exit 1
          fi
          timeout --kill-after=10s 1800s sudo DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=60 \
            -o Acquire::https::Timeout=60 install -y --no-install-recommends \
            aria2 qemu-system-x86 qemu-utils ovmf swtpm gdisk \
            dosfstools mtools p7zip-full genisoimage \
            python3-guestfs libguestfs-tools "$generic_kernel" "$extra_modules" \
            grub-efi-amd64-bin grub-common e2fsprogs openssl swtpm swtpm-tools
          test -c /dev/kvm && test ! -L /dev/kvm
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          install -d -m 0700 "$GITHUB_WORKSPACE/windows-x64-tcg-evidence"
      - name: Download pinned official CachyOS 260809 ISO
        shell: bash
        run: |
          set -Eeuo pipefail
          workspace="$(mktemp -d -p "$RUNNER_TEMP" gaslux-pinned-cachyos-XXXXXXXX)"
          chmod 0700 "$workspace"
          {
            printf '%s\t%s\n' 'https://mirror.limda.net/cachy/ISO/desktop/260809/cachyos-desktop-linux-260809.iso' 'https://mirror.nju.edu.cn/cachyos/ISO/desktop/260809/cachyos-desktop-linux-260809.iso'
            printf '  dir=%s\n' "$workspace"
            printf '  out=cachyos.iso\n'
          } > "$workspace/mirrors.txt"
          aria2c --input-file="$workspace/mirrors.txt" \
            --split=8 --min-split-size=32M --max-connection-per-server=8 \
            --max-concurrent-downloads=1 --continue=true \
            --file-allocation=none --retry-wait=8 --max-tries=8 \
            --timeout=45 --connect-timeout=25 \
            --check-integrity --checksum="sha-256=$GASLUX_CACHYOS_VERIFIED_ISO_SHA256"
          printf '%s  %s\n' "$GASLUX_CACHYOS_VERIFIED_ISO_SHA256" "$workspace/cachyos.iso" | sha256sum -c --status
          echo "GASLUX_CACHYOS_VERIFIED_ISO_PATH=$workspace/cachyos.iso" >> "$GITHUB_ENV"
          echo 'Pinned official CachyOS desktop ISO SHA-256 VERIFIED.' >> "$GITHUB_STEP_SUMMARY"
      - name: Run Windows 10 fourth boot, signed Archiso pacstrap on fifth ext4, then discard COW
        shell: bash
        run: |
          set -Eeuo pipefail
          source auto_tests/tools/windows_x64_libguestfs_kernel.sh
          export GASLUX_WINDOWS_EVIDENCE="$GITHUB_WORKSPACE/windows-x64-tcg-evidence"
          python3 auto_tests/tools/windows_x64_tcg_firstboot.py \
            --profile win10_22h2_en_us_x64 --accel kvm \
            --derived-no-prompt --two-stage-install-only --boot-timeout 4800 \
            --prepare-owned-cow-checkpoint \
            --stage-cachyos-overlay-root-gpt-only \
            --verify-windows-reboot-with-fifth-gpt \
            --format-owned-fifth-ext4-only \
            --verify-windows-reboot-after-ext4 \
            --run-cachyos-shared-root-pacstrap
      - name: Independently gate pacstrap, Windows integrity and disposable COW recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("windows-x64-tcg-evidence")
          profile = "win10_22h2_en_us_x64"
          report = json.loads((root / (profile + "-result.json")).read_text())
          assert report["windowsClientBootVerified"] is True
          assert report["windowsBootAfterExt4Verified"] is True
          assert report["cachyosRootPacstrapped"] is True
          assert report["windowsBootAfterPacstrapOverlayDiscardVerified"] is True
          for denied in (
              "cachyosInstalled", "cachyosFirstBootVerified",
              "sameDiskDualBootVerified", "windowsRecoveryAfterLinuxVerified",
              "rollbackProven", "productionStorageWritesAuthorized", "releaseEligible",
          ):
              assert report[denied] is False, denied
          pacstrap = json.loads((root / (profile + "-cachyos-shared-root-pacstrap.json")).read_text())
          assert pacstrap["rootWriteGrantIssued"] is True
          assert pacstrap["pacstrapExecuted"] is True
          assert pacstrap["labOnlyPacstrapCompleted"] is True
          assert pacstrap["cachyosRootPacstrapped"] is True
          assert pacstrap["minimalInstalledReadOnlyBootVerified"] is True
          assert pacstrap["installedReadOnlyBootWindowsCOWUnchanged"] is True
          assert pacstrap["installedReadOnlyBootWindowsNVRAMUnchanged"] is True
          assert pacstrap["installedReadOnlyBootEFIUnchanged"] is True
          # RW guest may write ONLY a new disposable child QCOW2; all original
          # Windows and installed-Linux parent images stay byte-identical.
          assert pacstrap["installedWritableChildKernelAndSystemdBootVerified"] is True
          assert pacstrap["installedWritableChildNativeRootMarkerVerified"] is True
          assert pacstrap["installedWritableChildSecondBootVerified"] is True
          assert pacstrap["installedWritableChildSecondBootPersistentMarkerVerified"] is True
          assert pacstrap["installedWritableChildWindowsGptUnchanged"] is True
          assert pacstrap["installedWritableChildWindowsProtectedHashesUnchanged"] is True
          assert pacstrap["installedWritableChildParentCOWUnchanged"] is True
          assert pacstrap["installedWritableChildBaseWindowsUnchanged"] is True
          assert pacstrap["installedWritableChildOverlayDiscarded"] is True
          assert pacstrap["firstBootWithWritableSystemVerified"] is False
          assert pacstrap["firstBootWithWritableSystemVerified"] is False
          assert pacstrap["installedReadOnlyBootloaderInstalledToWindowsESP"] is False
          assert pacstrap["nativeCachyOSOsReleaseVerified"] is True
          assert pacstrap["nativeKernelAndInitramfsPresent"] is True
          assert pacstrap["strictInstalledPacmanPolicyVerified"] is True
          assert pacstrap["windowsGptUnchangedAfterPacstrap"] is True
          assert pacstrap["windowsProtectedHashesUnchangedAfterPacstrap"] is True
          assert pacstrap["windowsBaseSha256UnchangedAfterPacstrap"] is True
          assert pacstrap["originalWindowsUefiUnchangedAfterPacstrap"] is True
          assert pacstrap["windowsEspWritesAllowed"] is False
          assert pacstrap["efiBootloaderInstalled"] is False
          assert pacstrap["sameDiskDualBootVerified"] is False
          # Arm A is Windows-only; arm B is the matched Archiso/pacstrap
          # treatment. Both start after the same fourth Windows boot and each
          # performs exactly one fifth Windows boot with independent VARS/TPM.
          ab = pacstrap["bcdAbControl"]
          for key in (
              "controlWindowsBootVerified", "sameWindowsBootCountVerified",
              "sameCheckpointDiskCloneVerified", "sameCheckpointGuestVisibleDiskVerified",
              "sameCheckpointPrimaryAndSecondaryGptVerified",
              "controlAndTreatmentInitialGptEqual",
              "controlAndTreatmentInitialProtectedHashesEqual",
              "controlAndTreatmentInitialBcdEqual",
              "controlOtherProtectedHashesUnchanged", "controlWindowsGptUnchanged",
              "controlFifthExt4IdentityPreserved",
              "controlWindowsBackingAndOriginalNVRAMUnchanged",
              "sameImmutableWindowsBackingImageVerified", "treatmentArmUntouchedByControlVerified",
              "controlBcdReadOnlyBytesMatchProtectedHash", "controlAndTreatmentInitialTpmStateEqual",
              "independentOvmfCopiesVerified", "controlAndTreatmentInitialOvmfVarsEqual",
              "independentTpmStateClonesVerified", "matchedArmsUseSameFreshTpm2Baseline",
              "sameQemuArgumentsExceptOwnedPathsVerified",
          ):
              assert ab[key] is True, key
          assert ab["controlWindowsBootOrdinal"] == ab["treatmentWindowsBootOrdinal"] == 5
          assert ab["previousWindows10ProfileHadNoTpm"] is True
          assert ab["tpmVersion"] == "2.0"
          if ab["qemuWriteTraceBackendAvailable"] is True:
              events = root / (profile + "-bcd-ab-qemu-write-events.txt")
              assert events.is_file() and not events.is_symlink()
              events_digest, events_name = events.with_suffix(".sha256").read_text().split()
              assert events_name == events.name
              assert events_digest == hashlib.sha256(events.read_bytes()).hexdigest()
              if ab.get("controlQemuWriteTraceSha256"):
                  trace = root / (profile + "-bcd-control-windows-only-qemu-trace.bin")
                  assert trace.is_file() and not trace.is_symlink()
                  assert hashlib.sha256(trace.read_bytes()).hexdigest() == ab["controlQemuWriteTraceSha256"]
          control_serial = root / (profile + "-bcd-control-windows-only-serial.log")
          assert control_serial.is_file() and not control_serial.is_symlink()
          control_recorded, control_name = control_serial.with_suffix(".sha256").read_text().split()
          assert control_name == control_serial.name
          assert control_recorded == hashlib.sha256(control_serial.read_bytes()).hexdigest()
          from windows_cachyos_overlay_reboot import audit_complete_third_serial
          assert audit_complete_third_serial(control_serial) == control_recorded
          assert control_recorded == ab["controlWindowsSerialSha256"]
          assert control_serial.read_bytes().splitlines().count(
              b"GASLUX_COW_WIN10_REBOOT_FIFTH_GPT=1") == 1

          side = json.loads((root / (profile + "-post-pacstrap-windows-with-linux.json")).read_text())
          assert side["cachyosBootloaderInstalledToWindowsEsp"] is False
          assert side["sameDiskDualBootVerified"] is False
          assert side["rollbackProven"] is False
          if side.get("windowsBootWithPacstrappedCachyosOnSameDiskVerified") is True:
              assert side["installedCachyosRootSurvivedWindowsBoot"] is True
              assert side["windowsProtectedFilesAndGptAfterReentryUnchanged"] is True
              assert side["windowsBaseAndOriginalNvramAfterReentryUnchanged"] is True
              assert side["windowsEfiBootManagerUsed"] is True
              treatment_bcd = side["bcdReadOnlyForensic"]
          else:
              assert side["failureType"] == "PostPacstrapWindowsError"
              diagnosis = side["readonlyDiagnostics"]
              assert diagnosis["postbootGptMatchesSignedPlan"] is True
              assert diagnosis["postbootInstalledRootAndBackingPreserved"] is True
              assert diagnosis["protectedFileHashMismatchKeys"] == ["espBcdSha256"]
              treatment_bcd = diagnosis["bcdReadOnlyForensic"]
          comparison = side["bcdAbComparison"]
          assert comparison["initialBcdEqual"] is True
          assert comparison["processAttributionProven"] is False
          assert comparison["approvedMutation"] is False
          assert comparison["classification"] != "INVALID_INITIAL_BCD_MISMATCH"
          assert comparison["controlBcdChanged"] == (
              ab["controlBcdForensic"]["changedByteCount"] > 0
          )
          assert comparison["treatmentBcdChanged"] == (treatment_bcd["changedByteCount"] > 0)

          sixth = root / (profile + "-sixth-post-pacstrap-windows-serial.log")
          assert sixth.is_file() and not sixth.is_symlink()
          recorded, name = sixth.with_suffix(".sha256").read_text().split()
          assert name == sixth.name
          assert recorded == hashlib.sha256(sixth.read_bytes()).hexdigest()
          assert audit_complete_third_serial(sixth) == recorded
          assert sixth.read_bytes().splitlines().count(
              b"GASLUX_COW_WIN10_REBOOT_FIFTH_GPT=1") == 1
          if side.get("windowsPostPacstrapSerialSha256"):
              assert recorded == side["windowsPostPacstrapSerialSha256"]
          treatment_trace_sha = side.get("qemuWriteTraceSha256") or side.get(
              "readonlyDiagnostics", {}
          ).get("qemuWriteTraceSha256")
          if treatment_trace_sha:
              treatment_trace = root / (profile + "-sixth-post-pacstrap-qemu-trace.bin")
              assert treatment_trace.is_file() and not treatment_trace.is_symlink()
              assert hashlib.sha256(treatment_trace.read_bytes()).hexdigest() == treatment_trace_sha
          # Integrity remains fail-closed even if Windows-only control
          # reproduces the exact same BCD mutation.
          if comparison["controlBcdChanged"] or comparison["treatmentBcdChanged"]:
