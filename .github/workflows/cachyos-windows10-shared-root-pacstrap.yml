          discard = json.loads((root / (profile + "-post-pacstrap-cow-discard.json")).read_text())
          assert discard["ownedExt4OverlayDiscarded"] is True
          assert discard["windowsBaselineFourGptVerifiedAfterDiscard"] is True
          assert discard["windowsFifthGuestBootAfterExt4DiscardVerified"] is True
          assert discard["windowsBcdWinreEspAfterExt4DiscardVerified"] is True
          assert discard["windowsBackingQcow2Sha256Unchanged"] is True
          assert discard["originalWindowsUefiUnchangedAfterDiscard"] is True
          assert discard["windowsInPlaceRecoveryVerified"] is False
          assert discard["rollbackProven"] is False
          serial = root / (profile + "-cachyos-root-pacstrap-serial.log")
          assert serial.is_file() and not serial.is_symlink()
          raw = serial.read_bytes()
          assert raw.count(b"GASLUX_SHARED_COW_NATIVE_CACHYOS_PACSTRAP_ROOT_ONLY=1") == 1
          assert raw.count(b"GASLUX_SHARED_COW_ESP_BOOTLOADER_NOT_INSTALLED=1") == 1
          assert b"GASLUX_SHARED_COW_ROOT_PACSTRAP_FAILED" not in raw
          installed_serial = root / (profile + "-cachyos-installed-readonly-serial.log")
          assert installed_serial.is_file() and not installed_serial.is_symlink()
          installed_manifest = installed_serial.with_suffix(".sha256")
          assert installed_manifest.is_file() and not installed_manifest.is_symlink()
          installed_digest, installed_name = installed_manifest.read_text().split()
          assert installed_name == installed_serial.name
          assert installed_digest == hashlib.sha256(installed_serial.read_bytes()).hexdigest()
          assert installed_digest == pacstrap["installedReadOnlyBootSerialSha256"]
          installed_raw = installed_serial.read_bytes()
          # Independently bind the installed-boot COM1 to the fifth ext4 UUID
          # audited before pacstrap. Reuse the tested native kernel/systemd
          # witness checker; an initrd-only or GRUB-only shutdown is not valid.
          ext4 = json.loads((root / (profile + "-fifth-ext4-only.json")).read_text())
          assert ext4["onlyOwnedOverlayFifthPartitionFormatted"] is True
          expected_root_uuid = ext4["rootFilesystem"]["filesystemUuid"]
          import sys
          sys.path.insert(0, "auto_tests/tools")
          from cachyos_windows_shared_cow_firstboot import verify_installed_poweroff_serial
          verify_installed_poweroff_serial(installed_raw, expected_root_uuid)
          assert installed_raw.count(
              ("GASLUX_VM_INSTALLED_ROOT_UUID_SELECTED:" + expected_root_uuid).encode("ascii")
          ) == 1
          assert b"Switch Root" in installed_raw
          assert b"System Power Off" in installed_raw
          assert (b"Powering off." in installed_raw
                  or b"reboot: Power down" in installed_raw)
          assert b"Kernel panic" not in installed_raw
          child_serial = root / (profile + "-cachyos-installed-rw-child-serial.log")
