          assert child_digest == pacstrap["installedWritableChildSerialSha256"]
          from cachyos_windows_shared_cow_rw_child import verify_rw_serial
          verify_rw_serial(child_raw, pacstrap["installedWritableChildRunId"], expected_root_uuid)
          assert b"Kernel panic" not in child_raw
          second_serial = root / (profile + "-cachyos-installed-rw-child-second-serial.log")
          assert second_serial.is_file() and not second_serial.is_symlink()
          second_manifest = second_serial.with_suffix(".sha256")
          assert second_manifest.is_file() and not second_manifest.is_symlink()
          second_digest, second_name = second_manifest.read_text().split()
