name: Observer synthetic boundary - offline deny-only

on:
  push:
    branches:
      - dev
      - integration/observer-synthetic-boundary-offline-dev-20261122
      - integration/observer-screenshot-readonly-dev-20261122
    paths:
      - '.github/workflows/observer-synthetic-boundary-offline.yml'
      - 'auto_tests/installer_observer/__init__.py'
      - 'auto_tests/installer_observer/evidence.py'
      - 'auto_tests/installer_observer/boundary_model.py'
      - 'auto_tests/installer_observer/screenshot.py'
      - 'auto_tests/tests/test_observer_screenshot_dev_integration.py'
      - 'auto_tests/tests/test_observer_boundary_model.py'
      - 'auto_tests/tests/test_observer_boundary_dev_integration.py'
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/observer-synthetic-boundary-offline.yml'
      - 'auto_tests/installer_observer/__init__.py'
      - 'auto_tests/installer_observer/evidence.py'
      - 'auto_tests/installer_observer/boundary_model.py'
      - 'auto_tests/installer_observer/screenshot.py'
      - 'auto_tests/tests/test_observer_screenshot_dev_integration.py'
      - 'auto_tests/tests/test_observer_boundary_model.py'
      - 'auto_tests/tests/test_observer_boundary_dev_integration.py'

permissions:
  contents: read

jobs:
  offline-deny-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install offline contract dependencies
        run: python -m pip install --disable-pip-version-check 'pytest>=9,<10' 'ruff>=0.8,<1' 'jsonschema>=4,<5' 'pillow>=11,<13'
      - name: Compile and lint imported Observer files
        run: |
          set -Eeuo pipefail
          python -m compileall -q auto_tests/installer_observer auto_tests/tests/test_observer_boundary_model.py auto_tests/tests/test_observer_boundary_dev_integration.py auto_tests/tests/test_observer_screenshot_dev_integration.py
          python -m ruff check --config auto_tests/pyproject.toml auto_tests/installer_observer auto_tests/tests/test_observer_boundary_model.py auto_tests/tests/test_observer_boundary_dev_integration.py auto_tests/tests/test_observer_screenshot_dev_integration.py
          python -m ruff format --check --config auto_tests/pyproject.toml auto_tests/installer_observer auto_tests/tests/test_observer_boundary_model.py auto_tests/tests/test_observer_boundary_dev_integration.py auto_tests/tests/test_observer_screenshot_dev_integration.py
      - name: Exercise boundary attacks and Mint/Zorin baseline contracts without guests
        run: |
          set -Eeuo pipefail
          python -m pytest -q \
            auto_tests/tests/test_observer_boundary_model.py \
            auto_tests/tests/test_observer_boundary_dev_integration.py \
            auto_tests/tests/test_observer_screenshot_dev_integration.py \
            auto_tests/tests/test_installation_contracts.py \
            auto_tests/tests/test_live_storage_preflight.py
