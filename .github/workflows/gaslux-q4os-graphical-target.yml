name: Q4OS native graphical target reconnaissance (disposable VM only)

on:
  push:
    branches:
      - feature/q4os-graphical-native-target-vm
    paths:
      - '.github/workflows/gaslux-q4os-graphical-target.yml'
      - 'auto_tests/tools/gaslux_q4os_graphical_lab.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graphical-installer-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install disposable QEMU, OVMF, GRUB and screenshot tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends aria2 squashfs-tools xorriso ovmf qemu-system-x86 grub-common grub-efi-amd64-bin mtools dosfstools gdisk
          python3 -m pip install --user vncdotool Pillow
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Download and re-verify pinned Q4OS 6.10 r2 native ISO
        shell: bash
        env:
          Q4OS_SHA256: 1df141eaa342bbfd0092791a60f1ae9cf5230e8ebb472f87fcb463203e3eb95d
          Q4OS_SOURCE: https://downloads.sourceforge.net/project/q4os/stable/q4os-6.10-x64.r2.iso
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/q4os-native-target"
          cd "$RUNNER_TEMP/q4os-native-target"
          aria2c --continue=true --split=4 --max-connection-per-server=4 --max-tries=5 --retry-wait=8 --timeout=60 --connect-timeout=30 --file-allocation=none --check-integrity=true --checksum="sha-256=$Q4OS_SHA256" -o q4os.iso "$Q4OS_SOURCE"
          printf '%s  %s\\n' "$Q4OS_SHA256" q4os.iso | sha256sum --check --status
          echo "GASLUX_Q4OS_ISO=$RUNNER_TEMP/q4os-native-target/q4os.iso" >> "$GITHUB_ENV"
      - name: Boot graphical Q4OS with ONE isolated writable virtual target and screenshot VNC
        shell: bash
        env:
          Q4OS_SHA256: 1df141eaa342bbfd0092791a60f1ae9cf5230e8ebb472f87fcb463203e3eb95d
          GASLUX_Q4OS_GRAPHICS_LAB_ONLY: '1'
          GASLUX_CANDIDATE_BOOT_EVIDENCE_DIR: ${{ runner.temp }}/q4os-native-target/evidence
        run: |
          set -Eeuo pipefail
          bash -n auto_tests/tools/gaslux_q4os_graphical_lab.sh
          bash auto_tests/tools/gaslux_q4os_graphical_lab.sh q4os "$GASLUX_Q4OS_ISO" "$Q4OS_SHA256"
      - name: Preserve graphical proof, serial kernel logs and SHA manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q4os-graphical-target-reconnaissance
          path: ${{ runner.temp }}/q4os-native-target/evidence/
          if-no-files-found: warn
          retention-days: 7
