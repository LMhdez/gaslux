  <rect width="276" height="195" rx="22" fill="#12283E" stroke="#32546B" stroke-width="2"/>
  <rect x="21" y="20" width="58" height="43" rx="14" fill="#203F55"/>
  <text x="50" y="48" text-anchor="middle" fill="#57E7C7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800">04</text>
