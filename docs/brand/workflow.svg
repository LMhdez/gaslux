 </g><path d="M929 205h15" stroke="#59BCCA" stroke-width="3" stroke-linecap="round"/><path d="M939 198l8 7-8 7" stroke="#59BCCA" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
