  <text x="50" y="48" text-anchor="middle" fill="#FFB45A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800">05</text>
  <text x="22" y="108" fill="#F1F8FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="750">Prove</text>
  <text x="22" y="143" fill="#A9C6D9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Linux + Windows,</text>
  <text x="22" y="170" fill="#A9C6D9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">updates &amp; rollback</text>
