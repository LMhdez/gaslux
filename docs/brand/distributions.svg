<title id="title">Gaslux distribution development status</title>
<desc id="desc">Linux Mint and Zorin use the inherited Libertix backend. CachyOS is experimental. Pop OS, Q4OS, and Bazzite are planned. No new distribution is certified for stable release.</desc>
